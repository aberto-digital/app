<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agendar</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101A2C">
<link rel="icon" id="fav" href="https://app.abertodigital.com/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../experiencia/experiencia.css?v=2">
<link rel="stylesheet" href="../experiencia/pedido.css?v=4">
<style>
  [data-m] .barra-carrinho{bottom:calc(12px + env(safe-area-inset-bottom))}
  .vis img{width:100%;height:100%;object-fit:cover}
  .sem-foto{display:grid;place-items:center;font-size:44px;width:100%;height:100%}
  .carregando,.erro-pag{max-width:560px;margin:40px auto;padding:0 18px;text-align:center;color:var(--sec)}
  .caixa-simples{max-width:560px;margin:24px auto;padding:20px;background:#fff;border-radius:18px;box-shadow:0 6px 24px rgba(16,26,44,.08)}
  .dias{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
  .dia{flex:none;width:64px;border:1.5px solid var(--linha,#E2E6EE);border-radius:12px;padding:8px 4px;text-align:center;background:#fff;cursor:pointer;font:inherit;color:inherit}
  .dia small{display:block;color:var(--sec);font-size:12px;text-transform:capitalize}.dia b{font-size:20px}
  .dia[aria-pressed="true"]{border-color:var(--cor);background:var(--cor);color:var(--cor-texto)}.dia[aria-pressed="true"] small{color:var(--cor-texto);opacity:.85}
  .horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
  .hora{border:1.5px solid var(--linha,#E2E6EE);border-radius:10px;padding:10px 0;background:#fff;font:inherit;font-weight:700;cursor:pointer;color:inherit}
  .hora[aria-pressed="true"]{border-color:var(--cor);background:var(--cor);color:var(--cor-texto)}
  .passo-t{font-weight:800;margin:16px 0 8px}
  .nota{color:var(--sec);font-size:14px}.vazio{color:var(--sec);font-size:14px}
  .cons{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--sec);margin-top:10px}.cons input{margin-top:3px}
  .hp{position:absolute;left:-9999px;opacity:0}
  .ok-env{text-align:center;padding:10px 4px}.ok-env .ok{width:56px;height:56px;border-radius:50%;background:var(--cor);color:var(--cor-texto);display:grid;place-items:center;font-size:28px;margin:0 auto 10px}
  .resumo{background:#F4F6FA;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14.5px;text-align:left}
  .btn.sec{background:#fff;color:#C2341D;border:1.5px solid #F1C6BE}
  .btn:disabled{opacity:.5}
  .erro{color:#C2341D;font-size:14px;margin-top:10px}
  .sac-card .lr{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #EEF1F6;font-size:14px}.sac-card .lr:last-of-type{border:0}.sac-card .lr span:first-child{color:var(--sec)}.sac-card .lr b{text-align:right}
</style>
</head>
<body data-m="pedido">
<header class="topo">
  <div class="linha1">
    <div class="logo" data-logo></div>
    <div><h1 data-nome>…</h1><div class="sub" id="sub"></div></div>
  </div>
  <div class="titulo" id="titulo"></div>
  <p class="chamada" id="chamada"></p>
</header>
<main id="conteudo"><p class="carregando">Carregando…</p></main>
<script src="../experiencia/marca.js?v=2"></script>
<script>
(function(){
  'use strict';
  var NOSSO = /(^|\.)abertodigital\.com$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);
  var API = (function(){ try { return localStorage.getItem('abertocore-api'); } catch (e) { return null; } })() || (NOSSO ? 'https://api.abertodigital.com' : location.origin);
  var q = new URLSearchParams(location.search), slug = (q.get('e') || '').toLowerCase(), tokCancel = q.get('cancelar');
  var doc = document, main = doc.getElementById('conteudo');
  var EMOJI = {'Pacote':'📦','Módulo':'🧩','Serviço':'🛠️','Produto':'🛍️'};
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function api(m, u, b){
    return fetch(API + u, {method:m, headers:b ? {'Content-Type':'application/json'} : {}, body:b ? JSON.stringify(b) : undefined})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if (!r.ok) throw new Error(j.message || 'Não deu certo. Tente de novo.'); return j; }); });
  }
  function brl(v){ return v == null ? '' : v === 0 ? 'Grátis' : Marca.preco(v, 'pt'); }
  function preco(s){
    var t = [];
    if (s.preco) t.push(brl(s.preco)); else if (s.preco === 0 && !s.mensal) t.push('Grátis');
    if (s.mensal) t.push(brl(s.mensal) + '/mês');
    return t.join(' + ') || (s.preco == null ? 'Sob consulta' : '');
  }
  function durTxt(m){ return m < 60 ? m + ' min' : (m % 60 ? Math.floor(m / 60) + 'h' + (m % 60) : (m / 60) + (m === 60 ? ' hora' : ' horas')); }
  function dataLonga(iso){ return new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'}); }
  function visual(s){ return s.foto ? '<img alt="" loading="lazy" decoding="async" src="' + esc(s.foto) + '">' : '<span class="sem-foto" aria-hidden="true">' + (EMOJI[s.tipo] || '🗓️') + '</span>'; }
  function erroPag(msg){ var t = doc.querySelector('.topo'); if (t) t.hidden = true; main.innerHTML = '<p class="erro-pag">' + esc(msg) + '</p>'; }
  function aplicaMarca(j){
    var m = j.marca || {}, cor = m.cor || '#2F6FED';
    Marca.aplica({cor:cor, nome:j.empresa || 'Agendar', logo:m.logo || '', l:'pt'}, doc);
    if (m.fundo) doc.body.style.background = m.fundo;
    doc.querySelector('meta[name=theme-color]').content = cor;
    if (m.logo) doc.getElementById('fav').href = m.logo;
    var s = doc.getElementById('sub');
    if (j.site){ s.innerHTML = '<a href="' + esc(/^https?:/.test(j.site) ? j.site : 'https://' + j.site) + '" style="color:inherit">← Voltar para o site</a>'; }
  }
  function achaSlug(){
    if (slug || NOSSO) return Promise.resolve(slug);
    return api('GET', '/api/agenda-dominio?host=' + encodeURIComponent(location.hostname)).then(function(j){ slug = j.slug; return slug; });
  }

  if (tokCancel) return cancelar();
  var info = null, est = {servico:null, data:null, hora:null}, folha = null;
  achaSlug().then(function(){
    if (!slug) throw new Error('Link incompleto. Peça o link de agendamento para a empresa.');
    return api('GET', '/api/agenda/' + encodeURIComponent(slug));
  }).then(function(j){ info = j; doc.title = 'Agendar · ' + j.empresa; aplicaMarca(j); monta(); }, function(e){ erroPag(e.message); });

  function monta(){
    var S = info.servicos, tipos = [];
    S.forEach(function(s){ var t = s.tipo || 'Serviços'; if (tipos.indexOf(t) < 0) tipos.push(t); });
    doc.getElementById('titulo').textContent = info.titulo || 'Agende seu horário';
    doc.getElementById('chamada').textContent = 'Escolha o serviço, o dia e o horário livres. Confirmação na hora.';
    main.innerHTML = '<div class="menu">' + (tipos.length > 1 ? '<div class="ferr"><nav class="abas">' + tipos.map(function(t, i){ return '<button data-cat="' + i + '" aria-selected="' + (i === 0) + '">' + esc(t) + '</button>'; }).join('') + '</nav></div>' : '') +
      tipos.map(function(t, i){
        return '<section class="cat" id="cat' + i + '"><h2>' + esc(t) + '</h2><div class="grade">' + S.filter(function(s){ return (s.tipo || 'Serviços') === t; }).map(function(s){
          return '<button type="button" class="item" data-s="' + s.id + '"><div class="txt"><b>' + esc(s.nome) + '</b><small>' + esc(s.ds) + '</small><div class="preco">' + esc(preco(s)) + (s.modo === 'agenda' ? ' · ' + durTxt(s.dur) : ' · por orçamento') + '</div></div><div class="ilu vis">' + visual(s) + '</div></button>';
        }).join('') + '</div></section>';
      }).join('') + '<div class="info-loja">' + (info.whatsapp ? '📱 ' + esc(info.whatsapp) : '') + '</div>' +
      '<p class="rodape-demo">Agendamento por <a href="https://abertodigital.com" target="_blank" rel="noopener">AbertoCore · abertodigital</a></p></div>' +
      '<aside class="sacola" id="sacola" aria-label="Seu agendamento"></aside>';
    var barra = doc.createElement('button'); barra.className = 'barra-carrinho oculto'; barra.type = 'button'; doc.body.appendChild(barra);
    folha = doc.createElement('div'); folha.className = 'folha oculto'; doc.body.appendChild(folha);
    folha.addEventListener('click', function(e){ if (e.target === folha || e.target.closest('.fechar-x')) fecha(); });
    doc.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !folha.classList.contains('oculto')) fecha(); });
    barra.onclick = function(){ if (est.servico) abre(); };
    main.addEventListener('click', function(e){
      var s = e.target.closest('[data-s]'), c = e.target.closest('[data-cat]'), k = e.target.closest('[data-reabre]');
      if (s){ est = {servico: info.servicos.filter(function(x){ return x.id === +s.getAttribute('data-s'); })[0], data:null, hora:null}; lado(); abre(); }
      if (k && est.servico) abre();
      if (c){
        main.querySelectorAll('[data-cat]').forEach(function(x){ x.setAttribute('aria-selected', x === c); });
        var el = doc.getElementById('cat' + c.getAttribute('data-cat')); if (el) window.scrollTo({top:el.getBoundingClientRect().top + window.scrollY - 120, behavior:'smooth'});
      }
    });
    lado();
  }
  function lado(){
    var el = doc.getElementById('sacola'), s = est.servico, barra = doc.querySelector('.barra-carrinho');
    el.innerHTML = '<div class="sac-card"><h3>Seu agendamento</h3>' + (s ?
      '<div class="lr"><span>Serviço</span><b>' + esc(s.nome) + '</b></div>' + (s.modo === 'agenda' ? '<div class="lr"><span>Duração</span><b>' + durTxt(s.dur) + '</b></div>' : '') +
      (est.data ? '<div class="lr"><span>Dia</span><b>' + esc(dataLonga(est.data)) + '</b></div>' : '') + (est.hora ? '<div class="lr"><span>Horário</span><b>' + est.hora + '</b></div>' : '') +
      (preco(s) ? '<div class="lr"><span>Valor</span><b>' + esc(preco(s)) + '</b></div>' : '') + '<button type="button" class="btn" data-reabre="1">Continuar</button>' :
      '<div class="sac-vazia"><span aria-hidden="true">🗓️</span><b>Nada escolhido</b><small>Toque em um serviço para começar.</small></div>') + '</div>';
    if (barra){ barra.classList.toggle('oculto', !s); barra.innerHTML = '<span>' + (s ? esc(s.nome) : '') + '</span><span>Continuar</span>'; }
  }
  function abre(){ renderFolha(est.hora || est.servico.modo === 'orcamento' ? 'dados' : 'quando'); }
  function fecha(){ folha.classList.add('oculto'); folha.innerHTML = ''; }
  function caixa(html, cls){ folha.className = 'folha' + (cls ? ' ' + cls : ''); folha.innerHTML = '<div class="caixa" role="dialog" aria-modal="true">' + html + '</div>'; }

  function renderFolha(passo){
    var s = est.servico;
    if (passo === 'quando'){
      caixa('<h2>' + esc(s.nome) + '<button class="fechar fechar-x" aria-label="Fechar">×</button></h2>' + (s.ds ? '<p class="nota">' + esc(s.ds) + '</p>' : '') +
        '<div class="passo-t">Escolha o dia</div><div id="dias"><p class="nota">Procurando dias livres…</p></div><div id="horas"></div>' +
        '<button type="button" class="btn" id="seg" aria-disabled="true">Continuar</button>');
      folha.querySelector('#seg').onclick = function(){ if (est.hora) renderFolha('dados'); };
      carregaDias(); if (est.data) carregaHoras();
    } else {
      var ag = s.modo === 'agenda';
      caixa('<h2>Seus dados<button class="fechar fechar-x" aria-label="Fechar">×</button></h2>' +
        '<div class="resumo"><b>' + esc(s.nome) + '</b>' + (ag ? '<br>' + esc(dataLonga(est.data)) + ', às ' + est.hora : (preco(s) ? '<br>' + esc(preco(s)) : '')) + '</div>' +
        '<form id="f" novalidate>' +
        '<div class="campo"><label for="fn">Seu nome</label><input id="fn" autocomplete="name"></div>' +
        '<div class="campo"><label for="fw">WhatsApp</label><input id="fw" type="tel" inputmode="tel" autocomplete="tel" placeholder="(11) 99999-9999"></div>' +
        '<div class="campo"><label for="fe">E-mail ' + (ag ? '(para a confirmação e os lembretes)' : '(opcional)') + '</label><input id="fe" type="email" autocomplete="email"></div>' +
        '<div class="campo"><label for="fo">Observação (opcional)</label><textarea id="fo" rows="2"></textarea></div>' +
        '<input class="hp" id="fh" tabindex="-1" autocomplete="off" aria-hidden="true">' +
        '<label class="cons"><input type="checkbox" id="fc"> Autorizo o contato por e-mail e WhatsApp sobre ' + (ag ? 'este horário' : 'este pedido') + '.</label>' +
        '<button class="btn" type="submit" id="fb">' + (!ag ? 'Pedir orçamento' : info.confirmacao === 'manual' ? 'Pedir este horário' : 'Confirmar agendamento') + '</button><div id="fErr" class="erro" role="alert"></div></form>' +
        (ag ? '<button type="button" class="btn sec" id="volta" style="background:#fff;color:inherit;border:1.5px solid #E2E6EE">Trocar dia ou horário</button>' : ''));
      var v = folha.querySelector('#volta'); if (v) v.onclick = function(){ renderFolha('quando'); };
      folha.querySelector('#f').onsubmit = enviar;
    }
  }
  function carregaDias(){
    api('GET', '/api/agenda/' + encodeURIComponent(slug) + '/dias?servico=' + est.servico.id).then(function(j){
      var el = folha.querySelector('#dias'); if (!el) return;
      if (!j.dias.length){ el.innerHTML = '<p class="vazio">Sem horários livres nos próximos dias. Fale direto com a empresa' + (info.whatsapp ? ' pelo WhatsApp ' + esc(info.whatsapp) : '') + '.</p>'; return; }
      el.innerHTML = '<div class="dias">' + j.dias.map(function(d){ var dt = new Date(d + 'T12:00:00');
        return '<button type="button" class="dia" data-d="' + d + '" aria-pressed="' + (est.data === d) + '" aria-label="' + esc(dataLonga(d)) + '"><small>' + dt.toLocaleDateString('pt-BR', {weekday:'short'}).replace('.', '') + '</small><b>' + dt.getDate() + '</b><small>' + dt.toLocaleDateString('pt-BR', {month:'short'}).replace('.', '') + '</small></button>'; }).join('') + '</div>';
      el.querySelectorAll('[data-d]').forEach(function(b){ b.onclick = function(){ est.data = b.getAttribute('data-d'); est.hora = null; el.querySelectorAll('[data-d]').forEach(function(x){ x.setAttribute('aria-pressed', x === b); }); lado(); carregaHoras(); }; });
    }, function(e){ var el = folha.querySelector('#dias'); if (el) el.innerHTML = '<p class="erro">' + esc(e.message) + '</p>'; });
  }
  function carregaHoras(){
    var alvo = folha.querySelector('#horas'); if (!alvo) return;
    alvo.innerHTML = '<div class="passo-t">Escolha o horário</div><p class="nota">Procurando horários…</p>';
    api('GET', '/api/agenda/' + encodeURIComponent(slug) + '/horarios?servico=' + est.servico.id + '&data=' + est.data).then(function(j){
      var el = folha.querySelector('#horas'); if (!el) return;
      if (!j.horarios.length){ el.innerHTML = '<div class="passo-t">Escolha o horário</div><p class="vazio">Esse dia lotou. Escolha outro.</p>'; return; }
      el.innerHTML = '<div class="passo-t">Escolha o horário</div><div class="horas">' + j.horarios.map(function(h){ return '<button type="button" class="hora" data-h="' + h + '" aria-pressed="' + (est.hora === h) + '">' + h + '</button>'; }).join('') + '</div>';
      el.querySelectorAll('[data-h]').forEach(function(b){ b.onclick = function(){ est.hora = b.getAttribute('data-h'); el.querySelectorAll('[data-h]').forEach(function(x){ x.setAttribute('aria-pressed', x === b); }); folha.querySelector('#seg').setAttribute('aria-disabled', 'false'); lado(); }; });
      if (est.hora) folha.querySelector('#seg').setAttribute('aria-disabled', 'false');
    }, function(e){ var el = folha.querySelector('#horas'); if (el) el.innerHTML = '<p class="erro">' + esc(e.message) + '</p>'; });
  }
  function enviar(ev){
    ev.preventDefault();
    var s = est.servico, ag = s.modo === 'agenda';
    var g = function(id){ return folha.querySelector('#' + id).value.trim(); }, err = folha.querySelector('#fErr'), bt = folha.querySelector('#fb'), rot = bt.textContent;
    err.textContent = '';
    if (!g('fn')) return (err.textContent = 'Preencha seu nome.');
    if (g('fw').replace(/\D/g, '').length < 10) return (err.textContent = 'Preencha seu WhatsApp com DDD.');
    if (!folha.querySelector('#fc').checked) return (err.textContent = 'Marque a autorização para receber o retorno.');
    bt.disabled = true; bt.textContent = 'Enviando…';
    var corpo = {servico:s.id, nome:g('fn'), whatsapp:g('fw'), email:g('fe'), obs:g('fo'), consentimento:true, site_url:g('fh')};
    if (ag){ corpo.data = est.data; corpo.hora = est.hora; }
    api('POST', '/api/agenda/' + encodeURIComponent(slug) + (ag ? '/reservar' : '/orcar'), corpo).then(function(j){
      var pend = ag && j.status === 'pendente', email = g('fe');
      caixa('<div class="ok-env"><div class="ok">' + (pend ? '⏳' : '✓') + '</div><h2>' + (!ag ? 'Pedido enviado!' : pend ? 'Pedido enviado' : 'Horário confirmado!') + '</h2>' +
        '<div class="resumo"><b>' + esc(s.nome) + '</b>' + (ag ? '<br>' + esc(dataLonga(j.data)) + ', às ' + esc(j.hora) : '') + '<br>' + esc(j.empresa || info.empresa) + '</div>' +
        '<p class="nota">' + (!ag ? 'Recebemos seu pedido e retornamos em breve pelo WhatsApp.' : (pend ? 'A empresa vai confirmar seu horário. ' : '') + (email ? 'Você recebe ' + (pend ? 'a resposta' : 'a confirmação') + ' e os lembretes no seu e-mail.' : 'Guarde esta tela.')) + '</p>' +
        (info.aviso ? '<p class="nota">' + esc(info.aviso) + '</p>' : '') +
        (ag && j.token ? '<p class="nota"><a href="?cancelar=' + encodeURIComponent(j.token) + '">Precisa desmarcar?</a></p>' : '') +
        '<button type="button" class="btn fechar-x">Fechar</button></div>');
      est = {servico:null, data:null, hora:null}; lado();
    }, function(e){
      bt.disabled = false; bt.textContent = rot; err.textContent = e.message;
      if (/ocupado/.test(e.message)){ est.hora = null; setTimeout(function(){ renderFolha('quando'); }, 1500); }
    });
  }
  function cancelar(){
    api('GET', '/api/agenda/reserva?token=' + encodeURIComponent(tokCancel)).then(function(j){
      aplicaMarca(j); doc.getElementById('titulo').textContent = 'Desmarcar horário';
      if (j.status === 'cancelado'){ main.innerHTML = '<div class="caixa-simples"><h2>Este horário já foi desmarcado</h2><p class="nota">' + esc(j.servico) + ', ' + esc(j.quando) + '</p></div>'; return; }
      main.innerHTML = '<div class="caixa-simples"><h2>Desmarcar este horário?</h2><div class="resumo"><b>' + esc(j.servico) + '</b><br>' + esc(dataLonga(j.data)) + ', às ' + esc(j.hora) + '</div><button class="btn sec" id="cb">Sim, desmarcar</button><div id="cErr" class="erro" role="alert"></div></div>';
      doc.getElementById('cb').onclick = function(){
        this.disabled = true;
        api('POST', '/api/agenda/cancelar', {token:tokCancel}).then(function(){
          main.innerHTML = '<div class="caixa-simples ok-env"><div class="ok">✓</div><h2>Horário desmarcado</h2><p class="nota">A empresa já foi avisada. Obrigado por avisar com antecedência.</p></div>';
        }, function(e){ doc.getElementById('cErr').textContent = e.message; doc.getElementById('cb').disabled = false; });
      };
    }, function(e){ erroPag(e.message); });
  }
})();
</script>
</body>
</html>
