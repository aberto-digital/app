<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditoria de presença digital | Aberto Digital</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='24' fill='%231E3050'/%3E%3Cpath d='M24 74V46a24 24 0 0 1 48 0V74Z' fill='%23FFB020'/%3E%3Cpath d='M33 74V46.5a15 15 0 0 1 30 0V74Z' fill='%232F6FED'/%3E%3Cpath d='M33 74V39.5L51 32.5V68.5Z' fill='%231E3050'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101A2C; --navy:#1E3050; --slate:#384358; --ambar:#FFB020; --ceu:#2F6FED;
    --papel:#F6F7F9; --branco:#fff; --sec:#5B6678; --muted:#8A93A6; --linha:#E2E6ED; --linha2:#D5DAE3;
    --ruim:#D64545; --medio:#E08A00; --bom:#1F9D55;
    --display:"Archivo",system-ui,sans-serif;
    --corpo:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--corpo);color:var(--ink);background:var(--papel);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  :focus-visible{outline:3px solid var(--ambar);outline-offset:2px;border-radius:6px}

  .barra{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--branco);border-bottom:1px solid var(--linha)}
  .barra .marca{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-stretch:85%;font-size:1.15rem;white-space:nowrap}
  .barra .marca svg{width:32px;height:32px}
  .barra .marca b{color:var(--ceu);font-weight:800}
  .barra .sep{width:1px;height:28px;background:var(--linha2)}
  .barra .tt{font-weight:600;color:var(--sec);white-space:nowrap}
  .barra .dir{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;background:var(--branco);border:1px solid var(--linha2);white-space:nowrap}
  .btn:hover{background:#EEF1F6}
  .btn.pri{background:var(--ceu);border-color:var(--ceu);color:#fff}
  .btn.pri:hover{background:#245CD0}
  .btn svg{width:17px;height:17px}
  select.btn{padding-right:10px}

  .abas-mob{display:none}
  .grade{display:grid;grid-template-columns:minmax(380px,520px) 1fr;gap:20px;padding:20px;max-width:1400px;margin:0 auto;align-items:start}

  /* ===== Formulário ===== */
  .form{display:flex;flex-direction:column;gap:14px}
  .bloco{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:16px 18px}
  .bloco h2{font-family:var(--display);font-weight:800;font-stretch:85%;font-size:1.1rem;margin-bottom:4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .bloco h2 small{font-family:var(--corpo);font-size:13px;font-weight:700;color:var(--sec)}
  .bloco .dica{font-size:13px;color:var(--sec);margin-bottom:10px}
  .campos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .campo label{display:block;font-size:12.5px;font-weight:700;color:var(--sec);margin-bottom:4px}
  .campo input,.campo select{width:100%;padding:8px 10px;border:1px solid var(--linha2);border-radius:9px;background:var(--branco);outline:0;min-height:38px}
  .campo input:focus,.campo select:focus{border-color:var(--ceu)}
  .campo.cheio{grid-column:1/-1}
  .crit{padding:11px 0;border-top:1px solid var(--linha)}
  .crit:first-of-type{border-top:0}
  .crit .q{font-weight:600;font-size:14px;margin-bottom:7px}
  .crit .q span{font-weight:500;color:var(--muted);font-size:12.5px}
  .ops{display:flex;flex-wrap:wrap;gap:6px}
  .ops button{padding:6px 11px;border-radius:8px;border:1px solid var(--linha2);font-size:13px;font-weight:600;color:var(--slate);background:var(--branco)}
  .ops button[aria-pressed="true"].v1{background:#E2F5EA;border-color:#9ED5B5;color:#146B3A}
  .ops button[aria-pressed="true"].v2{background:#FFF1D6;border-color:#F2C46B;color:#8A5B00}
  .ops button[aria-pressed="true"].v3{background:#FCE6E6;border-color:#EBA9A9;color:#A82F2F}
  .crit input[type=number]{width:120px;padding:7px 10px;border:1px solid var(--linha2);border-radius:9px;min-height:36px}

  /* ===== Relatório ===== */
  .rel{background:var(--branco);border:1px solid var(--linha);border-radius:16px;padding:34px 38px;position:sticky;top:76px}
  .rel-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:18px;border-bottom:2px solid var(--ink);margin-bottom:22px}
  .rel-cab .logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-stretch:85%;font-size:1.05rem}
  .rel-cab .logo svg{width:30px;height:30px}
  .rel-cab .logo b{color:var(--ambar);font-weight:800}
  .rel-cab .meta{text-align:right;font-size:12.5px;color:var(--sec)}
  .rel h1{font-family:var(--display);font-weight:800;font-stretch:80%;font-size:2.1rem;line-height:1.05;letter-spacing:-.01em}
  .rel .sub{color:var(--sec);margin-top:4px}
  .topo-rel{display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:center;margin:22px 0 26px}
  .gauge{text-align:center}
  .gauge svg{width:100%;height:auto;display:block}
  .gauge .nivel{font-weight:700;margin-top:-4px}
  .pilares .p{margin-bottom:13px}
  .pilares .p .l{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:5px}
  .pilares .p .l b{font-variant-numeric:tabular-nums}
  .pilares .trilho-b{height:10px;border-radius:5px;background:#EDF0F5;overflow:hidden}
  .pilares .trilho-b i{display:block;height:100%;border-radius:5px;transition:width .4s}
  .rel h3{font-family:var(--display);font-weight:800;font-stretch:85%;font-size:1.25rem;margin:26px 0 10px}
  .perdas{list-style:none;display:flex;flex-direction:column;gap:10px}
  .perdas li{display:grid;grid-template-columns:8px 1fr;gap:12px;padding:12px 14px;border-radius:10px;background:#FBF3F3}
  .perdas li i{border-radius:4px;background:var(--ruim)}
  .perdas li.media{background:#FFF8EC}
  .perdas li.media i{background:var(--medio)}
  .perdas li b{display:block;font-size:14.5px}
  .perdas li span{font-size:13.5px;color:var(--slate)}
  .ok-tudo{padding:12px 14px;border-radius:10px;background:#EEF8F2;color:#146B3A;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--linha);vertical-align:top}
  th{font-size:12px;color:var(--sec);font-weight:700}
  td.st{width:28px;text-align:center;font-weight:800}
  td.st.v1{color:var(--bom)} td.st.v2{color:var(--medio)} td.st.v3{color:var(--ruim)} td.st.vx{color:var(--muted)}
  .area-t td{background:var(--papel);font-weight:700;font-size:12.5px;color:var(--slate)}
  .comp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .comp .c{border:1px solid var(--linha);border-radius:10px;padding:12px 14px}
  .comp .c .n{font-family:var(--display);font-weight:800;font-size:1.6rem}
  .comp .c .r{font-size:12.5px;color:var(--sec)}
  .plano{border:2px solid var(--ceu);border-radius:14px;padding:16px 18px;background:#F5F8FF}
  .plano .pk{font-family:var(--display);font-weight:800;font-stretch:85%;font-size:1.35rem}
  .plano .pr{color:var(--slate);font-weight:600;margin-bottom:8px}
  .plano ul{padding-left:18px;font-size:14px}
  .plano li{margin:3px 0}
  .rodape{margin-top:26px;padding-top:14px;border-top:1px solid var(--linha);display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--sec)}
  .vazio-rel{color:var(--sec);font-style:italic}

  .aviso{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;box-shadow:0 8px 24px rgba(16,26,44,.3)}

  @media (max-width:980px){
    .grade{grid-template-columns:1fr;padding:12px}
    .rel{position:static;padding:22px 18px}
    .abas-mob{display:flex;position:sticky;top:57px;z-index:15;background:var(--branco);border-bottom:1px solid var(--linha);padding:8px 12px;gap:6px}
    .abas-mob button{flex:1;padding:8px;border-radius:9px;font-weight:700;color:var(--sec);background:var(--papel)}
    .abas-mob button[aria-selected="true"]{background:var(--ink);color:#fff}
    body[data-aba="form"] .rel{display:none}
    body[data-aba="rel"] .form{display:none}
    .barra .tt,.barra .sep,.btn .txt,.barra .marca .nm{display:none}
    .barra .dir{gap:6px}
    #salvas{max-width:120px}
    .topo-rel{grid-template-columns:1fr;gap:12px}
    .gauge{max-width:260px;margin:0 auto}
    .rel h1{font-size:1.7rem}
    input,select{font-size:16px!important}
  }
  @media (max-width:520px){ .campos,.comp{grid-template-columns:1fr} .barra{padding:10px 12px} }

  @media print{
    @page{size:A4;margin:12mm}
    body{background:#fff;font-size:12.5px}
    .barra,.abas-mob,.form,.aviso{display:none!important}
    .grade{display:block;padding:0;max-width:none}
    .rel{display:block!important;position:static;border:0;padding:0;border-radius:0}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .perdas li,.plano,.comp .c,table tr{break-inside:avoid}
    h3{break-after:avoid}
  }
</style>
</head>
<body data-aba="form">

<header class="barra">
  <div class="marca"><svg viewBox="0 0 96 96" aria-hidden="true"><rect width="96" height="96" rx="24" fill="#1E3050"/><path d="M24 74V46a24 24 0 0 1 48 0V74Z" fill="#FFB020"/><path d="M33 74V46.5a15 15 0 0 1 30 0V74Z" fill="#2F6FED"/><path d="M33 74V39.5L51 32.5V68.5Z" fill="#1E3050"/></svg><span class="nm">Aberto<b>Core</b></span></div>
  <span class="sep"></span><span class="tt">Auditoria de presença digital</span>
  <div class="dir">
    <select class="btn" id="salvas" aria-label="Auditorias salvas"></select>
    <button class="btn" id="nova"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="txt">Nova</span></button>
    <button class="btn" id="salvar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6"/></svg><span class="txt">Salvar</span></button>
    <button class="btn pri" id="imprimir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z"/></svg><span class="txt">Imprimir / PDF</span></button>
  </div>
</header>
<div class="abas-mob" role="tablist">
  <button role="tab" data-a="form" aria-selected="true">Preencher</button>
  <button role="tab" data-a="rel" aria-selected="false">Relatório <span id="mobScore"></span></button>
</div>

<main class="grade">
  <section class="form" id="form" aria-label="Dados da auditoria"></section>
  <article class="rel" id="rel" aria-label="Relatório"></article>
</main>

<script>
(function(){
  'use strict';
  function $(s){ return document.querySelector(s); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function hojeISO(){ var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function dataBR(s){ if (!s) return ''; var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }

  /* ===================================================================
     CRITÉRIOS: peso dentro da área (cada área soma 100), opções e textos.
     tipo 'op': opções [rótulo, valor 0..1]. tipo 'num': função de nota.
     perda: o que a empresa perde quando o item vai mal. acao: o que fazemos.
     =================================================================== */
  var SIM = [['Sim',1],['Parcial',.5],['Não',0]];
  var AREAS = [
    {id:'enc', nome:'Ser encontrado', peso:30, itens:[
      {id:'g_perfil', q:'Tem perfil no Google (Maps)?', peso:25, tipo:'op', ops:[['Sim, verificado',1],['Sim, sem verificar',.5],['Não tem',0]],
        perda:'Quem procura no Google ou no Maps não encontra a empresa', acao:'Criar e verificar o perfil no Google'},
      {id:'g_busca', q:'Aparece nos 3 primeiros do Maps buscando "[ramo] em [cidade]"?', peso:20, tipo:'op', ops:[['Top 3',1],['Até o 10º',.5],['Não aparece',0]],
        perda:'Os clientes encontram os concorrentes primeiro', acao:'Otimizar categoria, serviços e palavras do perfil'},
      {id:'g_fotos', q:'Quantas fotos tem no perfil do Google?', peso:15, tipo:'num', ph:'nº de fotos', nota:function(n){ return n >= 10 ? 1 : n >= 1 ? .5 : 0; },
        perda:'Sem fotos, o perfil parece abandonado e recebe menos cliques', acao:'Publicar pelo menos 10 fotos boas do local e dos serviços'},
      {id:'g_categoria', q:'Categoria e serviços estão corretos?', peso:10, tipo:'op', ops:SIM,
        perda:'O Google não mostra a empresa nas buscas certas', acao:'Corrigir categoria principal e listar os serviços'},
      {id:'g_horario', q:'Horário e telefone estão atualizados?', peso:10, tipo:'op', ops:SIM,
        perda:'Clientes chegam com a loja fechada ou ligam para o número errado', acao:'Atualizar horário, feriados e telefone'},
      {id:'site', q:'Tem site próprio?', peso:10, tipo:'op', ops:[['Sim',1],['Só link de rede social',.5],['Não',0]],
        perda:'Falta um endereço oficial para o cliente conferir serviços e preços', acao:'Criar site de 1 página com botão de WhatsApp'},
      {id:'site_mob', q:'O site abre bem no celular e tem cadeado (HTTPS)?', peso:5, tipo:'op', ops:[['Sim',1],['Mais ou menos',.5],['Não / sem site',0]],
        perda:'O site assusta ou demora no celular, e o cliente desiste', acao:'Site rápido, responsivo e seguro'},
      {id:'g_posts', q:'Publicou novidades no Google nos últimos 30 dias?', peso:5, tipo:'op', ops:[['Sim',1],['Não',0]],
        perda:'O perfil parece parado em comparação aos concorrentes', acao:'Publicar ofertas e novidades no Google todo mês'}
    ]},
    {id:'conf', nome:'Confiança e reputação', peso:25, itens:[
      {id:'nota', q:'Nota média no Google', peso:30, tipo:'num', ph:'ex.: 4,6', passo:'0.1', nota:function(n){ return !n ? 0 : n >= 4.7 ? 1 : n >= 4.3 ? .7 : n >= 4 ? .4 : .1; },
        perda:'Nota baixa ou sem nota faz o cliente desconfiar do serviço', acao:'Pós-venda que pede avaliação aos clientes satisfeitos'},
      {id:'aval', q:'Quantas avaliações no Google?', peso:25, tipo:'num', ph:'nº de avaliações', nota:function(n){ return n >= 50 ? 1 : n >= 20 ? .7 : n >= 5 ? .4 : n >= 1 ? .15 : 0; },
        perda:'Poucas avaliações passam a impressão de negócio pequeno ou novo demais', acao:'Campanha de avaliações com link direto'},
      {id:'resp', q:'Responde às avaliações?', peso:20, tipo:'op', ops:[['Todas',1],['Algumas',.5],['Nenhuma',0]],
        perda:'Avaliações sem resposta, principalmente as ruins, afastam clientes', acao:'Responder todas as avaliações, com apoio da IA'},
      {id:'recente', q:'Recebeu avaliação nos últimos 3 meses?', peso:10, tipo:'op', ops:[['Sim',1],['Não',0]],
        perda:'Avaliações antigas fazem o cliente duvidar se o serviço continua bom', acao:'Pedir avaliação a cada atendimento'},
      {id:'visual', q:'Logo e cores são profissionais e iguais em todo lugar?', peso:15, tipo:'op', ops:SIM,
        perda:'Visual amador ou diferente em cada canal reduz a confiança', acao:'Criar identidade visual e aplicar em todos os canais'}
    ]},
    {id:'atend', nome:'Atendimento', peso:25, itens:[
      {id:'tempo', q:'Teste: quanto tempo levou para responder uma mensagem?', peso:35, tipo:'op', ops:[['Até 15 min',1],['Até 2 horas',.6],['Mais de 2 horas',.2],['Não respondeu',0]],
        perda:'O cliente que espera fecha com quem respondeu antes', acao:'Assistente de IA que responde na hora, 24 horas'},
      {id:'wa_bus', q:'Usa WhatsApp Business (e não o pessoal)?', peso:15, tipo:'op', ops:[['Sim',1],['Não',0]],
        perda:'Sem perfil comercial, o atendimento fica desorganizado e pouco profissional', acao:'Configurar WhatsApp Business com perfil completo'},
      {id:'catalogo', q:'Tem catálogo ou lista de preços no WhatsApp?', peso:15, tipo:'op', ops:SIM,
        perda:'O cliente precisa perguntar tudo e desiste no meio do caminho', acao:'Montar catálogo com produtos, serviços e preços'},
      {id:'agenda', q:'Dá para agendar ou pedir online?', peso:15, tipo:'op', ops:[['Sim',1],['Só pelo WhatsApp',.5],['Não',0]],
        perda:'Quem decide fora do horário comercial não consegue marcar e esquece', acao:'Agendamento online com lembrete automático'},
      {id:'saudacao', q:'Tem mensagem de saudação e de ausência?', peso:10, tipo:'op', ops:SIM,
        perda:'Fora do horário, o cliente fica sem resposta nenhuma', acao:'Mensagens automáticas de boas-vindas e ausência'},
      {id:'link_wa', q:'O WhatsApp está fácil de achar (Google, site, Instagram)?', peso:10, tipo:'op', ops:SIM,
        perda:'O cliente não acha como falar com a empresa', acao:'Botão de WhatsApp em todos os canais'}
    ]},
    {id:'redes', nome:'Redes sociais', peso:20, itens:[
      {id:'ig', q:'Tem Instagram profissional?', peso:20, tipo:'op', ops:[['Sim',1],['Pessoal',.5],['Não',0]],
        perda:'Muitos clientes conferem o Instagram antes de comprar e não encontram nada', acao:'Criar ou converter para perfil profissional'},
      {id:'ultimo', q:'Quando foi a última postagem?', peso:30, tipo:'op', ops:[['Até 7 dias',1],['Até 30 dias',.6],['Mais de 30 dias',.2],['Nunca postou',0]],
        perda:'Perfil parado passa a impressão de que o negócio fechou', acao:'Calendário mensal de conteúdo'},
      {id:'bio', q:'A bio diz o que faz, a cidade e tem link de contato?', peso:20, tipo:'op', ops:SIM,
        perda:'O visitante não entende o que a empresa faz nem como chamar', acao:'Reescrever bio com link de WhatsApp'},
      {id:'qualidade', q:'Fotos e vídeos têm boa qualidade?', peso:20, tipo:'op', ops:SIM,
        perda:'Imagens fracas desvalorizam o produto e o preço', acao:'Fotos e vídeos curtos editados com IA'},
      {id:'seg', q:'Quantos seguidores?', peso:10, tipo:'num', ph:'nº de seguidores', nota:function(n){ return n >= 1000 ? 1 : n >= 300 ? .6 : n >= 1 ? .3 : 0; },
        perda:'Alcance pequeno: poucas pessoas da região conhecem a empresa', acao:'Conteúdo local e parcerias na região'}
    ]}
  ];
  var PACOTES = {
    Start:{preco:'R$ 650 + R$ 49/mês', inclui:'Perfil no Google otimizado, site de 1 página e domínio no 1º ano'},
    'Presença':{preco:'R$ 850 + R$ 49/mês', inclui:'Tudo do Start, logo e identidade visual e WhatsApp Business com catálogo'},
    Completo:{preco:'R$ 1.500 + R$ 150/mês', inclui:'Tudo do Presença, chatbot de IA no WhatsApp e 1 mês de acompanhamento'},
    Enterprise:{preco:'sob consulta', inclui:'Sistema AbertoCore: todos os canais numa caixa só, IA, funil, agenda e relatórios'}
  };

  /* ---------- estado ---------- */
  var CHAVE = 'aberto-auditorias-v1';
  function vazio(){ return {id:'a' + Date.now(), empresa:'', ramo:'', cidade:'Arujá/SP', resp:'', data:hojeISO(), msgs:'', conc:'', concNota:'', concAval:'', r:{}}; }
  var A = vazio();
  function lista(){ try { return JSON.parse(localStorage.getItem(CHAVE)) || []; } catch (e) { return []; } }
  function grava(l){ try { localStorage.setItem(CHAVE, JSON.stringify(l)); } catch (e) {} }

  /* ---------- cálculo ---------- */
  function valor(it){
    var v = A.r[it.id];
    if (v === undefined || v === '' || v === null) return null;
    if (it.tipo === 'num') return it.nota(parseFloat(String(v).replace(',', '.')) || 0);
    return v;
  }
  function calcula(){
    var total = 0, pesoUsado = 0, areas = AREAS.map(function(ar){
      var s = 0, p = 0, resp = 0;
      ar.itens.forEach(function(it){ var v = valor(it); if (v !== null){ s += v * it.peso; p += it.peso; resp++; } });
      var nota = p ? Math.round(s / p * 100) : null;
      if (nota !== null){ total += nota * ar.peso; pesoUsado += ar.peso; }
      return {id:ar.id, nome:ar.nome, nota:nota, resp:resp, n:ar.itens.length};
    });
    return {areas:areas, geral:pesoUsado ? Math.round(total / pesoUsado) : null};
  }
  function nivel(n){ return n === null ? {t:'Sem dados', c:'var(--muted)'} : n >= 70 ? {t:'Boa presença', c:'var(--bom)'} : n >= 40 ? {t:'Precisa de atenção', c:'var(--medio)'} : {t:'Situação crítica', c:'var(--ruim)'}; }
  function perdas(){
    var L = [];
    AREAS.forEach(function(ar){ ar.itens.forEach(function(it){
      var v = valor(it); if (v !== null && v < 1) L.push({it:it, ar:ar, v:v, impacto:(1 - v) * it.peso * ar.peso});
    }); });
    return L.sort(function(a, b){ return b.impacto - a.impacto; });
  }
  function pacote(c){
    var n = {}; c.areas.forEach(function(a){ n[a.id] = a.nota === null ? 100 : a.nota; });
    var msgs = parseInt(A.msgs, 10) || 0;
    if (msgs >= 30) return 'Enterprise';
    if (n.atend < 70) return 'Completo';
    if (n.conf < 70 || n.redes < 70) return 'Presença';
    if (n.enc < 70) return 'Start';
    return msgs >= 10 ? 'Enterprise' : 'Completo';
  }

  /* ---------- formulário ---------- */
  function desenhaForm(){
    var cab = '<div class="bloco"><h2>Empresa</h2><p class="dica">Os dados aparecem no relatório. O ramo e a cidade montam a busca do teste no Maps.</p><div class="campos">' +
      campo('empresa', 'Nome da empresa', 'text', 'cheio') + campo('ramo', 'Ramo', 'text', '', 'ex.: oficina mecânica') + campo('cidade', 'Cidade', 'text') +
      campo('resp', 'Responsável', 'text') + campo('data', 'Data da auditoria', 'date') +
      campo('msgs', 'Mensagens por dia (aprox.)', 'number', '', 'opcional') + '</div></div>';
    var corpo = AREAS.map(function(ar){
      return '<div class="bloco" data-area="' + ar.id + '"><h2>' + ar.nome + ' <small id="nf_' + ar.id + '"></small></h2>' + ar.itens.map(function(it){
        var q = esc(it.q.replace('[ramo]', A.ramo || 'ramo').replace('[cidade]', (A.cidade || 'cidade').split('/')[0]));
        if (it.tipo === 'num') return '<div class="crit"><div class="q">' + q + '</div><input type="number" min="0" step="' + (it.passo || '1') + '" inputmode="decimal" data-num="' + it.id + '" placeholder="' + it.ph + '" value="' + esc(A.r[it.id] == null ? '' : A.r[it.id]) + '"></div>';
        return '<div class="crit"><div class="q">' + q + '</div><div class="ops">' + it.ops.map(function(o, i){
          var cls = o[1] >= 1 ? 'v1' : o[1] > 0 ? 'v2' : 'v3';
          return '<button type="button" class="' + cls + '" data-it="' + it.id + '" data-v="' + o[1] + '" aria-pressed="' + (A.r[it.id] === o[1]) + '">' + o[0] + '</button>';
        }).join('') + '</div></div>';
      }).join('') + '</div>';
    }).join('');
    var conc = '<div class="bloco"><h2>Concorrente principal <small>opcional</small></h2><p class="dica">Aparece no relatório como comparação.</p><div class="campos">' +
      campo('conc', 'Nome do concorrente', 'text', 'cheio') + campo('concNota', 'Nota no Google', 'number', '', 'ex.: 4,8') + campo('concAval', 'Nº de avaliações', 'number') + '</div></div>';
    $('#form').innerHTML = cab + corpo + conc;
  }
  function campo(k, rot, tipo, cls, ph){
    return '<div class="campo ' + (cls || '') + '"><label for="f_' + k + '">' + rot + '</label><input id="f_' + k + '" data-k="' + k + '" type="' + tipo + '"' + (tipo === 'number' ? ' min="0" step="any" inputmode="decimal"' : '') + (ph ? ' placeholder="' + ph + '"' : '') + ' value="' + esc(A[k]) + '"></div>';
  }
  $('#form').addEventListener('click', function(e){
    var b = e.target.closest('button[data-it]'); if (!b) return;
    var id = b.getAttribute('data-it'), v = parseFloat(b.getAttribute('data-v'));
    A.r[id] = A.r[id] === v ? undefined : v;
    b.parentNode.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', A.r[id] === parseFloat(x.getAttribute('data-v'))); });
    desenhaRel();
  });
  $('#form').addEventListener('input', function(e){
    var t = e.target;
    if (t.hasAttribute('data-k')){ A[t.getAttribute('data-k')] = t.value; if (t.getAttribute('data-k') === 'ramo' || t.getAttribute('data-k') === 'cidade') atualizaBusca(); }
    if (t.hasAttribute('data-num')) A.r[t.getAttribute('data-num')] = t.value === '' ? undefined : t.value;
    desenhaRel();
  });
  function atualizaBusca(){
    var q = document.querySelector('[data-it="g_busca"]'); if (!q) return;
    q.closest('.crit').querySelector('.q').textContent = 'Aparece nos 3 primeiros do Maps buscando "' + (A.ramo || 'ramo') + ' em ' + (A.cidade || 'cidade').split('/')[0] + '"?';
  }

  /* ---------- relatório ---------- */
  function gauge(n){
    var r = 90, cx = 110, cy = 105, nv = nivel(n), f = n === null ? 0 : n / 100;
    function pt(t){ var a = Math.PI * (1 - t); return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; }
    var p0 = pt(0), p1 = pt(1), pf = pt(Math.max(f, .001));
    var arcoFundo = 'M' + p0[0] + ' ' + p0[1] + ' A' + r + ' ' + r + ' 0 0 1 ' + p1[0] + ' ' + p1[1];
    var arco = 'M' + p0[0] + ' ' + p0[1] + ' A' + r + ' ' + r + ' 0 0 1 ' + pf[0].toFixed(2) + ' ' + pf[1].toFixed(2);
    var marcas = [40, 70].map(function(m){ var a = pt(m / 100), b = [cx + (r - 18) * Math.cos(Math.PI * (1 - m / 100)), cy - (r - 18) * Math.sin(Math.PI * (1 - m / 100))]; return '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '" stroke="#fff" stroke-width="3"/>'; }).join('');
    return '<svg viewBox="0 0 220 125" role="img" aria-label="Nota geral ' + (n === null ? 'sem dados' : n + ' de 100') + '">' +
      '<path d="' + arcoFundo + '" fill="none" stroke="#EDF0F5" stroke-width="18" stroke-linecap="round"/>' +
      (n ? '<path d="' + arco + '" fill="none" stroke="' + nv.c + '" stroke-width="18" stroke-linecap="round"/>' : '') + marcas +
      '<text x="110" y="92" text-anchor="middle" font-family="Archivo,system-ui" font-weight="800" font-size="46" fill="#101A2C">' + (n === null ? '–' : n) + '</text>' +
      '<text x="110" y="112" text-anchor="middle" font-size="11" fill="#5B6678">de 100</text></svg><div class="nivel" style="color:' + nv.c + '">' + nv.t + '</div>';
  }
  function desenhaRel(){
    var c = calcula(), L = perdas(), emp = A.empresa || 'Empresa', pk = pacote(c);
    c.areas.forEach(function(a){ var el = $('#nf_' + a.id); if (el) el.textContent = a.nota === null ? a.resp + '/' + a.n : a.nota + '/100'; });
    $('#mobScore').textContent = c.geral === null ? '' : '(' + c.geral + ')';
    var resumo = c.geral === null ? 'Preencha os itens ao lado para gerar a nota.' :
      c.geral >= 70 ? emp + ' tem uma boa base digital. Ainda há ajustes que trazem mais clientes.' :
      c.geral >= 40 ? emp + ' aparece na internet, mas perde clientes em pontos importantes da jornada.' :
      emp + ' está praticamente invisível ou passa pouca confiança na internet. Muitos clientes escolhem o concorrente antes mesmo de chegar até ela.';
    var pil = c.areas.map(function(a){ var nv = nivel(a.nota); return '<div class="p"><div class="l"><span>' + a.nome + '</span><b style="color:' + nv.c + '">' + (a.nota === null ? '–' : a.nota) + '</b></div><div class="trilho-b"><i style="width:' + (a.nota || 0) + '%;background:' + nv.c + '"></i></div></div>'; }).join('');
    var perdasHtml = !L.length ? (c.geral === null ? '<p class="vazio-rel">Os pontos fracos aparecem aqui conforme você preenche.</p>' : '<div class="ok-tudo">Nenhum ponto fraco encontrado nos itens avaliados.</div>') :
      '<ul class="perdas">' + L.slice(0, 6).map(function(p){ return '<li class="' + (p.v >= .5 ? 'media' : '') + '"><i></i><div><b>' + esc(p.it.perda) + '</b><span>' + p.ar.nome + ': ' + esc(p.it.q.replace(/\?$/, '').replace('[ramo]', A.ramo || 'ramo').replace('[cidade]', (A.cidade || '').split('/')[0])) + '</span></div></li>'; }).join('') + '</ul>';
    var tab = '<table><thead><tr><th></th><th>Item avaliado</th><th>Resultado</th></tr></thead><tbody>' + AREAS.map(function(ar){
      return '<tr class="area-t"><td colspan="3">' + ar.nome + '</td></tr>' + ar.itens.map(function(it){
        var v = valor(it), raw = A.r[it.id], res = '';
        if (raw === undefined || raw === null || raw === '') res = 'Não avaliado';
        else if (it.tipo === 'num') res = String(raw).replace('.', ',');
        else { var o = it.ops.filter(function(x){ return x[1] === raw; })[0]; res = o ? o[0] : ''; }
        var cls = v === null ? 'vx' : v >= 1 ? 'v1' : v > 0 ? 'v2' : 'v3', sym = v === null ? '–' : v >= 1 ? '✓' : v > 0 ? '!' : '✕';
        return '<tr><td class="st ' + cls + '">' + sym + '</td><td>' + esc(it.q.replace('[ramo]', A.ramo || 'ramo').replace('[cidade]', (A.cidade || '').split('/')[0])) + '</td><td>' + esc(res) + '</td></tr>';
      }).join('');
    }).join('') + '</tbody></table>';
    var comp = '';
    if (A.conc){
      var minhaNota = A.r.nota ? String(A.r.nota).replace('.', ',') : '–', minhasAval = A.r.aval || '0';
      comp = '<h3>Comparação com a concorrência</h3><div class="comp"><div class="c"><div class="r">' + esc(emp) + '</div><div class="n">' + minhaNota + ' ★</div><div class="r">' + esc(minhasAval) + ' avaliações no Google</div></div>' +
        '<div class="c"><div class="r">' + esc(A.conc) + '</div><div class="n">' + (A.concNota ? String(A.concNota).replace('.', ',') : '–') + ' ★</div><div class="r">' + esc(A.concAval || '0') + ' avaliações no Google</div></div></div>';
    }
    var acoes = L.slice(0, 5).map(function(p){ return '<li>' + esc(p.it.acao) + '</li>'; }).join('');
    var plano = c.geral === null ? '' : '<h3>Plano recomendado</h3><div class="plano"><div class="pk">Pacote ' + pk + '</div><div class="pr">' + PACOTES[pk].preco + ': ' + PACOTES[pk].inclui + '</div>' +
      (acoes ? '<ul>' + acoes + '</ul>' : '') + '</div>';
    $('#rel').innerHTML = '<div class="rel-cab"><div class="logo"><svg viewBox="0 0 96 96" aria-hidden="true"><rect width="96" height="96" rx="24" fill="#1E3050"/><path d="M24 74V46a24 24 0 0 1 48 0V74Z" fill="#FFB020"/><path d="M33 74V46.5a15 15 0 0 1 30 0V74Z" fill="#2F6FED"/><path d="M33 74V39.5L51 32.5V68.5Z" fill="#1E3050"/></svg>aberto <b>digital</b></div>' +
        '<div class="meta">Auditoria de presença digital<br>' + dataBR(A.data) + (A.resp ? '<br>Para: ' + esc(A.resp) : '') + '</div></div>' +
      '<h1>' + esc(emp) + '</h1><div class="sub">' + esc([A.ramo, A.cidade].filter(Boolean).join(', ')) + '</div>' +
      '<div class="topo-rel"><div class="gauge">' + gauge(c.geral) + '</div><div><p style="margin-bottom:14px">' + esc(resumo) + '</p><div class="pilares">' + pil + '</div></div></div>' +
      '<h3>O que ' + esc(emp) + ' está perdendo hoje</h3>' + perdasHtml + comp + plano +
      '<h3>Detalhes da auditoria</h3>' + tab +
      '<div class="rodape"><span>Aberto Digital · Julio Romanelli · WhatsApp (11) 99123-3627 · abertodigital.com</span><span>Avaliação feita em ' + dataBR(A.data) + ' com base no que é visível publicamente.</span></div>';
  }

  /* ---------- salvar, carregar, imprimir ---------- */
  function desenhaSalvas(){
    var l = lista();
    $('#salvas').innerHTML = '<option value="">Salvas (' + l.length + ')</option>' + l.map(function(a){ return '<option value="' + a.id + '"' + (a.id === A.id ? ' selected' : '') + '>' + esc(a.empresa || 'Sem nome') + ' · ' + dataBR(a.data) + '</option>'; }).join('');
  }
  function aviso(t){ var d = document.createElement('div'); d.className = 'aviso'; d.textContent = t; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 2600); }
  $('#salvar').onclick = function(){
    var l = lista().filter(function(a){ return a.id !== A.id; }); l.unshift(JSON.parse(JSON.stringify(A))); grava(l); desenhaSalvas();
    aviso('Auditoria de ' + (A.empresa || 'sem nome') + ' salva neste navegador.');
  };
  $('#salvas').onchange = function(e){
    var a = lista().filter(function(x){ return x.id === e.target.value; })[0]; if (!a) return;
    A = a; desenhaForm(); desenhaRel(); desenhaSalvas();
  };
  $('#nova').onclick = function(){ A = vazio(); desenhaForm(); desenhaRel(); desenhaSalvas(); window.scrollTo(0, 0); };
  $('#imprimir').onclick = function(){
    var t = document.title; document.title = 'Auditoria ' + (A.empresa || 'empresa') + ' ' + dataBR(A.data).replace(/\//g, '-');
    window.print(); setTimeout(function(){ document.title = t; }, 500);
  };
  document.querySelector('.abas-mob').onclick = function(e){
    var b = e.target.closest('button'); if (!b) return;
    document.body.setAttribute('data-aba', b.getAttribute('data-a'));
    this.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-selected', x === b); });
    window.scrollTo(0, 0);
  };

  desenhaForm(); desenhaRel(); desenhaSalvas();
})();
</script>
</body>
</html>
