<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditoria de presença digital | abertodigital</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='24' fill='%231E3050'/%3E%3Cpath d='M24 74V46a24 24 0 0 1 48 0V74Z' fill='%23FFB020'/%3E%3Cpath d='M33 74V46.5a15 15 0 0 1 30 0V74Z' fill='%232F6FED'/%3E%3Cpath d='M33 74V46.5A15 15 0 0 1 51 31.8V68.5Z' fill='%231E3050'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101A2C; --navy:#1E3050; --slate:#384358; --ambar:#FFB020; --ceu:#2F6FED;
    --papel:#F6F7F9; --branco:#fff; --sec:#5B6678; --muted:#8A93A6; --linha:#E2E6ED; --linha2:#D5DAE3;
    --ruim:#D64545; --medio:#E08A00; --bom:#1F9D55;
    --display:"Archivo",system-ui,sans-serif;
    --corpo:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--corpo);color:var(--ink);background:var(--papel);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  :focus-visible{outline:3px solid var(--ambar);outline-offset:2px;border-radius:6px}

  .barra{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--branco);border-bottom:1px solid var(--linha)}
  .barra .marca{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-stretch:85%;font-size:1.15rem;white-space:nowrap}
  .barra .marca svg{width:32px;height:32px}
  .barra .marca b{color:var(--ceu);font-weight:800}
  .barra .sep{width:1px;height:28px;background:var(--linha2)}
  .barra .tt{font-weight:600;color:var(--sec);white-space:nowrap}
  .barra .dir{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;background:var(--branco);border:1px solid var(--linha2);white-space:nowrap}
  .btn:hover{background:#EEF1F6}
  .btn.pri{background:var(--ceu);border-color:var(--ceu);color:#fff}
  .btn.pri:hover{background:#245CD0}
  .btn svg{width:17px;height:17px}
  a.btn{text-decoration:none;color:var(--ink)}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .barra .voltar{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;color:var(--ink)}
  .barra .voltar svg{width:20px;height:20px}
  .plano table{background:#fff;border-radius:8px}
  select.btn{padding-right:10px}

  .abas-mob{display:none}
  .grade{display:grid;grid-template-columns:minmax(380px,520px) 1fr;gap:20px;padding:20px;max-width:1400px;margin:0 auto;align-items:start}

  /* ===== Formulário ===== */
  .form{display:flex;flex-direction:column;gap:14px}
  .bloco{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:16px 18px}
  .bloco h2{font-family:var(--display);font-weight:800;font-stretch:85%;font-size:1.1rem;margin-bottom:4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .bloco h2 small{font-family:var(--corpo);font-size:13px;font-weight:700;color:var(--sec)}
  .bloco .dica{font-size:13px;color:var(--sec);margin-bottom:10px}
  .campos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .campo label{display:block;font-size:12.5px;font-weight:700;color:var(--sec);margin-bottom:4px}
  .campo input,.campo select{width:100%;padding:8px 10px;border:1px solid var(--linha2);border-radius:9px;background:var(--branco);outline:0;min-height:38px}
  .campo input:focus,.campo select:focus{border-color:var(--ceu)}
  .campo.cheio{grid-column:1/-1}
  .crit{padding:11px 0;border-top:1px solid var(--linha)}
  .crit:first-of-type{border-top:0}
  .crit .q{font-weight:600;font-size:14px;margin-bottom:7px}
  .crit .q span{font-weight:500;color:var(--muted);font-size:12.5px}
  .ops{display:flex;flex-wrap:wrap;gap:6px}
  .ops button{padding:6px 11px;border-radius:8px;border:1px solid var(--linha2);font-size:13px;font-weight:600;color:var(--slate);background:var(--branco)}
  .ops button[aria-pressed="true"].v1{background:#E2F5EA;border-color:#9ED5B5;color:#146B3A}
  .ops button[aria-pressed="true"].v2{background:#FFF1D6;border-color:#F2C46B;color:#8A5B00}
  .ops button[aria-pressed="true"].v3{background:#FCE6E6;border-color:#EBA9A9;color:#A82F2F}
  .crit input[type=number]{width:120px;padding:7px 10px;border:1px solid var(--linha2);border-radius:9px;min-height:36px}

  /* ===== Relatório ===== */
  .rel{background:var(--branco);border:1px solid var(--linha);border-radius:16px;padding:34px 38px;position:sticky;top:76px}
  .rel-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:18px;border-bottom:2px solid var(--ink);margin-bottom:22px}
  .rel-cab .logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-stretch:85%;font-size:1.05rem}
  .rel-cab .logo svg{width:30px;height:30px}
  .rel-cab .logo b{color:var(--ambar);font-weight:800}
  .rel-cab .meta{text-align:right;font-size:12.5px;color:var(--sec)}
  .rel h1{font-family:var(--display);font-weight:800;font-stretch:80%;font-size:2.1rem;line-height:1.05;letter-spacing:-.01em}
  .rel .sub{color:var(--sec);margin-top:4px}
  .topo-rel{display:grid;grid-template-columns:230px 1fr;gap:30px;align-items:center;margin:22px 0 26px}
  .topo-rel .resumo{margin-top:10px;font-size:13.5px;color:var(--slate);text-align:center}
  .gauge{text-align:center}
  .gauge svg{width:100%;height:auto;display:block}
  .gauge .nivel{font-weight:700;margin-top:-4px}
  .pilares .p{margin-bottom:13px}
  .resumo-rel{margin:-8px 0 4px;font-size:14px;color:var(--slate)}
  .pilares .p .l{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:5px}
  .pilares .p .l b{font-variant-numeric:tabular-nums}
  .pilares .trilho-b{height:10px;border-radius:5px;background:#EDF0F5;overflow:hidden}
  .pilares .trilho-b i{display:block;height:100%;border-radius:5px;transition:width .4s}
  .rel h3{font-family:var(--display);font-weight:800;font-stretch:85%;font-size:1.25rem;margin:26px 0 10px}
  .perdas{list-style:none;display:flex;flex-direction:column;gap:8px}
  .perdas li.cab{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12px;font-weight:700;color:var(--sec);padding:0 14px 0 34px;background:none}
  .perdas li{display:grid;grid-template-columns:8px 1fr 1fr;gap:12px;padding:11px 14px;border-radius:10px;background:#FBF3F3;align-items:start}
  .perdas li i{border-radius:4px;background:var(--ruim);align-self:stretch}
  .perdas li.media{background:#FFF8EC}
  .perdas li.media i{background:var(--medio)}
  .perdas li b{display:block;font-size:14px}
  .perdas li span{display:block;font-size:12.5px;color:var(--slate);margin-top:2px}
  .perdas li .sol{border-left:1px dashed rgba(16,26,44,.18);padding-left:12px}
  .perdas li .sol b{color:#146B3A}
  .perdas li .sol b::before{content:"✓ ";}
  .ok-tudo{padding:12px 14px;border-radius:10px;background:#EEF8F2;color:#146B3A;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--linha);vertical-align:top}
  th{font-size:12px;color:var(--sec);font-weight:700}
  td.st{width:28px;text-align:center;font-weight:800}
  td.st.v1{color:var(--bom)} td.st.v2{color:var(--medio)} td.st.v3{color:var(--ruim)} td.st.vx{color:var(--muted)}
  .area-t td{background:var(--papel);font-weight:700;font-size:12.5px;color:var(--slate)}
  .comp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .comp .c{border:1px solid var(--linha);border-radius:10px;padding:12px 14px}
  .comp .c .n{font-family:var(--display);font-weight:800;font-size:1.6rem}
  .comp .c .r{font-size:12.5px;color:var(--sec)}
  .plano-pag{break-inside:avoid;page-break-inside:avoid}
  .plano-pag h3 small{font-family:var(--corpo);font-weight:500;font-size:12px;color:var(--sec)}
  .tp{width:100%;border-collapse:separate;border-spacing:0;border:1.5px solid var(--ceu);border-radius:12px;overflow:hidden;background:#fff;margin-top:4px}
  .tp th{background:var(--ink);color:#fff;font-size:11px;padding:6px 9px}
  .tp th.tp-pr-h{text-align:right;width:120px}
  .tp td{padding:4px 9px;border-bottom:1px solid var(--linha);font-size:11.5px;line-height:1.35;vertical-align:middle}
  .tp tr:nth-child(even) td{background:#FAFBFD}
  .tp .tp-it{font-weight:600;width:44%}
  .tp .tag{display:inline-block;background:var(--papel);color:var(--slate);border-radius:999px;font-size:9.5px;padding:0 6px;font-weight:700;margin-left:3px}
  .tp .aud{color:var(--ink);font-weight:600}
  .tp .ben{color:var(--sec)}
  .tp td.tp-pm{text-align:right;white-space:nowrap;font-weight:800;font-family:var(--display);font-size:12.5px}
  .tp td.tp-pm small{display:block;font-family:var(--corpo);font-weight:500;color:var(--sec);font-size:10px}
  .tp .tp-foot td{border-bottom:0;background:var(--ink)!important;color:#fff}
  .tp td.tp-tot{padding:9px 11px}
  .tp .tot-l b{font-family:var(--display);font-size:1rem}
  .tp .tot-l span{display:block;color:#C9D1DE;font-size:11.5px;margin:1px 0 6px}
  .tp .tot-l span b{font-size:inherit;color:#fff;font-family:inherit}
  .tp .tot-f{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .tp .fid{border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:5px 9px;display:flex;flex-direction:column}
  .tp .fid b{font-family:var(--display);font-size:1rem;line-height:1.2}
  .tp .fid span{font-size:10.5px;color:#C9D1DE}
  .tp .fid.melhor{background:var(--ambar);border-color:var(--ambar)}.tp .fid.melhor span,.tp .fid.melhor b{color:var(--ink)}
  .tp.mod .tp-foot td.tp-pm{color:#fff}
  .tp.mod .tp-foot td.tp-pm small{color:#C9D1DE}
  .plano{border:2px solid var(--ceu);border-radius:14px;padding:16px 18px;background:#F5F8FF}
  .plano .pk{font-family:var(--display);font-weight:800;font-stretch:85%;font-size:1.35rem}
  .plano .pr{color:var(--slate);font-weight:600;margin-bottom:8px}
  .plano ul{padding-left:18px;font-size:14px}
  .plano li{margin:3px 0}
  .rodape{margin-top:26px;padding-top:14px;border-top:1px solid var(--linha);display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--sec)}
  .vazio-rel{color:var(--sec);font-style:italic}

  .aviso{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;box-shadow:0 8px 24px rgba(16,26,44,.3)}

  @media (max-width:980px){
    .grade{grid-template-columns:1fr;padding:12px}
    .rel{position:static;padding:22px 18px}
    .abas-mob{display:flex;position:sticky;top:57px;z-index:15;background:var(--branco);border-bottom:1px solid var(--linha);padding:8px 12px;gap:6px}
    .abas-mob button{flex:1;padding:8px;border-radius:9px;font-weight:700;color:var(--sec);background:var(--papel)}
    .abas-mob button[aria-selected="true"]{background:var(--ink);color:#fff}
    body[data-aba="form"] .rel{display:none}
    body[data-aba="rel"] .form{display:none}
    .barra .tt,.barra .sep,.btn .txt,.barra .marca .nm{display:none}
    .barra .dir{gap:6px}
    #salvas{max-width:110px}
  }
  @media (max-width:520px){
    .barra .marca,#nova{display:none}
    .barra{gap:6px}
    .barra .dir{min-width:0;flex:1;justify-content:flex-end}
    #salvas{min-width:0;flex:1;max-width:160px}
    .btn{padding:9px 11px}
    .topo-rel{grid-template-columns:1fr;gap:12px}
    .gauge{max-width:260px;margin:0 auto}
    .perdas li.cab{display:none}
    .perdas li:not(.cab){grid-template-columns:8px 1fr}
    .perdas li .sol{grid-column:2;border-left:0;padding-left:0;border-top:1px dashed rgba(16,26,44,.18);padding-top:8px}
    .rel h1{font-size:1.7rem}
    input,select{font-size:16px!important}
  }
  @media (max-width:520px){ .campos,.comp{grid-template-columns:1fr} .barra{padding:10px 12px} }

  @media print{
    @page{size:A4;margin:12mm}
    body{background:#fff;font-size:12.5px}
    .barra,.abas-mob,.form,.aviso{display:none!important}
    .grade{display:block;padding:0;max-width:none}
    .rel{display:block!important;position:static;border:0;padding:0;border-radius:0}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .perdas li,.plano,.comp .c,table tr,.tp-foot{break-inside:avoid}
    .topo-rel{grid-template-columns:200px 1fr!important;gap:26px!important}
    .gauge{max-width:none!important;margin:0!important}
    .perdas li.cab{display:grid!important}
    .perdas li:not(.cab){grid-template-columns:8px 1fr 1fr!important}
    .perdas li .sol{grid-column:auto!important;border-top:0!important;padding-top:0!important;border-left:1px dashed rgba(16,26,44,.18)!important;padding-left:12px!important}
    h3{break-after:avoid}
  }
</style>

</head>
<body data-aba="form">

<header class="barra">
  <a class="voltar" id="voltarCrm" href="../#mensagens" aria-label="Voltar ao AbertoCore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
  <div class="marca"><svg viewBox="0 0 96 96" aria-hidden="true"><rect width="96" height="96" rx="24" fill="#1E3050"/><path d="M24 74V46a24 24 0 0 1 48 0V74Z" fill="#FFB020"/><path d="M33 74V46.5a15 15 0 0 1 30 0V74Z" fill="#2F6FED"/><path d="M33 74V46.5A15 15 0 0 1 51 31.8V68.5Z" fill="#1E3050"/></svg><span class="nm">Aberto<b>Core</b></span></div>
  <span class="sep"></span><span class="tt">Auditoria de presença digital</span>
  <div class="dir">
    <select class="btn" id="salvas" aria-label="Contato do CRM"></select>
    <button class="btn" id="nova"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="txt">Nova</span></button>
    <button class="btn" id="salvar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6"/></svg><span class="txt">Salvar</span></button>
    <a class="btn" id="irBriefing" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9zM7 5H5v16h14V5h-2M9 12h6M9 16h4"/></svg><span class="txt">Briefing</span></a>
    <a class="btn" id="irProposta" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"/></svg><span class="txt">Gerar proposta</span></a>
    <button class="btn pri" id="imprimir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z"/></svg><span class="txt">Imprimir / PDF</span></button>
  </div>
</header>
<div class="abas-mob" role="tablist">
  <button role="tab" data-a="form" aria-selected="true">Preencher</button>
  <button role="tab" data-a="rel" aria-selected="false">Relatório <span id="mobScore"></span></button>
</div>

<main class="grade">
  <section class="form" id="form" aria-label="Dados da auditoria"></section>
  <article class="rel" id="rel" aria-label="Relatório"></article>
</main>

<script>
(function(){
  'use strict';
  function $(s){ return document.querySelector(s); }
  var aviso = Core.aviso;
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function hojeISO(){ var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function dataBR(s){ if (!s) return ''; var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }

  /* ===================================================================
     CRITÉRIOS: peso dentro da área (cada área soma 100), opções e textos.
     tipo 'op': opções [rótulo, valor 0..1]. tipo 'num': função de nota.
     perda: o que a empresa perde quando o item vai mal. acao: o que fazemos.
     =================================================================== */
  var SIM = [['Sim',1],['Parcial',.5],['Não',0]];
  var AREAS = [
    {id:'enc', nome:'Ser encontrado', peso:30, itens:[
      {id:'g_perfil', sol:'Start', q:'Tem perfil no Google (Maps)?', peso:25, tipo:'op', ops:[['Sim, verificado',1],['Sim, sem verificar',.5],['Não tem',0]],
        perda:'Quem procura no Google ou no Maps não encontra a empresa', acao:'Criar e verificar o perfil no Google'},
      {id:'g_busca', sol:'Start', q:'Aparece nos 3 primeiros do Maps buscando "[ramo] em [cidade]"?', peso:20, tipo:'op', ops:[['Top 3',1],['Até o 10º',.5],['Não aparece',0]],
        perda:'Os clientes encontram os concorrentes primeiro', acao:'Otimizar categoria, serviços e palavras do perfil'},
      {id:'g_fotos', sol:'Start', q:'Quantas fotos tem no perfil do Google?', peso:15, tipo:'num', ph:'nº de fotos', nota:function(n){ return n >= 10 ? 1 : n >= 1 ? .5 : 0; },
        perda:'Sem fotos, o perfil parece abandonado e recebe menos cliques', acao:'Publicar pelo menos 10 fotos boas do local e dos serviços'},
      {id:'g_categoria', sol:'Start', q:'Categoria e serviços estão corretos?', peso:10, tipo:'op', ops:SIM,
        perda:'O Google não mostra a empresa nas buscas certas', acao:'Corrigir categoria principal e listar os serviços'},
      {id:'g_horario', sol:'Start', q:'Horário e telefone estão atualizados?', peso:10, tipo:'op', ops:SIM,
        perda:'Clientes chegam com a loja fechada ou ligam para o número errado', acao:'Atualizar horário, feriados e telefone'},
      {id:'site', sol:'Start', q:'Tem site próprio?', peso:10, tipo:'op', ops:[['Sim',1],['Só link de rede social',.5],['Não',0]],
        perda:'Falta um endereço oficial para o cliente conferir serviços e preços', acao:'Criar site de 1 página com botão de WhatsApp'},
      {id:'site_mob', sol:'Start', q:'O site abre bem no celular e tem cadeado (HTTPS)?', peso:5, tipo:'op', ops:[['Sim',1],['Mais ou menos',.5],['Não / sem site',0]],
        perda:'O site assusta ou demora no celular, e o cliente desiste', acao:'Site rápido, responsivo e seguro'},
      {id:'g_posts', sol:'Gestão mensal do perfil no Google', q:'Publicou novidades no Google nos últimos 30 dias?', peso:5, tipo:'op', ops:[['Sim',1],['Não',0]],
        perda:'O perfil parece parado em comparação aos concorrentes', acao:'Publicar ofertas e novidades no Google todo mês'}
    ]},
    {id:'conf', nome:'Confiança e reputação', peso:25, itens:[

    if (A.resp && e.responsaveis[0] && !e.responsaveis[0].nome) e.responsaveis[0].nome = A.resp;
    var primeira = !c.auditoria || c.auditoria.data !== A.data;
    var dados = JSON.parse(JSON.stringify(A)); delete dados.cid;
    dados.geral = calc.geral; dados.areas = calc.areas.map(function(a){ return {id:a.id, nome:a.nome, nota:a.nota}; });
    dados.perdas = L.map(function(p){ return {perda:p.it.perda, area:p.ar.nome, acao:p.it.acao, sol:p.it.sol, grave:p.v < .5}; });
    dados.recomendacao = {pacote:rec.pacote, modulos:rec.modulos};
    c.auditoria = dados;
    c.auditorias = (c.auditorias || []).filter(function(x){ return x.data !== A.data; }).concat([{data:A.data, geral:calc.geral}]);
    var pac = rec.pacote && Core.produto(S, rec.pacote);
    if (!c.valor && pac && pac.setup) c.valor = pac.setup;
    if (primeira) c.msgs.push({de:'eq', txt:'Auditoria de presença digital: nota ' + (calc.geral == null ? '-' : calc.geral) + '/100.' + (rec.pacote ? ' Sugestão: pacote ' + rec.pacote + '.' : ''), ts:Date.now()});
    Core.salva(S);
    history.replaceState(null, '', '?c=' + c.id);
    desenhaContatos();
    aviso(novo ? (c.negocio || c.nome) + ' criado no CRM e auditoria salva.' : 'Auditoria salva no contato ' + (c.negocio || c.nome) + '.');
    return true;
  }
  $('#salvar').onclick = salvar;
  $('#salvas').onchange = function(e){ A = e.target.value ? deContato(e.target.value) : vazio(); history.replaceState(null, '', e.target.value ? '?c=' + e.target.value : '?'); desenhaForm(); desenhaRel(); desenhaContatos(); };
  $('#nova').onclick = function(){ A = vazio(); history.replaceState(null, '', '?'); desenhaForm(); desenhaRel(); desenhaContatos(); window.scrollTo(0, 0); };
  $('#irProposta').onclick = function(e){ if (!salvar()) e.preventDefault(); };

  $('#imprimir').onclick = function(){
    var t = document.title; document.title = tx('arquivo') + (A.empresa || tx('empresa')) + ' ' + dataRel(A.data).replace(/\//g, '-');
    window.print(); setTimeout(function(){ document.title = t; }, 500);
  };
  document.querySelector('.abas-mob').onclick = function(e){
    var b = e.target.closest('button'); if (!b) return;
    document.body.setAttribute('data-aba', b.getAttribute('data-a'));
    this.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-selected', x === b); });
    window.scrollTo(0, 0);
  };

  if (Core.param('c')) A = deContato(Core.param('c'));
  desenhaForm(); desenhaRel(); desenhaContatos();
})();
