<style>
/* Mesmos tokens e tema do app AbertoCore (index.html). Escuro por padrão, como no app. */
:root{--ink:#101A2C;--navy:#1E3050;--ambar:#FFB020;--ceu:#2F6FED;--papel:#F6F7F9;--branco:#fff;--texto:#101A2C;--sec:#5B6678;--muted:#8A93A6;--linha:#E2E6ED;--linha2:#D5DAE3;--verde:#1F9D55;--vermelho:#D64545;--wa:#1FAF5A;--ig:#C13584;--em:#5B6678;--sup2:#EEF1F6;--display:"Archivo",system-ui,sans-serif;--corpo:Inter,system-ui,sans-serif;--raio:14px}
html[data-tema="escuro"]{color-scheme:dark;--papel:#0D131D;--branco:#161E2B;--texto:#E7EBF2;--sec:#A2ACBE;--muted:#7F8AA0;--linha:#243044;--linha2:#2F3B52;--sup2:#1C2636;--sup3:#223047}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--corpo);color:var(--texto);background:var(--papel);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--ceu);outline-offset:2px}
.app{display:grid;grid-template-columns:64px 340px minmax(0,1fr) 320px;height:calc(100% - 68px)}
.rail button{position:relative}.rail .bolha{position:absolute;top:1px;right:1px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--ambar);color:#241700;font-size:10px;font-weight:800;display:grid;place-items:center}
.rail{background:#0F1624;border-right:1px solid var(--linha);display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0}
html:not([data-tema="escuro"]) .rail{background:#fff}
.rail .logo{width:40px;height:40px;margin-bottom:8px}
.rail button{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--sec);font-size:20px}
.rail button[aria-current="page"]{background:var(--ceu);color:#fff}
.lista{background:var(--branco);border-right:1px solid var(--linha);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topo{padding:14px 16px;border-bottom:1px solid var(--linha)}
.topo h1{font:800 22px var(--display);letter-spacing:-.01em}
.topo p{font-size:12px;color:var(--sec)}
.demo{font-size:11px;font-weight:700;color:#8A5A00;background:#FFF4DA;border:1px solid #F5D98F;padding:2px 8px;border-radius:99px;display:inline-block;margin-top:6px}
html[data-tema="escuro"] .demo{background:#2E2410;border-color:#5A4614;color:#F5D98F}
.abas{display:flex;gap:6px;padding:10px 12px}
.abas span{padding:6px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--sec)}
.abas .on{background:var(--sup2);color:var(--texto)}
.itens{overflow:auto;flex:1}
.item{display:flex;gap:12px;padding:12px 14px;width:100%;text-align:left;border-left:3px solid transparent}
.item[aria-selected="true"]{background:rgba(47,111,237,.14);border-left-color:var(--ceu)}
.av{width:40px;height:40px;border-radius:50%;background:var(--sup2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;position:relative;color:var(--sec)}
.av i{display:none}.av .x{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;border:2px solid var(--branco)}
.it-t{min-width:0;flex:1}
.it-n{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.it-n small{font-weight:500;color:var(--muted);font-size:11px}
.it-p{font-size:12.5px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;padding:1px 8px;border-radius:6px;background:rgba(47,111,237,.16);color:#8DB4FF}
html:not([data-tema="escuro"]) .tag{color:#1D4FBF}
.tag.v{background:rgba(31,157,85,.18);color:#7CDCA6}.tag.a{background:rgba(255,176,32,.18);color:#FFCF6B}.tag.r{background:rgba(214,69,69,.2);color:#FF9C9C}
html:not([data-tema="escuro"]) .tag.v{color:#14693A}html:not([data-tema="escuro"]) .tag.a{color:#8A5A00}html:not([data-tema="escuro"]) .tag.r{color:#A12626}
.nao{background:var(--ceu);color:#fff;border-radius:99px;font-size:11px;font-weight:700;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.conversa{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--papel)}
.conv-topo{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--branco);border-bottom:1px solid var(--linha)}
.conv-topo .nm{font-weight:700;font-size:16px}.conv-topo .ng{font-size:13px;color:var(--sec)}
.fio{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.dia{align-self:center;font-size:12px;color:var(--sec);border:1px solid var(--linha);border-radius:99px;padding:3px 12px;background:var(--branco)}
.m{max-width:78%;padding:10px 14px;border-radius:14px;font-size:14px;background:var(--branco);border:1px solid var(--linha)}
.m.eq{align-self:flex-end;background:#2B4A8F;border-color:#2B4A8F;color:#fff}
.m.cli{align-self:flex-start}
.m.ia{align-self:flex-end;background:#2E2410;border:1px solid #5A4614;color:#F5D98F}
html:not([data-tema="escuro"]) .m.ia{background:#FFF4DA;border-color:#F5D98F;color:#5A4614}
.m.nota{align-self:center;font-size:12px;color:var(--sec);background:transparent;border:1px dashed var(--linha2);max-width:92%}
.m b.sel{display:inline-block;font-size:11px;margin-bottom:2px;opacity:.85}
.resp{margin:12px 18px;border:1px solid var(--linha);border-radius:14px;background:var(--branco);padding:10px 14px;color:var(--muted);font-size:14px}
.painel{background:var(--branco);border-left:1px solid var(--linha);overflow:auto;padding:18px}
.painel .perfil{text-align:center}
.painel .perfil .av{width:64px;height:64px;margin:0 auto 8px;font-size:22px;color:var(--texto)}
.painel h2{font:700 17px var(--corpo)}
.painel .sub{font-size:13px;color:var(--sec)}
.bts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0;border-top:1px solid var(--linha);padding-top:12px}
.bt{border:1px solid var(--linha2);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600}
.lb{font-size:12px;font-weight:700;color:var(--sec);margin:14px 0 6px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sup2);border-radius:10px;padding:3px}
.seg span{text-align:center;padding:7px;border-radius:8px;font-size:13px;font-weight:600;color:var(--sec)}
.seg .on{background:var(--ceu);color:#fff}
.campo{border:1px solid var(--linha2);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--papel)}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pri{display:block;width:100%;background:var(--ceu);color:#fff;border-radius:12px;padding:12px;font-weight:700;margin-top:16px;text-align:center}
.pag{border:1px solid var(--linha2);border-radius:12px;padding:12px;background:var(--papel);font-size:13px}
.pag b{font-size:14px}
.ok{background:var(--verde);color:#fff;border-radius:10px;padding:10px;font-weight:700;width:100%;margin-top:10px}
.agenda{grid-column:2/-1;padding:22px;overflow:auto;background:var(--papel)}
.agenda h1{font:800 24px var(--display);margin-bottom:4px}
.agenda .dd{margin:16px 0 6px;font-weight:700;font-size:13px;color:var(--sec)}
.ev{display:flex;gap:14px;background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.ev.novo{border-color:var(--ceu);box-shadow:0 0 0 2px rgba(47,111,237,.25)}
.ev .h{font-weight:700;min-width:54px}
.ev small{display:block;color:var(--sec)}
.funil{grid-column:2/-1;padding:22px;overflow:auto;background:var(--papel);display:flex;gap:14px;align-items:flex-start}
.col{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:12px;min-width:240px;flex:1}
.col h3{font-size:13px;color:var(--sec);margin-bottom:10px;display:flex;justify-content:space-between}
.card{background:var(--papel);border:1px solid var(--linha);border-radius:10px;padding:10px;margin-bottom:8px;font-size:13px}
.card.novo{border-color:var(--ceu)}
.rodape{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:9}
.rodape a{flex:1;text-align:center;padding:12px;border-radius:12px;font-weight:700;font-size:14px;text-decoration:none;border:1px solid var(--linha2);background:var(--branco);color:var(--texto)}
.rodape a.cta{background:var(--ceu);border-color:var(--ceu);color:#fff}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#0F1624;color:#fff;border:1px solid var(--linha2);border-radius:99px;padding:8px 16px;font-size:13px;font-weight:600;z-index:10}
.mob{display:none}
.tbm,.faixa-m,.voltar-m,.det-btn,.sheet-x{display:none}
.rail svg,.tbm svg,.cmp svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--sup2);color:var(--sec);font-size:13px;font-weight:700}
.sec-h b{background:var(--branco);border-radius:99px;padding:1px 10px;font-size:12px}
.badge{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--branco);color:#fff}
.badge svg{width:10px;height:10px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cmp{margin:12px 18px 14px;border:1px solid var(--linha);border-radius:14px;background:var(--branco);overflow:hidden}
.cmp-t{display:flex;gap:18px;padding:0 14px;border-bottom:1px solid var(--linha);font-size:14px;font-weight:600;color:var(--sec)}
.cmp-t span{padding:11px 0;display:flex;gap:6px;align-items:center}.cmp-t .on{color:var(--texto);box-shadow:inset 0 -2px var(--texto)}
.cmp-t svg{width:14px;height:14px}
.cmp-c{padding:12px 14px;color:var(--muted);font-size:14px;min-height:46px}
.cmp-b{display:flex;align-items:center;gap:14px;padding:4px 12px 12px;color:var(--sec)}
.cmp-b .env{margin-left:auto;width:38px;height:38px;border-radius:50%;background:#E7EBF2;color:#101A2C;display:grid;place-items:center}
.cmp-b .env svg{width:17px;height:17px}

/* painel, agenda e ficha, no visual do app real */
.dash{grid-column:2/-1;padding:22px 22px 90px;overflow:auto;background:var(--papel);display:grid;grid-template-columns:repeat(12,1fr);gap:14px;align-content:start}
.dash .cab{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dash .cab h1{font:800 24px var(--display)}
.seg-p{display:flex;gap:2px;background:var(--sup2);border-radius:10px;padding:3px}.seg-p button{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--sec)}.seg-p button[aria-checked=true]{background:var(--ceu);color:#fff}
.kpi{grid-column:span 3;background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:15px 17px}
.kpi .r{font-size:13px;color:var(--sec);font-weight:600}.kpi .n{font:800 2.1rem/1.1 var(--display);font-stretch:85%;margin:4px 0 2px}.kpi .n small{font:600 13px var(--corpo);color:var(--sec);margin-left:4px}.kpi .s{font-size:12.5px;color:var(--sec)}.kpi .s.up{color:#7CDCA6;font-weight:600}
.kpi .tri{height:6px;border-radius:99px;background:var(--sup2);margin:8px 0 4px;overflow:hidden}.kpi .tri i{display:block;height:100%;background:var(--ceu);border-radius:99px}
.pn2{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:16px 18px}
.pn2 h2{font:700 15px var(--corpo);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.g8{grid-column:span 8}.g4{grid-column:span 4}.g6{grid-column:span 6}
.dash svg{width:100%;height:auto;display:block}.dash .leg{font-size:12px;color:var(--sec);margin-top:8px}
.atd{display:grid;grid-template-columns:1fr 1fr;gap:10px}.atd div{background:var(--papel);border:1px solid var(--linha);border-radius:12px;padding:12px}.atd b{display:block;font:800 1.5rem var(--display)}.atd small{color:var(--sec);font-size:12px}
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dia-col{background:var(--papel);border:1px solid var(--linha);border-radius:12px;padding:8px;min-height:190px;min-width:0}
.dia-col.hoje{border-color:var(--ceu)}.dia-col .d{font-size:11px;color:var(--sec);text-transform:uppercase;font-weight:700}.dia-col .nn{font:800 18px var(--display);margin-bottom:6px}
.dia-col .e{display:block;font-size:11px;border-radius:8px;padding:5px 6px;margin-bottom:4px;background:rgba(47,111,237,.16);color:#9DBBFF;line-height:1.25}.dia-col .e b{display:block;color:var(--texto);font-size:11.5px}.dia-col .e.nv{background:rgba(255,176,32,.2);color:#FFCF6B;box-shadow:0 0 0 1px rgba(255,176,32,.5)}
.ag2{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;align-items:start}
.ag2 .col2{display:grid;gap:14px}
.fu{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--linha)}.fu:first-of-type{border-top:0}.fu .av{width:34px;height:34px;font-size:12px}.fu b{font-size:13.5px;display:block}.fu small{color:var(--sec);font-size:12px}
.on-l{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--linha);font-size:13px}.on-l:first-of-type{border-top:0}.on-l span:last-child{color:var(--sec);text-align:right}
.tl{list-style:none;margin:0;padding:0}.tl li{position:relative;padding:0 0 12px 18px;font-size:12.5px;color:var(--sec)}.tl li:before{content:"";position:absolute;left:3px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--ceu)}.tl li:after{content:"";position:absolute;left:6.5px;top:15px;bottom:-2px;width:1px;background:var(--linha2)}.tl li:last-child:after{display:none}.tl b{color:var(--texto);display:block;font-size:13px}
.fch{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:12.5px}.fch small{display:block;color:var(--muted);font-size:11px;font-weight:600}.fch div{min-width:0}
.col .tot{font-weight:600;color:var(--muted)}.card .vl{float:right;font-weight:700;color:var(--sec)}
@media (max-width:760px){.dash{grid-column:auto;display:grid;grid-template-columns:1fr 1fr;height:100%;padding:16px}.kpi{grid-column:span 1;padding:12px 13px}.kpi .n{font-size:1.6rem}.g8,.g4,.g6,.ag2{grid-column:1/-1}.ag2{grid-template-columns:1fr}.semana{grid-template-columns:1fr 1fr}.dia-col{min-height:0}.dash .cab{flex-wrap:wrap}}
@media (max-width:760px){
  html,body{height:100%;overflow:hidden;background:var(--branco)}
  body{font-size:14.5px}
  .tbm{display:flex;position:fixed;top:0;left:0;right:0;height:60px;z-index:20;align-items:center;gap:10px;padding:0 12px 0 14px;background:var(--branco);border-bottom:1px solid var(--linha)}
  .tbm img{width:34px;height:34px;border-radius:9px}
  .tbm .chip{font-size:11px;font-weight:700;color:#F5D98F;background:#2E2410;border:1px solid #5A4614;padding:2px 9px;border-radius:99px}
  .tbm h1{font:800 20px var(--display);letter-spacing:-.01em;flex:1}
  .tbm .mais{width:40px;height:40px;border-radius:12px;background:var(--ceu);color:#fff;display:grid;place-items:center}
  .faixa-m{display:flex;position:fixed;top:60px;left:0;right:0;z-index:19;height:38px;align-items:center;justify-content:space-between;padding:0 14px;background:var(--sup2);border-bottom:1px solid var(--linha);font-size:12.5px;font-weight:600}
  .faixa-m a{color:var(--sec);text-decoration:none}.faixa-m a.cta{color:#8DB2FF}
  .app{display:block;height:100%;padding-top:98px;padding-bottom:64px}
  .app>.lista{height:100%}
  .app.m-conv,.app.m-det{padding-top:0;padding-bottom:0}
  .app.m-conv ~ .tbm,.app.m-det ~ .tbm{display:none}
  .rail{position:fixed;left:0;right:0;bottom:0;z-index:20;flex-direction:row;justify-content:space-between;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:#0A0F18;border-right:0;border-top:1px solid var(--linha);height:64px}
  .rail .logo{display:none}
  .rail button{flex:1;width:auto;height:46px;position:relative}
  .rail button[aria-current="page"]{background:rgba(47,111,237,.22);color:#7FA6FF}
  .rail .bolha{position:absolute;top:2px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:99px;background:var(--ambar);color:#241700;font-size:10px;font-weight:800;display:grid;place-items:center}
  .app.m-conv .rail,.app.m-det .rail{display:none}
  .lista{height:100%;border:0}.lista .topo{display:none}
  .itens{flex:1;overflow:auto}
  .app.m-conv .lista,.app.m-det .lista,.app.m-lista .conversa,.app.m-lista .painel,.app.m-conv .painel{display:none}
  .conversa{height:100dvh;min-height:0}
  .conv-topo{background:var(--papel);padding:calc(10px + env(safe-area-inset-top)) 12px 10px 6px}
  .voltar-m,.det-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--texto)}
  .det-btn{margin-left:auto;border:1px solid var(--linha2)}
  .voltar-m svg,.det-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .fio{padding:14px}
  .cmp{margin:8px 12px calc(10px + env(safe-area-inset-bottom))}
  .app.m-det .conversa{display:none}
  .app.m-det .painel{display:block;height:100dvh;border:0;padding-top:0}
  .sheet-x{display:flex;align-items:center;gap:10px;position:sticky;top:-18px;margin:-18px -18px 14px;padding:calc(12px + env(safe-area-inset-top)) 12px 12px;background:var(--branco);border-bottom:1px solid var(--linha);font-weight:700;z-index:2}
  .sheet-x .voltar-m{margin-left:-6px}
  .agenda,.funil,.dash{height:100%;overflow:auto;padding:16px 16px 24px}.funil{flex-direction:column}.col{min-width:0;width:100%}
  .rodape{display:none}
  .toast{bottom:78px}body[data-m=m-conv] .toast,body[data-m=m-det] .toast{bottom:auto;top:72px}
  .app.m-conv ~ .faixa-m,.app.m-det ~ .faixa-m{display:none}
  .conv-topo>div:not(.av){min-width:0}.conv-topo .ng,.conv-topo .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
@media (min-width:761px){.faixa-m{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* Simulador do AbertoCore para as demonstrações. Lê o pedido guardado pelas páginas de agendamento/orçamento
   (sessionStorage 'abertocore-sim') e mostra como o dono recebe: Conversas, Agenda e Funil, no visual do app. */
(function(){
  var raw=null;try{raw=JSON.parse(sessionStorage.getItem('abertocore-sim')||'null')}catch(e){}
  var S=raw||{negocio:{nome:'Seu negócio',tipo:'agendamento',l:'pt',volta:'../',cor:'#2F6FED'},cliente:{nome:'Cliente de exemplo',canal:'whatsapp',contato:'(843) 000-0000'},item:{servico:'Serviço de exemplo',dia:'',hora:'10:00',valor:80},sinal:{valor:30,forma:'local',status:'local'},ts:Date.now()};
  var N=S.negocio,C=S.cliente,I=S.item,P=S.sinal,en=N.l==='en',ag=N.tipo==='agendamento';
  function t(pt,e){return en?e:pt}
  var CANAL={whatsapp:{n:'WhatsApp',c:'var(--wa)'},instagram:{n:'Instagram',c:'var(--ig)'},email:{n:t('E-mail','Email'),c:'var(--em)'},site:{n:'Site',c:'var(--ceu)'}};
  var IC={"x":"<rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\"/><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"/>","conversas": "<path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z\"/>", "funil": "<path d=\"M3 5h18l-7 8.5V20l-4-2v-4.5z\"/>", "agenda": "<rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15\" rx=\"2.5\"/><path d=\"M8 3v4M16 3v4M3.5 10h17\"/>", "painel": "<path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"/>", "cfg": "<circle cx=\"12\" cy=\"12\" r=\"3.2\"/><path d=\"M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8\"/>"};function ic(k){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+IC[k]+'</svg>'}
  var CHI={whatsapp:'<path d="M5 19l1-3.5A7 7 0 1 1 9 18z"/>',instagram:'<rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.6"/>',email:'<rect x="3.5" y="6" width="17" height="12" rx="2"/><path d="M4 7l8 6 8-6"/>',site:'<circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c3 3 3 13 0 16M12 4c-3 3-3 13 0 16"/>'};
  function bdg(c){return '<span class="badge" style="background:'+CANAL[c].c+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+CHI[c]+'</svg></span>'}
  var vista='conversas',sel='novo',aberta=false,det=false;
  var usd=function(v){return '$'+v};
  function ini(n){return n.split(' ').map(function(p){return p[0]}).slice(0,2).join('').toUpperCase()}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function hora(ts){return new Date(ts).toLocaleTimeString(en?'en-US':'pt-BR',{hour:'2-digit',minute:'2-digit'})}
  var outros=ag?[
    {id:'o1',nome:'Fernanda R.',canal:'whatsapp',txt:t('Tem horário sábado de manhã?','Any openings Saturday morning?'),tag:t('Lead','Lead'),etapa:t('Novo contato','New contact'),h:'09:12'},
    {id:'o2',nome:'Patrícia L.',canal:'instagram',txt:t('Quanto fica o alongamento?','How much for extensions?'),tag:'Lead',etapa:t('Qualificado','Qualified'),h:'08:40'},
    {id:'o3',nome:'Juliana S.',canal:'site',txt:t('Amei o resultado, obrigada!','Loved the result, thank you!'),tag:t('Cliente','Client'),etapa:t('Pós-atendimento','After visit'),h:t('ontem','yesterday')}
  ]:[
    {id:'o1',nome:'Lucas P.',canal:'instagram',txt:t('Quero fechar o braço em preto e cinza.','I want a black and grey sleeve.'),tag:'Lead',etapa:t('Qualificado','Qualified'),h:'09:30'},
    {id:'o2',nome:'Camila R.',canal:'whatsapp',txt:t('Tem horário para fineline sábado?','Any fine line slots Saturday?'),tag:'Lead',etapa:t('Novo contato','New contact'),h:'08:05'},
    {id:'o3',nome:'Diego S.',canal:'site',txt:t('Aprovado, pode marcar.','Approved, go ahead and book.'),tag:t('Cliente','Client'),etapa:t('Proposta enviada','Quote sent'),h:t('ontem','yesterday')}
  ];

  var DIAS=en?['Sun','Mon','Tue','Wed','Thu','Fri','Sat']:['dom','seg','ter','qua','qui','sex','sáb'];
  function colNovo(){var d=String(I.dia||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');var m={dom:0,sun:0,seg:1,mon:1,ter:2,tue:2,qua:3,wed:3,qui:4,thu:4,sex:5,fri:5,sab:6,sat:6};var k=d.slice(0,3),w=m[k];var hj=new Date().getDay();if(w==null)return 3;var diff=(w-hj+7)%7;return diff===0?7:diff}
  var VAL=function(){return ag?+I.valor||120:Math.round(((+I.de||0)+(+I.ate||0))/2)||1800};
  var FICHA=ag?[[t('Serviço','Service'),I.servico],[t('Próxima manutenção','Next refill'),t('em 3 semanas','in 3 weeks')],[t('Preferências','Preferences'),t('formato amendoado, cores nude','almond shape, nude tones')],[t('Alergias','Allergies'),t('nenhuma informada','none reported')]]
    :[[t('Pedido','Request'),I.servico],[t('Faixa estimada','Estimate'),usd(I.de||0)+'–'+usd(I.ate||0)],[t('Referências','References'),t('enviadas pelo formulário','sent in the form')],[t('Alergias','Allergies'),t('a confirmar na consulta','to confirm at consult')]];
  function hist(){var h=[[ag?t('Agendamento feito no site','Booked on the website'):t('Pedido de orçamento no site','Quote request on the website'),hora(S.ts)],[t('IA confirmou por '+CANAL[C.canal].n,'AI confirmed via '+CANAL[C.canal].n),hora(S.ts+2000)]];
    if(P.forma==='cartao'||P.status==='confirmado')h.push([t('Sinal de '+usd(P.valor)+' recebido','Deposit of '+usd(P.valor)+' received'),t('agora','now')]);else if(P.forma==='zelle')h.push([t('Sinal de '+usd(P.valor)+' por Zelle aguardando você','Zelle deposit of '+usd(P.valor)+' waiting on you'),t('pendente','pending')]);
    h.push([t('Lembrete automático agendado','Automatic reminder scheduled'),t('1 dia antes','1 day before')]);return '<ul class="tl">'+h.map(function(x){return '<li><b>'+x[0]+'</b>'+x[1]+'</li>'}).join('')+'</ul>'}
  function conf(){
    var nome=C.nome.split(' ')[0];
    if(ag)return t('Oi, '+nome+'! Seu horário na '+N.nome+' está confirmado: '+I.servico+', '+I.dia+' às '+I.hora+'. Você vai receber um lembrete antes.','Hi '+nome+'! Your appointment at '+N.nome+' is confirmed: '+I.servico+', '+I.dia+' at '+I.hora+'. You will get a reminder before.');
    return t('Oi, '+nome+'! Recebi o seu pedido: '+I.servico+'. A faixa estimada é '+usd(I.de)+' a '+usd(I.ate)+'. O '+N.dono+' vai ver as referências e responde com o valor final e os horários.','Hi '+nome+'! I got your request: '+I.servico+'. The estimate is '+usd(I.de)+' to '+usd(I.ate)+'. '+N.dono+' will review the references and reply with the final price and times.');
  }
  function contatoHtml(){var l=[];if(C.telefone)l.push(t('Telefone','Phone')+' · '+esc(C.telefone));if(C.instagram)l.push('Instagram · '+esc(C.instagram));if(C.email)l.push(t('E-mail','Email')+' · '+esc(C.email));if(!l.length&&C.contato)l.push(esc(C.contato));return l}
  function msgs(){
    var l=[{k:'dia',txt:t('Hoje','Today')},
      {k:'cli',txt:ag?t('Agendamento feito pelo site: '+I.servico+', '+I.dia+' às '+I.hora+'.','Booked on the website: '+I.servico+', '+I.dia+' at '+I.hora+'.'):t('Pedido de orçamento pelo site: '+I.servico+'. '+(I.resumo||''),'Quote request from the website: '+I.servico+'. '+(I.resumo||'')),ts:S.ts},
      {k:'ia',txt:conf(),ts:S.ts+2000,sel:t('Assistente de IA · enviada por '+CANAL[C.canal].n,'AI assistant · sent via '+CANAL[C.canal].n)}];
    var ct=contatoHtml();if(ct.length)l.push({k:'nota',txt:t('Contato salvo no cadastro: ','Contact saved to the record: ')+C.nome+' · '+ct.join(' · ').replace(/&amp;/g,'&')+'. '+t('Canal preferido para respostas: ','Preferred reply channel: ')+CANAL[C.canal].n+'.'});
    if(P.forma==='zelle'&&P.status==='aguardando')l.push({k:'nota',txt:t('Sinal de '+usd(P.valor)+' por Zelle informado pela cliente. Confirme quando o valor aparecer na sua conta.','Client reported a '+usd(P.valor)+' Zelle deposit. Confirm once it shows in your account.')});
    if(P.forma==='cartao')l.push({k:'nota',txt:t('Sinal de '+usd(P.valor)+' pago por cartão (Stripe). Confirmado automaticamente.','Deposit of '+usd(P.valor)+' paid by card (Stripe). Confirmed automatically.')});
    if(P.status==='confirmado')l.push({k:'ia',txt:t('Recebemos o seu sinal de '+usd(P.valor)+'. Obrigada, '+C.nome.split(' ')[0]+'! Seu horário está garantido.','We received your '+usd(P.valor)+' deposit. Thank you, '+C.nome.split(' ')[0]+'! Your spot is secured.'),ts:Date.now(),sel:t('Assistente de IA · enviada por '+CANAL[C.canal].n,'AI assistant · sent via '+CANAL[C.canal].n)});
    return l;
  }
  function statusSinal(){
    if(P.forma==='local')return {tx:t('Pagar no local','Pay on site'),tg:'a'};
    if(P.forma==='cartao'||P.status==='confirmado')return {tx:t('Sinal pago','Deposit paid'),tg:'v'};
    return {tx:t('Sinal aguardando','Deposit pending'),tg:'a'};
  }
  function rail(){return '<nav class="rail" aria-label="Menu"><img class="logo" alt="AbertoCore" src="data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 96 96\'%3E%3Crect width=\'96\' height=\'96\' rx=\'24\' fill=\'%231E3050\'/%3E%3Cpath d=\'M24 74V46a24 24 0 0 1 48 0V74Z\' fill=\'%23FFB020\'/%3E%3Cpath d=\'M33 74V46.5a15 15 0 0 1 30 0V74Z\' fill=\'%232F6FED\'/%3E%3Cpath d=\'M33 74V46.5A15 15 0 0 1 51 31.8V68.5Z\' fill=\'%231E3050\'/%3E%3C/svg%3E">'+
    [['conversas','conversas',t('Conversas','Chats')],['funil','funil',t('Funil','Funnel')],['agenda','agenda',t('Agenda','Calendar')],['painel','painel',t('Painel','Dashboard')],['x','cfg',t('Configurações','Settings')]].map(function(x){return '<button data-v="'+x[0]+'" aria-label="'+x[2]+'" '+(vista===x[0]?'aria-current="page"':'')+'>'+ic(x[1])+(x[1]==='conversas'?'<span class="bolha">'+(1+outros.length)+'</span>':'')+'</button>'}).join('')+'</nav>'}
  function lista(){
    var st=statusSinal();
    var novo='<button class="item" data-s="novo" aria-selected="'+(sel==='novo')+'"><div class="av">'+ini(C.nome)+''+bdg(C.canal)+'</div><div class="it-t"><div class="it-n">'+esc(C.nome)+'<small>'+hora(S.ts)+'</small></div><div class="it-p">'+esc(ag?t('Novo agendamento · '+I.dia+' '+I.hora,'New booking · '+I.dia+' '+I.hora):t('Novo orçamento · '+I.servico,'New quote · '+I.servico))+'</div><div class="tags"><span class="tag">Lead</span><span class="tag">'+t('Novo contato','New contact')+'</span><span class="tag '+st.tg+'">'+st.tx+'</span></div></div><span class="nao">1</span></button>';
    var ou=outros.map(function(o){return '<button class="item" data-s="'+o.id+'" aria-selected="'+(sel===o.id)+'"><div class="av">'+ini(o.nome)+''+bdg(o.canal)+'</div><div class="it-t"><div class="it-n">'+o.nome+'<small>'+o.h+'</small></div><div class="it-p">'+CANAL[o.canal].n+' · '+o.txt+'</div><div class="tags"><span class="tag">'+o.tag+'</span><span class="tag">'+o.etapa+'</span></div></div></button>'}).join('');
    return '<section class="lista"><div class="topo"><h1>'+t('Conversas','Chats')+'</h1><p>WhatsApp, Instagram, '+t('e-mail e site numa caixa só','email and website in one inbox')+'</p><span class="demo">'+t('Demonstração · nada aqui é real','Demo · nothing here is real')+'</span></div><div class="abas"><span class="on">'+t('Entrada','Inbox')+' <b>'+(1+outros.length)+'</b></span><span>'+t('Prospecção','Prospecting')+'</span></div><div class="itens"><div class="sec-h">'+t('Para responder','To answer')+'<b>'+(1+outros.length)+'</b></div>'+novo+ou+'</div></section>';
  }
  function conversa(){
    if(sel!=='novo'){var o=outros.filter(function(x){return x.id===sel})[0];return '<section class="conversa"><div class="conv-topo"><button class="voltar-m" data-b="lista" aria-label="'+t('Voltar','Back')+'"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div class="av">'+ini(o.nome)+'</div><div><div class="nm">'+o.nome+'</div><div class="ng">'+N.nome+' · '+CANAL[o.canal].n+'</div></div><button class="det-btn" data-b="det" aria-label="'+t('Detalhes do contato','Contact details')+'"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></button></div><div class="fio"><div class="m cli">'+o.txt+'</div></div>'+'<div class="cmp"><div class="cmp-t"><span class="on">'+t('Responder','Reply')+'</span><span>'+ic('x')+t('Nota privada','Private note')+'</span></div><div class="cmp-c">'+t('Escreva sua resposta (/ atalhos)','Write your reply (/ shortcuts)')+'</div><div class="cmp-b"><span>＋</span><span>☺</span><span style="color:var(--ambar)">✦</span><span class="env"><svg viewBox="0 0 24 24"><path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/></svg></span></div></div>'+'</section>'}
    return '<section class="conversa"><div class="conv-topo"><button class="voltar-m" data-b="lista" aria-label="'+t('Voltar','Back')+'"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div class="av">'+ini(C.nome)+''+bdg(C.canal)+'</div><div><div class="nm">'+esc(C.nome)+'</div><div class="ng">'+esc(N.nome)+' · '+CANAL[C.canal].n+' · '+esc(C.telefone||C.contato)+'</div></div><button class="det-btn" data-b="det" aria-label="'+t('Detalhes do contato','Contact details')+'"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></button></div><div class="fio">'+
      msgs().map(function(m){if(m.k==='dia')return '<span class="dia">'+m.txt+'</span>';return '<div class="m '+m.k+'">'+(m.sel?'<b class="sel">✨ '+m.sel+'</b><br>':'')+esc(m.txt)+'</div>'}).join('')+'</div>'+'<div class="cmp"><div class="cmp-t"><span class="on">'+t('Responder','Reply')+'</span><span>'+ic('x')+t('Nota privada','Private note')+'</span></div><div class="cmp-c">'+t('Escreva sua resposta (/ atalhos)','Write your reply (/ shortcuts)')+'</div><div class="cmp-b"><span>＋</span><span>☺</span><span style="color:var(--ambar)">✦</span><span class="env"><svg viewBox="0 0 24 24"><path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/></svg></span></div></div>'+'</section>';
  }
  function painel(){
    if(sel!=='novo'){var o=outros.filter(function(x){return x.id===sel})[0];return '<aside class="painel"><div class="sheet-x"><button class="voltar-m" data-b="conv" aria-label="'+t('Voltar','Back')+'"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>'+t('Detalhes do contato','Contact details')+'</div><div class="perfil"><div class="av">'+ini(o.nome)+'</div><h2>'+o.nome+'</h2><div class="sub">'+CANAL[o.canal].n+'</div></div><div class="lb">'+t('Classificação','Type')+'</div><div class="seg"><span class="on">Lead</span><span>'+t('Cliente','Client')+'</span></div><div class="lb">'+t('Etapa do funil','Funnel stage')+'</div><div class="campo">'+o.etapa+'</div></aside>'}
    var etapa=ag?t('Agendado','Booked'):t('Novo orçamento','New quote');
    var pg='';
    if(P.forma==='zelle')pg='<div class="lb">'+t('Sinal','Deposit')+'</div><div class="pag"><b>'+usd(P.valor)+' · Zelle</b><br>'+(P.status==='confirmado'?t('Recebimento confirmado por você.','Receipt confirmed by you.'):t('A cliente informou o envio. Aguardando você conferir na conta.','Client reported sending it. Waiting for you to check your account.'))+(P.status==='confirmado'?'':'<button class="ok" id="conf">'+t('Confirmar recebimento','Confirm receipt')+'</button>')+'</div>';
    else if(P.forma==='cartao')pg='<div class="lb">'+t('Sinal','Deposit')+'</div><div class="pag"><b>'+usd(P.valor)+' · '+t('Cartão (Stripe)','Card (Stripe)')+'</b><br>'+t('Pago e confirmado automaticamente.','Paid and confirmed automatically.')+'</div>';
    else pg='<div class="lb">'+t('Sinal','Deposit')+'</div><div class="pag"><b>'+t('Pagar no local','Pay on site')+'</b><br>'+t('Sem sinal antecipado.','No upfront deposit.')+'</div>';
    return '<aside class="painel"><div class="sheet-x"><button class="voltar-m" data-b="conv" aria-label="'+t('Voltar','Back')+'"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>'+t('Detalhes do contato','Contact details')+'</div><div class="perfil"><div class="av">'+ini(C.nome)+''+bdg(C.canal)+'</div><h2>'+esc(C.nome)+'</h2><div class="sub">'+esc(N.nome)+' · '+CANAL[C.canal].n+'</div><div class="sub">'+esc(C.telefone||C.contato)+'</div></div>'+
      '<div class="bts"><span class="bt">✏️ '+t('Editar','Edit')+'</span><span class="bt">✕ '+t('Ignorar','Ignore')+'</span><span class="bt">'+t('Arquivar','Archive')+'</span></div>'+
      '<div class="lb">'+t('Contato salvo','Saved contact')+'</div><div class="pag">'+contatoHtml().join('<br>')+'<br><small style="color:var(--sec)">'+t('Prefere receber por ','Prefers replies on ')+CANAL[C.canal].n+'</small></div>'+
      '<div class="lb">'+(ag?t('Ficha da cliente','Client record'):t('Ficha do cliente','Client record'))+'</div><div class="pag"><div class="fch">'+FICHA.map(function(f){return '<div><small>'+f[0]+'</small>'+esc(f[1])+'</div>'}).join('')+'</div></div>'+
      '<div class="lb">'+t('Histórico','History')+'</div><div class="pag">'+hist()+'</div>'+
      '<div class="lb">'+t('Classificação','Type')+'</div><div class="seg"><span class="on">Lead</span><span>'+t('Cliente','Client')+'</span></div>'+
      '<div class="lb">'+t('Etapa do funil','Funnel stage')+'</div><div class="campo">'+etapa+'</div>'+
      '<div class="dois"><div><div class="lb">'+t('Valor ($)','Value ($)')+'</div><div class="campo">'+(ag?I.valor:Math.round((I.de+I.ate)/2))+'</div></div><div><div class="lb">'+t('Próximo retorno','Next follow-up')+'</div><div class="campo">'+esc(ag?I.dia:t('amanhã','tomorrow'))+'</div></div></div>'+pg+
      (ag?'<div class="lb">'+t('Compromisso','Appointment')+'</div><div class="pag"><b>'+esc(I.servico)+'</b><br>'+esc(I.dia)+' · '+I.hora+'</div>':'<div class="lb">'+t('Respostas do formulário','Form answers')+'</div><div class="pag">'+esc(I.resumo||'')+'</div>')+
      '<div class="pri">📅 '+t('Agendar compromisso','Schedule appointment')+'</div></aside>';
  }
  function agenda(){
    var hoje=new Date(),nv=colNovo(),dias=[];
    for(var i=0;i<7;i++){var d=new Date(hoje.getTime()+i*864e5);dias.push(d)}
    var ev=ag?{1:[['18:00','Fernanda R.',t('Design de sobrancelhas','Brows')]],3:[['11:00','Patrícia L.',t('Esmaltação em gel','Gel polish')]],5:[['15:30','Marina L.',t('Manutenção','Refill')]]}:{2:[['14:00','Lucas P.',t('Sessão · braço','Session · sleeve')]],5:[['10:00','Camila R.',t('Fineline','Fine line')]]};
    var colN=Math.min(nv,6);
    var sem=dias.map(function(d,i){var es=(ev[i]||[]).map(function(e){return '<span class="e"><b>'+e[0]+' · '+e[1]+'</b>'+e[2]+'</span>'}).join('');
      if(i===colN&&ag)es+='<span class="e nv"><b>'+I.hora+' · '+esc(C.nome)+'</b>'+esc(I.servico)+'</span>';
      return '<div class="dia-col'+(i===0?' hoje':'')+'"><div class="d">'+(i===0?t('hoje','today'):DIAS[d.getDay()])+'</div><div class="nn">'+d.getDate()+'</div>'+es+'</div>'}).join('');
    var lado='<section class="pn2"><h2>'+t('Agendamento online','Online booking')+' <span class="tag v">'+t('ativo','on')+'</span></h2><div class="on-l"><span>'+t('Página','Page')+'</span><span>'+esc(N.nome)+' · /agendamento</span></div><div class="on-l"><span>'+t('Lembretes','Reminders')+'</span><span>'+t('1 dia e 2 horas antes','1 day and 2 hours before')+'</span></div><div class="on-l"><span>'+t('Sinal','Deposit')+'</span><span>'+t('cartão ou Zelle','card or Zelle')+'</span></div></section>'+
      '<section class="pn2"><h2>'+(ag?t('Manutenções','Refills'):t('Retornos combinados','Follow-ups'))+'</h2><div class="fu"><div class="av">'+(ag?'J':'D')+'</div><div><b>'+(ag?'Juliana S.':'Diego S.')+'</b><small>'+(ag?t('manutenção em 3 semanas','refill due in 3 weeks'):t('retoque em 30 dias','touch-up in 30 days'))+'</small></div></div><div class="fu"><div class="av">'+ini(C.nome)+'</div><div><b>'+esc(C.nome)+'</b><small>'+t('retorno automático depois do atendimento','automatic follow-up after the visit')+'</small></div></div></section>';
    var lista=ag?'':'<div class="ev novo"><span class="h">–</span><div><b>'+esc(C.nome)+'</b><small>'+esc(I.servico)+' · '+t('aguardando proposta','waiting for quote')+'</small></div></div>';
    return '<section class="dash"><div class="cab"><h1>'+t('Agenda','Calendar')+'</h1><span class="tag a">⏰ '+t('lembretes automáticos ligados','automatic reminders on')+'</span></div><section class="pn2" style="grid-column:1/-1"><h2>'+t('Próximos 7 dias','Next 7 days')+'</h2><div class="semana">'+sem+'</div>'+(ag?'':'<div style="margin-top:12px">'+lista+'</div>')+'</section><div class="ag2" style="grid-column:1/-1"><div class="col2">'+lado.split('</section>')[0]+'</section></div><div class="col2">'+lado.split('</section>').slice(1).join('</section>')+'</div></div></section>';
  }
  function dash(){
    var P=dPer,m=P===7?1:P===30?3.4:9,tx=function(n){return Math.round(n*m)};
    var base=[2,4,1,3,5,2,3],ser=[];var n=P===7?7:14;for(var i=0;i<n;i++)ser.push((base[i%7]+(i>6?1:0))%5+1);ser[n-1]+=1;
    var W=640,H=210,pd={l:26,r:6,t:12,b:26},mx=Math.max.apply(null,ser)+2,bw=(W-pd.l-pd.r)/n,g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+t('Novos leads','New leads')+'">';
    for(var q=0;q<=mx;q+=Math.ceil(mx/4)){var y=H-pd.b-q/mx*(H-pd.t-pd.b);g+='<line x1="'+pd.l+'" x2="'+(W-pd.r)+'" y1="'+y+'" y2="'+y+'" stroke="var(--linha)"/><text x="'+(pd.l-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+q+'</text>'}
    ser.forEach(function(v,i){var h=v/mx*(H-pd.t-pd.b),x=pd.l+i*bw+bw*.18,w=bw*.64,yy=H-pd.b-h,h0=i===n-1;g+='<rect x="'+x+'" y="'+yy+'" width="'+w+'" height="'+h+'" rx="4" fill="'+(h0?'#FFB020':'#2F6FED')+'"/>';if(h0||i%2===0)g+='<text x="'+(x+w/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="'+(h0?'var(--texto)':'var(--muted)')+'">'+(h0?t('hoje','today'):(n-1-i)+'d')+'</text>'});g+='</svg>';
    var can=[['WhatsApp',tx(9),'#1FAF5A'],['Instagram',tx(6),'#C13584'],['Site',tx(5)+1,'#2F6FED'],[t('E-mail','Email'),tx(2),'#5B6678']].sort(function(a,b){return b[1]-a[1]});
    var cm=Math.max(can[0][1],1),cs='<svg viewBox="0 0 320 '+(can.length*44)+'">'+can.map(function(c,i){var w=c[1]/cm*260,y=i*44;return '<text x="0" y="'+(y+13)+'" font-size="12.5" fill="var(--sec)" font-weight="600">'+c[0]+'</text><rect x="0" y="'+(y+19)+'" width="'+Math.max(w,4)+'" height="14" rx="4" fill="'+c[2]+'"/><text x="'+(w+7)+'" y="'+(y+31)+'" font-size="12.5" fill="var(--texto)" font-weight="700">'+c[1]+'</text>'}).join('')+'</svg>';
    var et=ag?[t('Novo contato','New contact'),t('Qualificado','Qualified'),t('Agendado','Booked'),t('Atendido','Seen'),t('Recorrente','Repeat')]:[t('Novo orçamento','New quote'),t('Qualificado','Qualified'),t('Proposta enviada','Quote sent'),t('Fechado','Closed'),t('Retoque','Touch-up')];
    var ct=[tx(24),tx(17),tx(11),tx(8),tx(4)],cx=ct[0],fs='<svg viewBox="0 0 480 200" style="max-width:520px">'+et.map(function(e,i){var w=Math.max(ct[i]/cx*280,6),x=130+(280-w)/2,y=i*40;return '<text x="0" y="'+(y+24)+'" font-size="12.5" fill="var(--sec)" font-weight="600">'+e+'</text><rect x="'+x+'" y="'+(y+8)+'" width="'+w+'" height="24" rx="5" fill="'+['#2F6FED','#4A86F2','#FFB020','#1F9D55','#8A5BD6'][i]+'"/><text x="476" y="'+(y+25)+'" text-anchor="end" font-size="12.5" fill="var(--texto)" font-weight="700">'+ct[i]+(i?' ('+Math.round(ct[i]/cx*100)+'%)':'')+'</text>'}).join('')+'</svg>';
    var neg=VAL()*3+(ag?420:5200);
    return '<section class="dash"><div class="cab"><h1>'+t('Painel','Dashboard')+'</h1><div class="seg-p" role="radiogroup">'+[7,30,90].map(function(x){return '<button data-p="'+x+'" role="radio" aria-checked="'+(x===P)+'">'+x+' '+t('dias','days')+'</button>'}).join('')+'</div></div>'+
      '<div class="kpi"><div class="r">'+t('Esperando resposta agora','Waiting for a reply')+'</div><div class="n">0</div><div class="s">'+t('A IA respondeu todo mundo','The AI replied to everyone')+'</div></div>'+
      '<div class="kpi"><div class="r">'+t('Novos leads ('+P+' dias)','New leads ('+P+' days)')+'</div><div class="n">'+(tx(22)+1)+'</div><div class="s up">+18% '+t('sobre os '+P+' dias anteriores','vs the previous '+P+' days')+'</div></div>'+
      '<div class="kpi"><div class="r">'+t('Em negociação','In negotiation')+'</div><div class="n">'+usd(neg.toLocaleString(en?'en-US':'pt-BR'))+'</div><div class="s">'+(ag?'6':'4')+' '+t('negócios abertos','open deals')+'</div></div>'+
      '<div class="kpi"><div class="r">'+t('Uso da IA no mês','AI usage this month')+'</div><div class="n">'+tx(312)+'<small>/ 2.000</small></div><div class="tri"><i style="width:'+Math.min(100,tx(312)/20)+'%"></i></div><div class="s">'+t('respostas da IA no plano','AI replies on your plan')+'</div></div>'+
      '<section class="pn2 g8"><h2>'+t('Novos leads por dia','New leads per day')+'</h2>'+g+'</section>'+
      '<section class="pn2 g4"><h2>'+t('Leads por canal','Leads by channel')+'</h2>'+cs+'<div class="leg">'+t('Leads que chegaram sozinhos no período.','Leads that came in on their own.')+'</div></section>'+
      '<section class="pn2 g8"><h2>'+t('Funil de conversão','Conversion funnel')+'</h2>'+fs+'</section>'+
      '<section class="pn2 g4"><h2>'+t('Atendimento','Support')+'</h2><div class="atd"><div><b>1 min</b><small>'+t('tempo médio de resposta','average reply time')+'</small></div><div><b>82%</b><small>'+t('respondido pela IA','answered by AI')+'</small></div><div><b>'+tx(31)+'</b><small>'+t('agendamentos pelo site','bookings via the site')+'</small></div><div><b>96%</b><small>'+t('comparecimento','show rate')+'</small></div></div></section></section>';
  }
  function funil(){
    var cols=ag?[t('Novo contato','New contact'),t('Agendado','Booked'),t('Pós-atendimento','After visit')]:[t('Novo orçamento','New quote'),t('Proposta enviada','Quote sent'),t('Fechado','Closed')];
    var nc='<div class="card novo"><span class="vl">'+usd(VAL())+'</span><b>'+esc(C.nome)+'</b><br>'+esc(I.servico)+'<br><span class="tag '+statusSinal().tg+'">'+statusSinal().tx+'</span></div>';
    var out=[[outros[1],1],[outros[0],0],[outros[2],2]];
    return '<section class="funil">'+cols.map(function(c,i){var cards=(i===(ag?1:0)?nc:'')+outros.filter(function(o,k){return (ag?[0,1,2][k]:[1,0,2][k])===i&&!(i===(ag?1:0)&&false)}).map(function(o){return '<div class="card"><span class="vl">'+usd(ag?[80,120,90][+o.id.slice(1)-1]:[1800,350,2400][+o.id.slice(1)-1])+'</span><b>'+o.nome+'</b><br>'+o.txt+'</div>'}).join('');return '<div class="col"><h3>'+c+'</h3>'+cards+'</div>'}).join('')+'</section>';
  }
  var dPer=7;var TIT={conversas:t('Conversas','Chats'),funil:t('Funil','Funnel'),agenda:t('Agenda','Calendar'),painel:t('Painel','Dashboard')};
  function desenha(){
    var h=rail();
    if(vista==='conversas')h+=lista()+conversa()+painel();else if(vista==='agenda')h+=agenda();else if(vista==='painel')h+=dash();else h+=funil();
    var ap=document.getElementById('app');ap.innerHTML=h;
    ap.className='app '+(vista==='conversas'?(det?'m-det':aberta?'m-conv':'m-lista'):'m-'+vista);
    document.getElementById('tbt').textContent=TIT[vista];document.body.setAttribute('data-m',ap.className.split(' ')[1]);
    var st=ap.querySelector('.itens');if(st&&window._sc)st.scrollTop=window._sc;
    document.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){var v=b.getAttribute('data-v');if(v==='x'){aviso(t('Disponível no AbertoCore completo.','Available in the full AbertoCore.'));return}vista=v;aberta=false;det=false;desenha()}});
    document.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){sel=b.getAttribute('data-s');aberta=true;desenha()}});
    document.querySelectorAll('[data-b]').forEach(function(b){b.onclick=function(){var k=b.getAttribute('data-b');if(k==='lista'){aberta=false;det=false}else if(k==='det')det=true;else det=false;desenha()}});
    document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){dPer=+b.getAttribute('data-p');desenha()}});
    var cf=document.getElementById('conf');if(cf)cf.onclick=function(){P.status='confirmado';S.sinal=P;try{sessionStorage.setItem('abertocore-sim',JSON.stringify(S))}catch(e){}desenha();aviso(t('Recebimento confirmado. A IA avisou a cliente por '+CANAL[C.canal].n+'.','Receipt confirmed. The AI notified the client via '+CANAL[C.canal].n+'.'))};
  }
  function aviso(x){var e=document.getElementById('toast');e.textContent=x;e.hidden=false;setTimeout(function(){e.hidden=true},4200)}
  document.querySelectorAll('.lk-volta,#volta').forEach(function(a){a.textContent='← '+t('Voltar ao site','Back to site');a.href=N.volta||'../'});
  document.querySelectorAll('.lk-quero,#quero').forEach(function(a){a.textContent=t('Ver a proposta','See the proposal')+' →';var rr='us';try{rr=localStorage.getItem('demo-regiao')==='br'?'br':'us'}catch(e){}a.href='../proposta/?n='+(/amanda/i.test(N.nome)?'amanda':'ibraim')+'&r='+rr});
  document.title='AbertoCore · '+N.nome;
  desenha();
  aviso((ag?'📅 ':'📝 ')+t(ag?'Novo agendamento':'Novo orçamento',ag?'New booking':'New quote request')+' · '+C.nome);
})();
</script>
