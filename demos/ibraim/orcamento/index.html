<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Orçamento · Superman Tattoo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../estilo.css">
</head>
<body>
<div class="demo">Demonstração · nenhum orçamento é real</div>
<header class="nav">
  <a class="brand" href="../">SUPERMAN <b>TATTOO</b></a>
  <nav><a href="../" data-pt="Voltar ao site" data-en="Back to site">Voltar ao site</a></nav>
  <button class="lang" id="lang" type="button" aria-label="Idioma / Language">EN</button>
</header>
<main class="chat">
  <h1 data-pt="Conte a sua ideia" data-en="Tell us your idea">Conte a sua ideia</h1>
  <div class="fio" id="fio" aria-live="polite"></div>
  <div id="area"></div>
</main>
<a class="ia" href="../#contato" data-pt="💬 WhatsApp" data-en="💬 WhatsApp">💬 WhatsApp</a>
<script src="../idioma.js"></script>
<script>
/* Conversa em passos: região, tamanho, estilo, cor, referência, contato. A estimativa usa uma tabela simples de exemplo, em dólar. */
(function(){
  var fio=document.getElementById('fio'), area=document.getElementById('area'), r={}, passo=0, fotos=[];
  function L(){return window.DemoLang()}
  function t(pt,en){return L()==='en'?en:pt}
  function ia(x){var d=document.createElement('div');d.className='m';d.textContent=x;fio.appendChild(d)}
  function cli(x){var d=document.createElement('div');d.className='m c';d.textContent=x;fio.appendChild(d)}
  function opcoes(lista,fn){area.innerHTML='';var o=document.createElement('div');o.className='op';lista.forEach(function(it){var b=document.createElement('button');b.type='button';b.textContent=it[0];b.onclick=function(){cli(it[0]);fn(it)};o.appendChild(b)});area.appendChild(o);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
  var REG=[['Antebraço','Forearm',1],['Braço','Upper arm',1.3],['Fechamento de braço','Full sleeve',4],['Perna','Leg',1.6],['Costas','Back',2.4],['Peito','Chest',1.8],['Pescoço ou mão','Neck or hand',1.5]];
  var TAM=[['Pequena · até 10 cm','Small · up to 4 in',150],['Média · 10 a 20 cm','Medium · 4 to 8 in',350],['Grande · 20 a 30 cm','Large · 8 to 12 in',700],['Projeto grande · várias sessões','Big project · several sessions',1500]];
  var EST=[['Preto e cinza','Black and grey',1],['Colorida','Color',1.25],['Realismo','Realism',1.3],['Chicano','Chicano',1.1],['Anime','Anime',1.1],['Fineline','Fine line',0.9]];
  function inicio(){fio.innerHTML='';passo=0;fotos=[];r={};ia(t('Oi! Eu sou a IA do Ibraim. Vou te ajudar a montar o pedido. Em que região do corpo você quer tatuar?','Hi! I am Ibraim\'s AI. I will help you build your request. Which area of the body is it for?'));opcoes(REG.map(function(x){return [t(x[0],x[1]),x]}),regiao)}
  function regiao(it){r.reg=it[1];ia(t('Qual o tamanho aproximado?','What is the approximate size?'));opcoes(TAM.map(function(x){return [t(x[0],x[1]),x]}),tamanho)}
  function tamanho(it){r.tam=it[1];ia(t('Qual estilo combina mais com a ideia?','Which style fits your idea best?'));opcoes(EST.map(function(x){return [t(x[0],x[1]),x]}),estilo)}
  function estilo(it){r.est=it[1];ia(t('Conta a ideia com as suas palavras e, se tiver, anexe referências.','Describe your idea in your own words and attach references if you have them.'));
    area.innerHTML='<textarea id="ideia" rows="3" aria-label="Ideia"></textarea><label class="nota" for="ref">'+t('Fotos de referência','Reference photos')+'</label><input id="ref" type="file" accept="image/*" multiple><div class="prev" id="prev"></div><button class="btn" id="seg" type="button">'+t('Continuar','Continue')+'</button>';
    document.getElementById('ref').onchange=function(e){var p=document.getElementById('prev');p.innerHTML='';fotos=[];Array.prototype.slice.call(e.target.files,0,4).forEach(function(f){var u=URL.createObjectURL(f);fotos.push(f.name);var i=document.createElement('img');i.src=u;i.alt=f.name;p.appendChild(i)})};
    document.getElementById('seg').onclick=function(){r.ideia=document.getElementById('ideia').value.trim();cli(r.ideia||t('(sem descrição)','(no description)'));resultado()}}
  function resultado(){var base=r.tam[2]*r.reg[2]*r.est[2],min=Math.round(base*0.8/50)*50,max=Math.round(base*1.2/50)*50;r.faixa=[min,max];
    ia(t('Pelo que você contou, a estimativa é esta:','Based on what you shared, the estimate is:'));
    area.innerHTML='<p class="faixa">$'+min+' – $'+max+'</p><p class="nota">'+t('Estimativa de exemplo. O valor final o Ibraim confirma depois de ver o desenho e as referências.','Sample estimate. Ibraim confirms the final price after seeing the design and references.')+'</p><label class="nota" for="n">'+t('Seu nome','Your name')+'</label><input id="n" type="text" autocomplete="name"><label class="nota" for="w">WhatsApp</label><input id="w" type="tel" autocomplete="tel" placeholder="(843) 000-0000"><button class="btn" id="env" type="button">'+t('Enviar pedido','Send request')+'</button>';
    document.getElementById('env').onclick=function(){var n=document.getElementById('n').value.trim();if(!n)return;cli(n);fim(n)};window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
  function fim(n){area.innerHTML='';ia(t('Pedido enviado, '+n+'! O Ibraim vai olhar a sua ideia e a IA te chama no WhatsApp com os horários disponíveis.','Request sent, '+n+'! Ibraim will review your idea and the AI will message you on WhatsApp with available times.'));
    ia(t('Na versão real, este pedido vira um lead no funil do AbertoCore, com região, tamanho, estilo, referências e a faixa de valor.','In the real version this request becomes a lead in the AbertoCore funnel, with area, size, style, references and the price range.'))}
  document.addEventListener('idioma',function(){if(!passo){passo=1}});
  inicio();
})();
</script>
</body>
</html>
