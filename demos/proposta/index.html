<!doctype html>
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AbertoCore · Proposta</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='24' fill='%231E3050'/%3E%3Cpath d='M24 74V46a24 24 0 0 1 48 0V74Z' fill='%23FFB020'/%3E%3Cpath d='M33 74V46.5a15 15 0 0 1 30 0V74Z' fill='%232F6FED'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--papel:#0D131D;--card:#161E2B;--sup:#1C2636;--linha:#243044;--texto:#E7EBF2;--sec:#A2ACBE;--ceu:#2F6FED;--ambar:#FFB020;--ok:#3DBE7A;--display:"Archivo",system-ui,sans-serif;--corpo:Inter,system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--papel);color:var(--texto);font:16px/1.5 var(--corpo);-webkit-font-smoothing:antialiased}
a{color:inherit}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ceu);outline-offset:3px}
.w{max-width:1080px;margin:0 auto;padding:0 max(20px,5vw)}
.topo{display:flex;justify-content:space-between;align-items:center;padding:18px 0;font:700 14px var(--display)}
.topo a{font:500 13px var(--corpo);color:var(--sec);text-decoration:none}
.eyebrow{font:600 12px var(--corpo);letter-spacing:.14em;text-transform:uppercase;color:var(--ambar);margin:48px 0 14px}
h1{font:800 clamp(32px,5.4vw,60px)/1.05 var(--display);font-stretch:92%;letter-spacing:-.02em;max-width:18ch}
.lead{color:var(--sec);font-size:clamp(17px,2vw,20px);max-width:56ch;margin-top:18px}
.vis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:32px}
.vis div{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:16px;font-size:14px;color:var(--sec)}
.vis b{display:block;color:var(--texto);font:700 16px var(--display);margin-bottom:4px}
.reg{display:inline-flex;gap:6px;margin:36px 14px -6px 0;vertical-align:top}.reg button{padding:8px 14px;border-radius:99px;border:1px solid var(--linha);font-weight:700;font-size:.85rem;color:var(--sec)}.reg button[aria-pressed=true]{background:var(--ambar);border-color:var(--ambar);color:#241700}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:4px;margin:36px 0 20px}
.seg button{padding:9px 16px;border-radius:9px;font-weight:600;font-size:14px;color:var(--sec)}
.seg button[aria-pressed=true]{background:var(--ceu);color:#fff}
.seg small{font-weight:500;opacity:.85}
.pl{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:stretch}
.p{background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:24px;display:flex;flex-direction:column;position:relative}
.p.rec{border-color:var(--ceu);background:linear-gradient(180deg,rgba(47,111,237,.16),var(--card))}
.tag{position:absolute;top:-11px;left:22px;background:var(--ambar);color:#241700;font:700 11px var(--corpo);letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px}
.p h3{font:800 22px var(--display)}
.p .ds{font-size:14px;color:var(--sec);margin:6px 0 16px;min-height:42px}
.pre{font:800 38px var(--display);line-height:1}
.pre small{font:500 14px var(--corpo);color:var(--sec)}
.ant{font-size:13px;color:var(--sec);text-decoration:line-through;height:20px}
.imp{font-size:14px;margin:8px 0 18px;padding-bottom:16px;border-bottom:1px solid var(--linha);color:var(--sec)}
.imp b{color:var(--texto)}
.p ul{list-style:none;padding:0;font-size:14.5px;flex:1}
.p li{padding:6px 0 6px 24px;position:relative}
.p li:before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:700}
.cta{display:block;text-align:center;background:var(--ceu);color:#fff;font-weight:700;padding:13px;border-radius:12px;text-decoration:none;margin-top:20px}
.p:not(.rec) .cta{background:none;border:1px solid var(--linha)}
.nota{font-size:13px;color:var(--sec);margin:22px 0 64px;max-width:70ch}
.nota b{color:var(--texto)}
@media(max-width:860px){.vis,.pl{grid-template-columns:1fr}.p .ds{min-height:0}}
</style>
<style>.reg,.rg{display:none}</style>
</head>
<body>
<div class="w">
<div class="topo"><div>AbertoCore</div><a id="rever" href="../apresentacao/"></a></div>
<p class="eyebrow" id="eb"></p>
<h1 id="tit"></h1>
<p class="lead" id="lead"></p>
<div class="vis">
 <div><b id="v1t"></b><span id="v1"></span></div>
 <div><b id="v2t"></b><span id="v2"></span></div>
 <div><b id="v3t"></b><span id="v3"></span></div>
</div>
<div class="reg" role="group" aria-label="Região" id="reg"><button type="button" data-r="us">EUA · US$</button><button type="button" data-r="br">Brasil · R$</button></div>
<div class="seg" role="group" aria-label="Plano de contratação" id="seg">
 <button data-m="0" aria-pressed="false" id="s0"></button>
 <button data-m="0.15" aria-pressed="false" id="s6"></button>
 <button data-m="0.30" aria-pressed="true" id="s12"></button>
</div>
<div class="pl" id="pl"></div>
<p class="nota" id="nota"></p>
</div>
<script src="../precos.js?v=2"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search),n=q.get('n')==='ibraim'?'ibraim':'amanda';
  var nome=n==='ibraim'?'Ibraim':'Amanda';
  var EN=n==='amanda'&&q.get('l')==='en',A=n==='amanda',$=function(i){return document.getElementById(i)};
  if(EN)document.documentElement.lang='en';
  var T=EN?{rever:'Back to the presentation',eb:'Proposal for '+nome,tit:'What you just saw, running in your nail studio.',lead:'Pick the plan that fits how many clients you handle. You can start small and move up later without redoing anything.',
    v:[['The site','Your client finds you, checks your work and books right there.'],['The conversation','Replies instantly, confirms the time and collects the deposit.'],['The panel','Calendar, chats, clients and funnel in one place.']],
    s0:'Monthly',s6:'6 months <small>−15%</small>',s12:'12 months <small>−30%</small>',rec:'Recommended',mo:'/mo',ant:'/mo',imp:' setup · ready in ',cta:'Get ',
    pl:[['Start','The essentials, done well, so you can be found.',['Optimized, verified Google profile','One-page site with a WhatsApp button','Domain for the first year and hosting','1 change per month'],'7 business days'],
        ['Presença','To serve better and get organized.',['Everything in Start','Logo and visual identity','WhatsApp Business with catalog and quick replies','AbertoCore with WhatsApp and up to 2 users','Menu chatbot and internal AI assistant','Funnel, calendar and return reminders'],'15 business days'],
        ['Completo','The full experience you just went through.',['Everything in Presence','24/7 AI assistant: answers, qualifies and books','Instagram, Facebook and email in one inbox','Online booking on your site','Unlimited users and email on your domain','Results dashboard and custom tweaks'],'30 business days']],
    nm:{Start:'Start',Presença:'Presence',Completo:'Complete'}}
  :{rever:'Rever a apresentação',eb:'Proposta para '+nome,tit:'Do jeito que você acabou de ver, funcionando no seu '+(A?'studio.':'estúdio.'),lead:'Escolha o plano pelo tamanho do seu atendimento. Dá para começar menor e subir depois, sem refazer nada.',
    v:[['O site',(A?'Sua cliente te encontra, confere o trabalho e já agenda.':'Seu cliente te encontra, confere o trabalho e já pede o orçamento.')],['O atendimento','Responde na hora, confirma o horário e cobra o sinal.'],['O painel','Agenda, conversas, clientes e funil num lugar só.']],
    s0:'Mensal',s6:'6 meses <small>−15%</small>',s12:'12 meses <small>−30%</small>',rec:'Recomendado',mo:'/mês',ant:'/mês',imp:' de implantação · pronto em ',cta:'Quero o ',
    pl:[['Start','O básico bem feito para ser encontrado.',['Perfil no Google otimizado e verificado','Site de 1 página com botão de WhatsApp','Domínio .com.br no 1º ano e hospedagem','1 alteração por mês'],'7 dias úteis'],
        ['Presença','Para atender melhor e se organizar.',['Tudo do Start','Logo e identidade visual','WhatsApp Business com catálogo e respostas rápidas','AbertoCore com WhatsApp e até 2 usuários','Chatbot de menu e assistente de IA interno','Funil, agenda e lembrete de retorno'],'15 dias úteis'],
        ['Completo','A experiência inteira que você acabou de ver.',['Tudo do Presença','Atendimento com IA 24h: responde, qualifica e agenda','Instagram, Facebook e e-mail na mesma caixa',(A?'Agendamento':'Orçamento')+' online no seu site','Usuários ilimitados e e-mail com seu domínio','Painel de resultados e ajustes sob medida'],'30 dias úteis']],
    nm:{Start:'Start',Presença:'Presença',Completo:'Completo'}};
  $('rever').textContent=T.rever;$('eb').textContent=T.eb;$('tit').textContent=T.tit;$('lead').textContent=T.lead;
  T.v.forEach(function(v,i){$('v'+(i+1)+'t').textContent=v[0];$('v'+(i+1)).textContent=v[1]});
  $('s0').textContent=T.s0;$('s6').innerHTML=T.s6;$('s12').innerHTML=T.s12;
  var P=T.pl.map(function(x,i){return {n:x[0],d:x[1],l:x[2],prazo:x[3],rec:i===2}});
  var desc=0.30;
  var rg=window.Regiao.ler();function brl(v){return window.Regiao.fmt(v,rg)}
  function desenha(){
    document.getElementById('pl').innerHTML=P.map(function(p){
      var pr=window.Regiao.PRECOS[rg].pacotes[p.n],m=Math.round(pr.m*(1-desc)*100)/100;
      var nmP=T.nm[p.n],msg=EN?'Hi! I saw the AbertoCore demo for '+nome+' and I want the '+nmP+' plan ('+(desc?(desc===.3?'12':'6')+' months':'monthly')+').':'Oi! Vi a demonstração da AbertoCore para '+nome+' e quero o plano '+p.n+' ('+window.Regiao.PRECOS[rg].rot+')'+(desc?' ('+(desc===.3?'12':'6')+' meses)':' (mensal)')+'.';
      return '<div class="p'+(p.rec?' rec':'')+'">'+(p.rec?'<span class="tag">'+T.rec+'</span>':'')+'<h3>'+nmP+'</h3><p class="ds">'+p.d+'</p><div class="ant">'+(desc?brl(pr.m)+T.ant:'')+'</div><div class="pre">'+brl(m)+'<small> '+T.mo+'</small></div><p class="imp"><b>'+brl(pr.i)+'</b>'+T.imp+p.prazo+'</p><ul>'+p.l.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul><a class="cta" href="https://wa.me/5511991233627?text='+encodeURIComponent(msg)+'">'+T.cta+nmP+'</a></div>';
    }).join('');
    document.getElementById('nota').innerHTML=EN?'<b>How the discount works:</b> on the 6 and 12 month plans the discount applies to the whole monthly fee. If you cancel early, you pay back the discount received. The monthly plan has no commitment. '+(rg==='br'?'Prices in reais; setup is paid once, by Pix or bank slip.':'Prices in US dollars; setup is paid once (50% at signing and 50% at delivery) by Stripe, PayPal or Zelle.')+(window.Regiao.PRECOS[rg].iaExtra?' If your AI usage goes past the plan allowance, extra packs start at '+brl(window.Regiao.PRECOS[rg].iaExtra)+'.':''):'<b>Como funciona o desconto:</b> nos planos de 6 e 12 meses o desconto vale em toda a mensalidade. Se cancelar antes do prazo, paga a diferença do desconto já recebido. No plano mensal não há fidelidade. '+(rg==='br'?'Valores em reais; a implantação é paga uma vez, por Pix ou boleto.':'Valores em dólar; a implantação é paga uma vez (50% na assinatura e 50% na entrega), por Stripe, PayPal ou Zelle.')+(window.Regiao.PRECOS[rg].iaExtra?' Quando o uso de IA passar da franquia do plano, há pacotes extras a partir de '+brl(window.Regiao.PRECOS[rg].iaExtra)+'.':'');
  }
  document.getElementById('seg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;desc=+b.dataset.m;[].forEach.call(this.children,function(x){x.setAttribute('aria-pressed',x===b)});desenha()});
  function marca(){[].forEach.call(document.querySelectorAll('#reg button'),function(b){b.setAttribute('aria-pressed',b.dataset.r===rg)})}
  document.getElementById('reg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;rg=b.dataset.r;window.Regiao.grava(rg);try{var u=new URL(location.href);u.searchParams.set('r',rg);history.replaceState(null,'',u)}catch(x){}marca();desenha()});
  $('rever').href='../apresentacao/?n='+n+'&r='+rg+(EN?'&l=en':'');marca();
  desenha();
})();
</script>
</body>
</html>
