<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AbertoCore | abertodigital</title>
<meta name="description" content="AbertoCore, o sistema integrado da abertodigital: mensagens, funil, agenda, assistente de IA e relatórios num só lugar.">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AbertoCore">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='24' fill='%231E3050'/%3E%3Cpath d='M24 74V46a24 24 0 0 1 48 0V74Z' fill='%23FFB020'/%3E%3Cpath d='M33 74V46.5a15 15 0 0 1 30 0V74Z' fill='%232F6FED'/%3E%3Cpath d='M33 74V39.5L51 32.5V68.5Z' fill='%231E3050'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101A2C; --navy:#1E3050; --slate:#384358;
    --ambar:#FFB020; --ceu:#2F6FED; --pessego:#FFA586;
    --papel:#F6F7F9; --branco:#fff; --texto:#101A2C; --sec:#5B6678;
    --muted:#8A93A6; --linha:#E2E6ED; --linha2:#D5DAE3;
    --verde:#1F9D55; --vermelho:#D64545;
    --wa:#1FAF5A; --ig:#C13584; --fb:#1877F2; --em:#5B6678;
    --display:"Archivo",system-ui,sans-serif;
    --corpo:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --raio:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--corpo);color:var(--texto);background:var(--papel);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  :focus-visible{outline:3px solid var(--ambar);outline-offset:2px;border-radius:6px}
  .app{display:grid;grid-template-columns:72px 1fr;height:100dvh}

  /* trilho lateral */
  .trilho{background:linear-gradient(180deg,var(--navy),var(--ink));display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
  .trilho .marca{width:42px;height:42px;margin-bottom:14px}
  .trilho button{position:relative;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#AEB6C6;transition:background .15s,color .15s}
  .trilho button:hover{background:rgba(255,255,255,.08);color:#fff}
  .trilho button[aria-current="page"]{background:var(--ceu);color:#fff}
  .trilho svg{width:22px;height:22px}
  .trilho .bolha{position:absolute;top:5px;right:5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ambar);color:var(--ink);font-size:10.5px;font-weight:800;display:grid;place-items:center}
  .trilho .fim{margin-top:auto}
  .dica{position:absolute;left:58px;white-space:nowrap;background:var(--ink);color:#fff;font-size:13px;padding:5px 10px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:50}
  .trilho button:hover .dica,.trilho button:focus-visible .dica{opacity:1}

  .principal{display:flex;flex-direction:column;min-width:0;min-height:0}
  .topo{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--linha);background:var(--branco)}
  .marca-topo{display:flex;align-items:center;gap:9px;flex:none}
  .marca-topo svg{width:34px;height:34px;display:none}
  .nome-sis{font-family:var(--display);font-weight:800;font-stretch:85%;font-size:1.2rem;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
  .nome-sis b{color:var(--ceu);font-weight:800}
  .sep{width:1px;height:32px;background:var(--linha2);flex:none}
  .trilho .rot{display:none}
  .voltar-cfg,.cfg-btn{display:none}
  .cfg-lista{padding:14px;display:flex;flex-direction:column;gap:10px}
  .cfg-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--branco);border:1px solid var(--linha);border-radius:var(--raio);padding:14px 16px}
  .cfg-item .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#EEF3FF;color:var(--ceu);flex:none}
  .cfg-item .ic svg{width:22px;height:22px}
  .cfg-item .t{font-weight:700;font-size:15.5px}
  .cfg-item .d{font-size:13px;color:var(--sec)}
  .cfg-item .seta{margin-left:auto;color:var(--muted);font-size:22px;line-height:1}
  .topo h1{font-family:var(--display);font-weight:800;font-stretch:80%;font-size:1.45rem;letter-spacing:-.01em}
  .topo .sub{color:var(--sec);font-size:13.5px}
  .topo .dir{margin-left:auto;display:flex;align-items:center;gap:10px}
  .aovivo{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--sec);padding:6px 11px;border-radius:999px;border:1px solid var(--linha2);background:var(--branco)}
  .aovivo i{width:8px;height:8px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 0 rgba(31,157,85,.5);animation:pulso 2s infinite}
  .aovivo[aria-pressed="false"] i{background:var(--muted);animation:none}
  @keyframes pulso{70%{box-shadow:0 0 0 7px rgba(31,157,85,0)}100%{box-shadow:0 0 0 0 rgba(31,157,85,0)}}
  .demo{font-size:12.5px;color:var(--slate);background:#FFF4DA;border:1px solid #F5D98F;padding:5px 10px;border-radius:8px}
  .vista{flex:1;min-height:0;overflow:auto}

  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;font-weight:600;font-size:14px;background:var(--branco);border:1px solid var(--linha2);transition:background .15s}
  .btn:hover{background:#EEF1F6}
  .btn.pri{background:var(--ceu);border-color:var(--ceu);color:#fff}
  .btn.pri:hover{background:#245CD0}
  .btn.ia{background:#FFF4DA;border-color:#F5D98F;color:var(--ink)}
  .btn.ia:hover{background:#FFEAB8}
  .btn svg{width:17px;height:17px}
  .btn.peq{padding:6px 11px;font-size:13px}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
  .chip.lead{background:#E6EEFF;color:#1D4FC4}
  .chip.cliente{background:#E2F5EA;color:#167443}
  .chip.etapa{background:#EEF1F6;color:var(--slate)}
  .chip.atraso{background:#FCE6E6;color:#A82F2F}
  .chip.hoje{background:#FFF4DA;color:#8A5B00}
  .canal{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--sec)}
  .canal b{width:9px;height:9px;border-radius:50%}

  .av{position:relative;flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff}
  .av .sel{position:absolute;right:-3px;bottom:-3px;width:19px;height:19px;border-radius:50%;border:2px solid var(--branco);display:grid;place-items:center;font-size:9px;font-weight:800;color:#fff}

  /* ===== Mensagens ===== */
  .inbox{display:grid;grid-template-columns:360px 1fr 300px;height:100%}
  .lista{min-width:0;border-right:1px solid var(--linha);background:var(--branco);display:flex;flex-direction:column;min-height:0}
  .lista .busca{display:flex;align-items:center;gap:8px;margin:14px 14px 8px;padding:9px 12px;border-radius:10px;background:var(--papel);border:1px solid var(--linha)}
  .lista .busca svg{width:17px;height:17px;color:var(--muted)}
  .lista .busca input{border:0;background:none;outline:0;width:100%}
  .abas-linha{position:relative;display:flex;gap:8px;margin:0 14px;padding-bottom:12px;border-bottom:1px solid var(--linha)}
  .abas{flex:1;display:flex;background:var(--papel);border-radius:10px;padding:4px;gap:2px;min-width:0}
  .btn-filtro{position:relative;flex:none;width:44px;border-radius:10px;border:1px solid var(--linha2);background:var(--branco);display:grid;place-items:center;color:var(--slate)}
  .btn-filtro svg{width:19px;height:19px}
  .btn-filtro[aria-expanded="true"],.btn-filtro.ativo{border-color:var(--ceu);color:var(--ceu);background:#EEF3FF}
  .btn-filtro .n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--ceu);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
  .pop-filtro{position:absolute;right:0;top:calc(100% - 4px);z-index:30;width:230px;background:var(--branco);border:1px solid var(--linha2);border-radius:14px;box-shadow:0 12px 32px rgba(16,26,44,.18);padding:8px}
  .pop-filtro .tt{font-size:12px;font-weight:700;color:var(--sec);padding:6px 10px 4px}
  .pop-filtro label{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-weight:600;font-size:14.5px;cursor:pointer}
  .pop-filtro label:hover{background:var(--papel)}
  .pop-filtro input{width:18px;height:18px;accent-color:var(--ceu)}
  .pop-filtro .canal{font-size:14.5px;color:var(--ink)}
  .pop-filtro .canal b{width:10px;height:10px}
  .abas button{flex:1;padding:7px 4px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--sec)}
  .abas button[aria-selected="true"]{background:var(--branco);color:var(--ink);box-shadow:0 1px 2px rgba(16,26,44,.12)}
  .abas small{font-size:11px;background:var(--ceu);color:#fff;border-radius:8px;padding:1px 6px;margin-left:4px}
  .itens{overflow:auto;flex:1}
  .item{display:flex;gap:12px;width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid var(--linha);border-left:3px solid transparent}
  .item:hover{background:#F8F9FB}
  .item[aria-current="true"]{background:#EEF3FF;border-left-color:var(--ceu)}
  .item .mid{flex:1;min-width:0}
  .item .l1{display:flex;justify-content:space-between;gap:8px}
  .item .nome{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item[aria-current="true"] .nome{color:var(--ceu)}
  .item .hora{font-size:12px;color:var(--muted);white-space:nowrap}
  .item .hora.nova{color:var(--ceu);font-weight:700}
  .item .ult{font-size:13.5px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 6px}
  .item .ult.nova{color:var(--ink);font-weight:600}
  .item .l3{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .item .cont{margin-left:auto;background:var(--ceu);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
  .vazio{padding:40px 20px;text-align:center;color:var(--sec)}

  .conversa{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--papel)}
  .conv-topo{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--branco);border-bottom:1px solid var(--linha)}
  .conv-topo .nm{font-weight:700;font-size:16px}
  .conv-topo .ng{font-size:13px;color:var(--sec)}
  .conv-topo .acoes{margin-left:auto;display:flex;gap:8px}
  .voltar,.det-btn{display:none}
  .fio{flex:1;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:10px}
  .dia{align-self:center;font-size:12px;color:var(--sec);background:var(--branco);border:1px solid var(--linha);padding:3px 10px;border-radius:999px;margin:6px 0}
  .msg{max-width:min(560px,78%);padding:10px 13px 6px;border-radius:14px;background:var(--branco);box-shadow:0 1px 1px rgba(16,26,44,.06);white-space:pre-wrap;word-wrap:break-word}
  .msg .h{display:block;text-align:right;font-size:11px;color:var(--muted);margin-top:3px}
  .msg.cli{align-self:flex-start;border-top-left-radius:4px}
  .msg.eq{align-self:flex-end;background:var(--navy);color:#fff;border-top-right-radius:4px}
  .msg.eq .h{color:#AEB6C6}
  .msg.ia{align-self:flex-end;background:#FFF8E6;border:1px solid #F5D98F;border-top-right-radius:4px}
  .msg .quem{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:#8A5B00;margin-bottom:3px}
  .msg .quem svg{width:13px;height:13px}
  .msg .assunto{display:block;font-weight:700;margin-bottom:4px}
  .digitando{align-self:flex-end;font-size:12.5px;color:#8A5B00;background:#FFF8E6;border:1px dashed #F5D98F;padding:6px 11px;border-radius:12px}
  .compor{background:var(--branco);border-top:1px solid var(--linha);padding:12px 16px}
  .compor .linha{display:flex;gap:10px;align-items:flex-end}
  .compor textarea{flex:1;resize:none;border:1px solid var(--linha2);border-radius:12px;padding:10px 12px;min-height:44px;max-height:140px;outline:0;background:var(--papel)}
  .compor textarea:focus{border-color:var(--ceu);background:var(--branco)}
  .compor .envia{width:44px;height:44px;border-radius:12px;background:var(--ceu);color:#fff;display:grid;place-items:center;flex:none}
  .compor .envia svg{width:20px;height:20px}
  .compor .ferr{display:flex;gap:8px;margin-bottom:9px;align-items:center;flex-wrap:wrap}
  .compor .ferr .info{font-size:12.5px;color:var(--sec)}

  .detalhe{border-left:1px solid var(--linha);background:var(--branco);overflow:auto;padding:20px}
  .detalhe .cab{text-align:center;padding-bottom:16px;border-bottom:1px solid var(--linha);margin-bottom:16px}
  .detalhe .cab .av{width:64px;height:64px;font-size:21px;margin:0 auto 10px}
  .detalhe .cab .nm{font-weight:700;font-size:17px}
  .detalhe .cab .ng{color:var(--sec);font-size:13.5px}
  .campo{margin-bottom:14px}
  .campo>label,.campo>.rot{display:block;font-size:12.5px;font-weight:700;color:var(--sec);margin-bottom:5px}
  .campo input,.campo select,.campo textarea{width:100%;padding:8px 10px;border:1px solid var(--linha2);border-radius:9px;background:var(--branco);outline:0}
  .campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--ceu)}
  .seg{display:flex;background:var(--papel);border-radius:9px;padding:3px}
  .seg button{flex:1;padding:6px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--sec)}
  .seg button[aria-pressed="true"].lead{background:#E6EEFF;color:#1D4FC4}
  .seg button[aria-pressed="true"].cliente{background:#E2F5EA;color:#167443}
  .docs{display:flex;flex-direction:column;gap:6px;margin:6px 0 14px}
  .doc-l{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--linha);border-radius:10px}
  .doc-l b{display:block;font-size:13.5px}
  .doc-l small{font-size:12px;color:var(--sec)}
  .doc-l small.ok{color:var(--verde)}
  .doc-l .btn{text-decoration:none;color:var(--ink)}
  .dado{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 0}
  .dado span:first-child{color:var(--sec)}

  /* ===== Funil ===== */
  .funil{display:flex;gap:14px;padding:18px 22px;height:100%;overflow-x:auto;align-items:flex-start}
  .coluna{flex:0 0 268px;background:#EDF0F5;border-radius:var(--raio);display:flex;flex-direction:column;max-height:100%}
  .coluna .ch{padding:13px 14px 8px}
  .coluna .ch .t{display:flex;justify-content:space-between;align-items:center;font-weight:700}
  .coluna .ch .t small{font-size:12px;font-weight:700;color:var(--sec);background:var(--branco);border-radius:8px;padding:1px 7px}
  .coluna .ch .v{font-size:12.5px;color:var(--sec)}
  .coluna .barra{height:3px;border-radius:2px;margin-top:8px}
  .cards{padding:6px 10px 12px;display:flex;flex-direction:column;gap:9px;overflow:auto;min-height:80px}
  .coluna.alvo{outline:2px dashed var(--ceu);outline-offset:-4px}
  .card{background:var(--branco);border-radius:11px;padding:11px 12px;box-shadow:0 1px 2px rgba(16,26,44,.08);cursor:grab;text-align:left;width:100%;border:1px solid transparent}
  .card:hover{border-color:var(--linha2)}
  .card.arrastando{opacity:.45}
  .card .nm{font-weight:700;font-size:14px}
  .card .ng{font-size:12.5px;color:var(--sec);margin-bottom:8px}
  .card .rod{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .card .val{margin-left:auto;font-weight:700;font-size:13px}

  /* ===== Agenda ===== */
  .agenda{display:grid;grid-template-columns:1fr 360px;gap:18px;padding:18px 22px}
  .painel{background:var(--branco);border:1px solid var(--linha);border-radius:var(--raio);padding:16px 18px}
  .painel h2{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:1.15rem;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .semana{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .dia-col{border:1px solid var(--linha);border-radius:11px;padding:9px;min-height:250px;background:var(--papel)}
  .dia-col.hoje{border-color:var(--ceu);background:#F3F7FF}
  .dia-col .d{font-size:12px;color:var(--sec);font-weight:600;text-transform:capitalize}
  .dia-col .n{font-family:var(--display);font-weight:800;font-size:1.35rem;margin-bottom:6px}
  .ev{display:block;width:100%;text-align:left;background:var(--branco);border-left:3px solid var(--ceu);border-radius:7px;padding:6px 7px;margin-bottom:6px;font-size:12.5px;box-shadow:0 1px 1px rgba(16,26,44,.06)}
  .ev b{display:block;font-size:12px}
  .ev.visita{border-left-color:var(--ambar)}
  .ev.ligacao{border-left-color:var(--verde)}
  .fu{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--linha)}
  .fu:last-child{border-bottom:0}
  .fu .mid{flex:1;min-width:0}
  .fu .nm{font-weight:700;font-size:14px}
  .fu .ac{font-size:13px;color:var(--sec)}
  .fu .bts{display:flex;gap:6px;margin-top:7px}
  .grupo-t{font-size:12px;font-weight:800;color:var(--sec);margin:12px 0 2px}

  /* ===== Dashboard ===== */
  .dash{padding:18px 22px;display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
  .kpi{grid-column:span 3;background:var(--branco);border:1px solid var(--linha);border-radius:var(--raio);padding:15px 17px}
  .kpi .r{font-size:13px;color:var(--sec);font-weight:600}
  .kpi .n{font-family:var(--display);font-weight:800;font-stretch:85%;font-size:2.1rem;line-height:1.1;margin:4px 0 2px}
  .kpi .s{font-size:12.5px;color:var(--sec)}
  .kpi .s.up{color:var(--verde);font-weight:600}
  .kpi.flash .n{animation:flash 1.2s}
  @keyframes flash{0%{color:var(--ceu)}100%{color:var(--ink)}}
  .g6{grid-column:span 6}.g4{grid-column:span 4}.g8{grid-column:span 8}.g12{grid-column:span 12}
  .graf svg{width:100%;height:auto;display:block}
  .graf .leg{font-size:12.5px;color:var(--sec);margin-top:6px}
  .ultimas li{list-style:none;display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--linha);font-size:13.5px}
  .ultimas li:last-child{border-bottom:0}
  .ultimas .q{color:var(--sec);margin-left:auto;font-size:12px;white-space:nowrap}

  /* ===== Produtos ===== */
  .prod{padding:18px 22px}
  table{width:100%;border-collapse:collapse;background:var(--branco);border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--linha);font-size:14px;vertical-align:top}
  th{font-size:12.5px;color:var(--sec);font-weight:700;background:#FAFBFC}
  tr:last-child td{border-bottom:0}
  td .ds{font-size:12.5px;color:var(--sec);margin-top:2px}
  td.num{white-space:nowrap;font-variant-numeric:tabular-nums}
  .tb-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
  .tb-cab h2{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:1.15rem}

  /* ===== Assistente ===== */

  .canal-card .st.br{color:var(--muted)}
  .canal-card .ds{font-size:13px;color:var(--sec);flex:1}

  /* modal e aviso */
  dialog{margin:auto;border:0;border-radius:16px;padding:0;width:min(460px,calc(100vw - 28px));box-shadow:0 20px 60px rgba(16,26,44,.3)}

  dialog h3{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:1.25rem;margin-bottom:14px}
  dialog .bts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
  .duas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  input[type=date],input[type=time]{min-width:0;min-height:40px;-webkit-appearance:none;appearance:none;text-align:left}
  .det-barra{display:none}
  .aviso{position:fixed;right:18px;top:86px;z-index:80;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .aviso div{background:var(--ink);color:#fff;padding:11px 15px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(16,26,44,.3);animation:sobe .25s ease-out;max-width:340px}
  .aviso div b{color:var(--ambar)}
  @keyframes sobe{from{transform:translateY(-10px);opacity:0}}

  @media (max-width:1180px){
    .inbox{grid-template-columns:320px 1fr}
    .detalhe{display:none;position:fixed;inset:0 0 0 auto;width:min(380px,100vw);z-index:60;box-shadow:0 0 0 100vmax rgba(16,26,44,.45);padding-top:0}
    .det-barra{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;margin:0 -20px 16px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--branco);border-bottom:1px solid var(--linha);z-index:2}
    .inbox.mostra-det .detalhe{display:block}
    .det-btn{display:inline-flex}
    .agenda,.assist{grid-template-columns:1fr}
    .kpi{grid-column:span 6}.g6,.g4,.g8{grid-column:span 12}
  }
  @media (max-width:760px){
    body{font-size:14.5px}
    .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
    .trilho{order:2;flex-direction:row;justify-content:space-between;padding:calc(6px + env(safe-area-inset-bottom) / 2) 8px calc(6px + env(safe-area-inset-bottom) / 2);gap:4px;align-items:center;background:var(--ink);border-top:1px solid rgba(255,255,255,.06)}
    .teclado .trilho{display:none}
    .trilho .marca,.dica{display:none}
    .trilho .fim{margin-top:0}
    .trilho button{flex:1;min-width:0;width:auto;height:46px;display:flex;flex-direction:column;justify-content:center;gap:1px;border-radius:10px}
    .trilho button[aria-current="page"]{background:rgba(47,111,237,.22);color:#fff}
    .trilho button[aria-current="page"] svg{color:#7FA6FF}
    .trilho svg{width:23px;height:23px}
    .trilho .rot{display:none}
    .trilho .bolha{top:3px;right:calc(50% - 22px);min-width:16px;height:16px;font-size:10px}
    html{background:var(--branco)}
    input,select,textarea{font-size:16px!important}
    .principal{padding-top:calc(60px + env(safe-area-inset-top))}
    .topo{position:fixed;top:0;left:0;right:0;z-index:45;height:calc(60px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0 14px;gap:10px;background:var(--branco);border-bottom:1px solid var(--linha)}
    .marca-topo svg{display:block;width:34px;height:34px;border-radius:9px}
    .nome-sis{font-size:1.25rem}
    .aviso{top:calc(8px + env(safe-area-inset-top));left:10px;right:10px;align-items:stretch;z-index:90}
    .aviso div{max-width:100%;min-height:44px;padding:12px 15px;text-align:center;border-radius:14px;box-shadow:0 6px 20px rgba(16,26,44,.25)}
    .sep,.tit,.demo{display:none}
    .topo .dir{gap:8px}
    .aovivo{padding:6px 10px}
    .cfg-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--ink);background:var(--papel);border:1px solid var(--linha2)}

    .em-cfg .marca-topo{display:none}

    .em-cfg .aovivo{display:none}
    .aovivo{white-space:nowrap}
    dialog{margin:auto 0 0;width:100vw;max-width:100vw;max-height:92dvh;border-radius:20px 20px 0 0}
    dialog form{padding:22px 18px calc(18px + env(safe-area-inset-bottom))}
    dialog .bts .btn{flex:1;justify-content:center}
    .detalhe{width:100vw;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
    .tb-cab .btn{white-space:nowrap;padding:9px 13px}
    .tb-cab h2{font-size:1.05rem}
    .tb-prod thead{display:none}
    .tb-prod,.tb-prod tbody{display:block;border:0;background:none}
    .tb-prod tr{display:grid;grid-template-columns:1fr 1fr auto;gap:4px 12px;background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:12px 14px;margin-bottom:10px}
    .tb-prod td{border:0;padding:0}
    .tb-prod td:first-child{grid-column:1 / -1;margin-bottom:6px}
    .tb-prod td:nth-child(2){display:none}

    .tb-prod td:last-child{align-self:center}
    .destaque td:first-child{box-shadow:none}
    .tb-prod tr.destaque{border-left:4px solid var(--ambar)}
    .em-cfg .topo .sub{display:none}
    .na-sub .voltar-cfg{display:grid;place-items:center;width:36px;height:36px;margin-left:-6px;border-radius:10px;color:var(--ink)}
    .voltar-cfg svg{width:22px;height:22px}
    .trilho .cfg{display:none}
    .funil{scroll-snap-type:x mandatory;padding:12px 14px;align-items:stretch;overscroll-behavior-x:contain}
    .coluna{flex-basis:84vw;scroll-snap-align:center;height:100%;max-height:none}
    .coluna .cards{flex:1;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
    .agenda .painel:last-child{order:-1}
    .lista .busca{margin:12px 12px 8px}
    .abas-linha{margin:0 12px}
    .topo{transition:transform .25s ease}
    .principal{transition:padding-top .25s ease}
    .rolou .topo{transform:translateY(-100%)}
    .rolou .principal{padding-top:env(safe-area-inset-top)}
    .lista .busca{max-height:60px;transition:max-height .25s ease,margin .25s ease,padding .25s ease,opacity .2s ease,border-width .25s}
    .rolou .lista .busca{max-height:0;margin-top:0;margin-bottom:8px;padding-top:0;padding-bottom:0;opacity:0;border-width:0;overflow:hidden}
    .rolou .abas-linha{padding-top:8px}
    .compor{padding:10px 12px}
    .inbox{grid-template-columns:minmax(0,1fr)}
    .inbox>*{min-width:0}
    .inbox .conversa{display:none}
    .inbox.mostra-conv .lista{display:none}
    .inbox.mostra-conv .conversa{display:flex}
    .voltar{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px}
    .voltar svg{width:20px;height:20px}
    .conv-topo{padding:10px 12px;gap:9px}
    .conv-topo .acoes .txt{display:none}
    .fio{padding:14px 12px}
    .msg{max-width:88%}
    .agenda,.assist,.prod,.dash,.canais{padding:14px}
    .semana{grid-template-columns:1fr}
    .dia-col{min-height:0}
    .kpi{grid-column:span 6;padding:12px 13px}
    .kpi .n{font-size:1.6rem}
    th,td{padding:10px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
  'use strict';

  /* =====================================================================
     CONFIG: tudo o que muda de um cliente para outro fica aqui.
     Para criar a versão de um cliente novo, copie este arquivo e edite
     só este bloco e a função semente() (dados de exemplo).
     ===================================================================== */
  var CONFIG = {
    sistema: 'AbertoCore',
    empresa: 'abertodigital',
    responsavel: 'Julio',
    whatsapp: '(11) 99123-3627',
    email: 'contato@abertodigital.com',
    etapas: ['Novo contato','Qualificado','Proposta enviada','Negociação','Fechado','Perdido'],
    coresEtapas: ['#AEB6C6','#2F6FED','#FFB020','#FFA586','#1F9D55','#D64545'],
    etapaGanho: 'Fechado',
    etapaPerda: 'Perdido',
    intervaloAoVivo: 25000,
    /* Respostas do assistente: a primeira regra que bater com a mensagem responde.
       {nome} = primeiro nome do contato, {oi} = "Nome, " ou vazio, {resp} = responsável. */
    regrasIA: [
      {se: /pre[cç]o|valor|quanto|custa|or[cç]amento/, diz: 'Claro{, nome}! Os pacotes são: Start por R$ 650 + R$ 49/mês, Presença por R$ 990 + R$ 99/mês, Completo por R$ 1.900 + R$ 249/mês e Enterprise por R$ 3.500 + R$ 450/mês. Nos planos de 6 e 12 meses a mensalidade tem 15% e 30% de desconto. Se quiser, faço uma auditoria gratuita do seu negócio para indicar o melhor.'},
      {se: /agend|marcar|hor[aá]rio|reuni|demonstra/, diz: 'Posso marcar uma conversa de 15 minutos. Tenho amanhã às 10h ou às 15h. Qual fica melhor para você?'},
      {se: /automat|chatbot|\bia\b|rob[oô]|responder sozinho|whats/, diz: '{oi}dá sim! O assistente de IA responde preço, horário e endereço na hora, pré-agenda e só chama você quando precisa. Ele vem no pacote Completo e no Enterprise.'},
      {se: /crm|sistema|funil|enterprise|equipe|v[aá]rios atendentes/, diz: 'No Enterprise, WhatsApp, Instagram, Facebook e e-mail chegam numa caixa só, cada contato vira um card no funil, e a agenda e o follow-up ficam no mesmo lugar. Quer ver uma demonstração?'},
      {se: /google|maps|aparecer/, diz: 'Para aparecer no Google, otimizamos seu perfil com fotos, horário, serviços e respostas às avaliações. Isso já vem no Start, a partir de R$ 650.'},
      {se: /site/, diz: 'Fazemos site de 1 página, rápido no celular e com botão de WhatsApp. Ele vem a partir do pacote Start.'},
      {se: /feriado|hor[aá]rio de funcionamento/, diz: '{oi}eu mesmo atualizo o horário de feriado no seu perfil do Google. É só me dizer o dia e o horário que vão funcionar.'},
      {se: /onde|endere[cç]o|aruj[aá]|atende/, diz: 'Atendemos presencialmente em Arujá e região, e remoto para qualquer cidade.'},
      {se: /auditoria/, diz: 'A auditoria é gratuita: olhamos seu Google, site e WhatsApp e mandamos um PDF de 1 página com o que está deixando clientes escaparem.'},
      {se: /obrigad|valeu/, diz: 'Eu que agradeço! Qualquer coisa, é só chamar por aqui.'},
      {se: /parcel|contrato|desconto|reclama|pagamento|fechar/, diz: 'Vou passar para o {resp}, que cuida disso pessoalmente. Ele responde em poucos minutos.'}
    ],
    respostaPadrao: 'Entendi! Vou passar para o {resp}, que responde em poucos minutos. Enquanto isso, quer receber a auditoria gratuita do seu negócio?'
  };

  /* ---------- utilidades ---------- */
  var IC = {
    msg:'<path d="M4 5h16v11H9l-5 4z"/>',
    funil:'<path d="M3 4h18l-7 8.5V19l-4 2v-8.5z"/>',
    agenda:'<path d="M4 6h16v14H4zM4 10h16M8 3v5M16 3v5"/>',
    dash:'<path d="M5 20v-8M12 20V5M19 20v-5M3 20h18"/>',
    prod:'<path d="M3 7.5 12 3l9 4.5-9 4.5zM3 7.5v9L12 21l9-4.5v-9M12 12v9"/>',
    ia:'<path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM18.5 15l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/>',
    canais:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    enviar:'<path d="M4 12 20 4l-6 16-3-6.5z"/>',
    busca:'<path d="M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14zM20 20l-4-4"/>',
    mais:'<path d="M12 5v14M5 12h14"/>',
    voltar:'<path d="M15 5l-7 7 7 7"/>',
    info:'<path d="M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18zM12 11v6M12 7.5v.5"/>',
    ok:'<path d="M5 12.5 10 17l9-10"/>',
    x:'<path d="M6 6l12 12M18 6 6 18"/>',
    filtro:'<path d="M4 6h16M7 12h10M10 18h4"/>'
  };
  function ic(n){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[n] + '</svg>'; }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function $(s, r){ return (r || document).querySelector(s); }
  function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function brl(v){ return v == null ? 'Sob consulta' : 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits: v % 1 ? 2 : 0}); }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function iso(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDias(n){ var d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate() + n); return iso(d); }
  var HOJE = addDias(0);
  function diffDias(s){ var a = new Date(s + 'T12:00:00'), b = new Date(HOJE + 'T12:00:00'); return Math.round((a - b) / 864e5); }
  function dataCurta(s){ var d = new Date(s + 'T12:00:00'); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1); }
  function agoraMs(){ return Date.now(); }
  function quando(ts){
    var d = new Date(ts), h = new Date();
    if (d.toDateString() === h.toDateString()) return pad(d.getHours()) + ':' + pad(d.getMinutes());
    var o = new Date(); o.setDate(o.getDate() - 1);
    if (d.toDateString() === o.toDateString()) return 'ontem';
    return pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
  }
  function hm(ts){ var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function rotDia(ts){
    var d = new Date(ts), h = new Date();
    if (d.toDateString() === h.toDateString()) return 'Hoje';
    var o = new Date(); o.setDate(o.getDate() - 1);
    if (d.toDateString() === o.toDateString()) return 'Ontem';
    return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'long'});
  }

  var CANAIS = {
    WhatsApp:{cor:'var(--wa)', l:'W'}, Instagram:{cor:'var(--ig)', l:'I'},
    Facebook:{cor:'var(--fb)', l:'F'}, 'E-mail':{cor:'var(--em)', l:'@'}, Presencial:{cor:'#8A5B00', l:'P'}
  };
  var ETAPAS = CONFIG.etapas, COR_ETAPA = CONFIG.coresEtapas;
  var CORES_AV = ['#2F6FED','#1E3050','#C77700','#1F9D55','#B0417A','#5B6678','#D9603B','#3B7A8C'];
  function corAv(nome){ var h = 0; for (var i = 0; i < nome.length; i++) h = (h * 31 + nome.charCodeAt(i)) % 997; return CORES_AV[h % CORES_AV.length]; }
  function iniciais(nome){ var p = nome.trim().split(/\s+/); return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); }
  function avatar(c, semSelo){
    var k = CANAIS[c.canal];
    return '<span class="av" style="background:' + corAv(c.nome) + '">' + esc(iniciais(c.nome)) +

  }

      kpi('Taxa de conversão', conv + '%', fech + (fech === 1 ? ' fechado, ' : ' fechados, ') + perd + (perd === 1 ? ' perdido' : ' perdidos'), 'k3') +

  function kpi(r, n, s, id, up){ return '<div class="kpi" id="' + id + '"><div class="r">' + r + '</div><div class="n">' + n + '</div><div class="s' + (up ? ' up' : '') + '">' + s + '</div></div>'; }
  function grafLeads(serie){
    var estreito = window.innerWidth < 760, W = estreito ? 360 : 640, H = estreito ? 200 : 220, p = {l:26, r:6, t:12, b:26}, max = Math.max.apply(null, serie.map(function(x){ return x.n; })) + 2;
    var bw = (W - p.l - p.r) / serie.length;
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Novos leads por dia">';
    for (var g = 0; g <= max; g += Math.ceil(max / 4)){ var y = H - p.b - g / max * (H - p.t - p.b); s += '<line x1="' + p.l + '" x2="' + (W - p.r) + '" y1="' + y + '" y2="' + y + '" stroke="#E2E6ED"/><text x="' + (p.l - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="#8A93A6">' + g + '</text>'; }
    serie.forEach(function(x, i){
      var h = x.n / max * (H - p.t - p.b), xx = p.l + i * bw + bw * .18, w = bw * .64, y = H - p.b - h;
      var hoje = x.dia === HOJE;
      s += '<rect x="' + xx + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="4" fill="' + (hoje ? '#FFB020' : '#2F6FED') + '"><title>' + dataCurta(x.dia) + ': ' + x.n + ' leads</title></rect>';
      if ((estreito ? (13 - i) % 4 === 0 : i % 2 === 1) || hoje) s += '<text x="' + (xx + w / 2) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="' + (hoje ? '#101A2C' : '#8A93A6') + '"' + (hoje ? ' font-weight="700"' : '') + '>' + (hoje ? 'hoje' : dataCurta(x.dia)) + '</text>';
    });
    return s + '</svg>';
  }

    var max = S.msgsCanal[ks[0]], W = 320, rh = 44, H = ks.length * rh;

  function grafFunil(){
    var ab = ETAPAS.slice(0, 5), cont = ab.map(function(et, i){
      return S.contatos.filter(function(c){ return ETAPAS.indexOf(c.etapa) >= i && c.etapa !== CONFIG.etapaPerda; }).length;

  /* ========== PRODUTOS ========== */
  function vProdutos(){
    $('#vista').innerHTML = '<div class="prod"><div class="tb-cab"><h2>' + S.produtos.length + ' produtos e serviços</h2><button class="btn pri" id="novoP">' + ic('mais') + 'Novo produto</button></div>' +
      '<table class="tb-prod"><thead><tr><th>Nome</th><th>Tipo</th><th>Implantação</th><th>Mensalidade</th><th>Ativo</th></tr></thead><tbody>' +
      S.produtos.map(function(p){
        return '<tr' + (p.destaque ? ' class="destaque"' : '') + '><td><button data-ed="' + p.id + '" style="font-weight:700;text-align:left">' + esc(p.nome) + '</button><div class="ds">' + esc(p.ds) + '</div></td><td>' + p.tipo + '</td>' +
          '<td class="num" data-l="Implantação">' + (p.setup === 0 ? 'Grátis' : brl(p.setup)) + '</td><td class="num" data-l="Mensalidade">' + (p.mensal === 0 ? '-' : brl(p.mensal)) + '</td>' +
          '<td><button class="chave" role="switch" aria-checked="' + p.ativo + '" data-at="' + p.id + '" aria-label="Ativar ' + esc(p.nome) + '"></button></td></tr>';
      }).join('') + '</tbody></table></div>';
    $('#novoP').onclick = function(){ modalProduto(); };
    $('#vista').onclick = function(e){
      var a = e.target.closest('[data-at]'), ed = e.target.closest('[data-ed]');
      if (a){ var p = S.produtos.filter(function(x){ return x.id === +a.getAttribute('data-at'); })[0]; p.ativo = !p.ativo; salva(); a.setAttribute('aria-checked', p.ativo); }
      if (ed) modalProduto(+ed.getAttribute('data-ed'));
    };
  }
  function modalProduto(id){
    var p = id ? S.produtos.filter(function(x){ return x.id === id; })[0] : {nome:'', tipo:'Pacote', setup:null, mensal:null, ds:'', ativo:true};
    var M = $('#modal');
    M.innerHTML = '<form method="dialog"><h3>' + (id ? 'Editar produto' : 'Novo produto') + '</h3>' +
      '<div class="campo"><label for="pN">Nome</label><input id="pN" required value="' + esc(p.nome) + '"></div>' +
      '<div class="campo"><label for="pT">Tipo</label><select id="pT">' + ['Pacote','Módulo','Serviço','Produto'].map(function(t){ return '<option' + (t === p.tipo ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></div>' +
      '<div class="duas"><div class="campo"><label for="pS">Implantação (R$)</label><input id="pS" type="number" min="0" placeholder="Sob consulta" value="' + (p.setup == null ? '' : p.setup) + '"></div>' +
      '<div class="campo"><label for="pM">Mensalidade (R$)</label><input id="pM" type="number" min="0" placeholder="Sob consulta" value="' + (p.mensal == null ? '' : p.mensal) + '"></div></div>' +
      '<div class="campo"><label for="pD">O que inclui</label><textarea id="pD" rows="3">' + esc(p.ds) + '</textarea></div>' +
      '<div class="bts"><button class="btn" value="cancelar" formnovalidate>Cancelar</button><button class="btn pri" value="ok">Salvar</button></div></form>';
    M.onclose = function(){
      if (M.returnValue === 'ok'){
        function num(v){ return v === '' ? null : +v; }
        p.nome = $('#pN').value.trim(); p.tipo = $('#pT').value; p.setup = num($('#pS').value); p.mensal = num($('#pM').value); p.ds = $('#pD').value.trim();
        if (!id){ p.id = S.prox.p++; S.produtos.push(p); }
        salva(); aviso('<b>' + esc(p.nome) + '</b> salvo.'); vProdutos();
      }
      M.onclose = null;
    };
    M.returnValue = ''; M.showModal();
  }

  /* ========== ASSISTENTE ========== */
  function vAssistente(){
    var A = S.ia;
    $('#vista').innerHTML = '<div class="assist">' +
      '<section class="painel"><h2>Configuração</h2>' +
        '<div class="linha-ch"><div><div class="t">Assistente ligado</div><div class="d">Responde sozinho no WhatsApp, Instagram e Facebook</div></div><button class="chave" role="switch" id="iaOn" aria-checked="' + A.ativo + '" aria-label="Assistente ligado"></button></div>' +
        '<div class="linha-ch"><div><div class="t">Passar para humano</div><div class="d">Quando o cliente pede preço personalizado, contrato ou reclama</div></div><button class="chave" role="switch" id="iaHum" aria-checked="' + A.humano + '" aria-label="Passar para humano"></button></div>' +
        '<div class="linha-ch" style="margin-bottom:14px"><div><div class="t">Pré-agendar</div><div class="d">Oferece horários livres da agenda</div></div><button class="chave" role="switch" id="iaAg" aria-checked="' + A.agendar + '" aria-label="Pré-agendar"></button></div>' +
        '<div class="duas"><div class="campo"><label for="iaN">Nome do assistente</label><input id="iaN" value="' + esc(A.nome) + '"></div>' +
        '<div class="campo"><label for="iaT">Tom de voz</label><select id="iaT">' + ['Próximo e direto','Formal','Animado'].map(function(t){ return '<option' + (t === A.tom ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></div></div>' +
        '<div class="campo"><label for="iaH">Horário de atendimento</label><input id="iaH" value="' + esc(A.horario) + '"></div>' +
        '<div class="campo"><label for="iaB">Base de conhecimento</label><textarea id="iaB" rows="7">' + esc(A.base) + '</textarea></div>' +
        '<button class="btn pri" id="iaSalva">Salvar configuração</button>' +
      '</section>' +
      '<section class="painel teste"><h2>Teste o assistente</h2><div class="fio" id="tFio"><div class="msg ia"><span class="quem">' + ic('ia') + esc(A.nome) + '</span>Oi! Sou o assistente da ' + esc(CONFIG.empresa) + '. Pergunte sobre preços, horários ou agendamento.<span class="h">agora</span></div></div>' +
        '<div class="compor"><form class="linha" id="tF"><textarea id="tT" rows="1" placeholder="Ex.: quanto custa um site?" aria-label="Pergunta de teste"></textarea><button class="envia" aria-label="Enviar">' + ic('enviar') + '</button></form></div></section></div>';
    ['iaOn','iaHum','iaAg'].forEach(function(k){ $('#' + k).onclick = function(e){ var b = e.currentTarget, v = b.getAttribute('aria-checked') !== 'true'; b.setAttribute('aria-checked', v); A[{iaOn:'ativo', iaHum:'humano', iaAg:'agendar'}[k]] = v; salva(); if (k === 'iaOn') aviso('Assistente ' + (v ? '<b>ligado</b>' : '<b>pausado</b>') + '.'); }; });
    $('#iaSalva').onclick = function(){ A.nome = $('#iaN').value; A.tom = $('#iaT').value; A.horario = $('#iaH').value; A.base = $('#iaB').value; salva(); aviso('Configuração do assistente salva.'); };
    var ta = $('#tT');
    ta.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); $('#tF').requestSubmit(); } });
    $('#tF').addEventListener('submit', function(e){
      e.preventDefault(); var t = ta.value.trim(); if (!t) return; ta.value = '';
      var fio = $('#tFio'), agora = hm(agoraMs());
      fio.insertAdjacentHTML('beforeend', '<div class="msg cli">' + esc(t) + '<span class="h">' + agora + '</span></div><div class="digitando" id="dig">digitando...</div>');
      fio.scrollTop = fio.scrollHeight;
      setTimeout(function(){
        var d = $('#dig'); if (d) d.remove();
        fio.insertAdjacentHTML('beforeend', '<div class="msg ia"><span class="quem">' + ic('ia') + esc(A.nome) + '</span>' + esc(respostaIA(t)) + '<span class="h">' + hm(agoraMs()) + '</span></div>');
        fio.scrollTop = fio.scrollHeight;
      }, 900);
    });
  }

  /* ========== CANAIS ========== */
  function vCanais(){
    var L = [
      ['W','var(--wa)','WhatsApp Business','ok','Conectado: ' + CONFIG.whatsapp,'Mensagens, áudios e fotos chegam na central. Assistente de IA ativo.'],
      ['I','var(--ig)','Instagram','ok','Conectado: Direct','Mensagens do Direct e respostas aos stories.'],
      ['F','var(--fb)','Facebook Messenger','ok','Conectado: página da empresa','Mensagens da página e de anúncios.'],
      ['@','var(--em)','E-mail','ok','Conectado: ' + CONFIG.email,'Recebe e responde e-mails, e cada um vira Lead ou Cliente no funil.'],
      ['G','#EA4335','Google Business','br','Em breve','Mensagens e avaliações do perfil no Google.'],
      ['T','#101A2C','TikTok','br','Em breve','Mensagens diretas do TikTok.'],
      ['S','#2F6FED','Chat do site','br','Em breve','Janela de conversa no abertodigital.com.']
    ];
    $('#vista').innerHTML = '<div class="canais">' + L.map(function(c){
      return '<div class="canal-card"><div class="tt"><span class="ic" style="background:' + c[1] + '">' + c[0] + '</span>' + c[2] + '</div><div class="st ' + c[3] + '">' + c[4] + '</div><div class="ds">' + c[5] + '</div>' +
        '<button class="btn peq" data-cn="' + c[3] + '" style="align-self:flex-start">' + (c[3] === 'ok' ? 'Gerenciar' : 'Conectar') + '</button></div>';
    }).join('') + '<div class="canal-card"><div class="tt">Dados da demonstração</div><div class="ds">As mudanças ficam salvas só neste navegador. Volte aos dados de exemplo quando quiser.</div><button class="btn peq" id="reset" style="align-self:flex-start">Restaurar dados de exemplo</button></div></div>';
    $('#vista').onclick = function(e){
      if (e.target.closest('[data-cn]')) aviso('Na demonstração os canais são simulados. A conexão real entra na versão com integrações.');
      if (e.target.closest('#reset')){ S = Core.garante(semente()); sel = null; salva(); aviso('Dados de exemplo restaurados.'); desenha(); }
    };
  }

  /* ---------- simulação ao vivo ---------- */
  var FILA = [
    {nome:'Rogério Lima', txt:'Consigo ver isso hoje ainda?'},
    {novo:{nome:'Patrícia Gomes', negocio:'Floricultura Jardim', canal:'Instagram', tel:'(11) 9 6xxx-3301', origem:'Instagram'}, txt:'Oi! Quanto custa pra fazer um site pra minha floricultura?'},
    {nome:'Camila Duarte', txt:'Vocês conseguem marcar uma demonstração essa semana?'},
    {novo:{nome:'Eduardo Ramos', negocio:'Ramos Materiais de Construção', canal:'WhatsApp', tel:'(11) 9 5xxx-7720', origem:'Google'}, txt:'Boa tarde, vi vocês no Google. Vocês fazem chatbot pra WhatsApp?'},
    {nome:'Juliana Rocha', txt:'Conversei com meu sócio, vamos fechar! Como faço o pagamento?'},
    {novo:{nome:'Sônia Almeida', negocio:'Lavanderia Bolha', canal:'E-mail', tel:'(11) 9 4xxx-1180', origem:'Site'}, txt:'Assunto: Aparecer no Google Maps\n\nOlá, minha lavanderia não aparece no Google Maps. Vocês ajudam?'},
    {nome:'Ana Souza', txt:'Pode mandar o contrato sim'},
    {novo:{nome:'Gustavo Nunes', negocio:'Barbearia do Gus', canal:'Facebook', tel:'(11) 9 3xxx-6650', origem:'Facebook'}, txt:'Quero um sistema de agendamento pra barbearia, vocês fazem?'}
  ];
  var iFila = 0, timer = null, vivo = !(window.Nuvem && Nuvem.logado());
  function chega(){
    var f = FILA[iFila++ % FILA.length], c;
    if (f.novo){
      c = S.contatos.filter(function(x){ return x.nome === f.novo.nome; })[0];
      if (!c){ c = {id:S.prox.c++, nome:f.novo.nome, negocio:f.novo.negocio, canal:f.novo.canal, tipo:'Lead', etapa:'Novo contato', valor:650, followup:addDias(1), status:'entrada', tel:f.novo.tel, origem:f.novo.origem, nota:'', msgs:[], naoLidas:0, criado:HOJE}; S.contatos.push(c); }
    } else c = S.contatos.filter(function(x){ return x.nome === f.nome; })[0];
    if (!c) return;
    c.msgs.push({de:'cli', txt:f.txt, ts:agoraMs()}); c.status = 'entrada'; S.msgsCanal[c.canal]++;
    if (c.id !== sel || atual !== 'mensagens') c.naoLidas = (c.naoLidas || 0) + 1;
    salva();
    aviso('Nova mensagem de <b>' + esc(c.nome) + '</b> no ' + c.canal + (f.novo ? ' (novo lead)' : '') + '.');
    atualizaAoVivo(c);
    if (S.ia.ativo && c.canal !== 'E-mail'){
      setTimeout(function(){
        c.msgs.push({de:'ia', txt:respostaIA(f.txt, c.nome), ts:agoraMs()}); S.msgsCanal[c.canal]++; salva(); atualizaAoVivo(c);
      }, 2200);
    }
  }
  function atualizaAoVivo(c){
    desenhaNav();
    if (atual === 'mensagens'){ if (c.status !== aba && c.id !== sel) {} desenhaLista(); if (c.id === sel){ var ta = $('#texto'), v = ta ? ta.value : ''; desenhaConversa(); if (v) $('#texto').value = v; } }
    else if (atual === 'dashboard'){ vDash(); $$('.kpi').forEach(function(k){ k.classList.add('flash'); }); }
    else if (atual === 'funil') vFunil();
  }
  function ligaVivo(){ clearInterval(timer); if (vivo) timer = setInterval(chega, CONFIG.intervaloAoVivo); }
  if (!vivo){ $('#aovivo').setAttribute('aria-pressed', 'false'); $('#aovivo').style.display = 'none'; var dm = document.querySelector('.demo'); if (dm) dm.style.display = 'none'; }
  $('#aovivo').onclick = function(){ vivo = !vivo; this.setAttribute('aria-pressed', vivo); aviso(vivo ? 'Simulação ao vivo <b>ligada</b>.' : 'Simulação ao vivo pausada.'); ligaVivo(); };
  window.addEventListener('hashchange', function(){ var h = location.hash.slice(1); if (h && h !== atual && VISTAS.some(function(v){ return v.id === h; })) vai(h); });

  document.addEventListener('focusin', function(e){ if (e.target.matches('textarea, input:not([type=checkbox]):not([type=date]):not([type=time]), select')) document.body.classList.add('teclado'); });
  document.addEventListener('focusout', function(){ setTimeout(function(){ if (!document.activeElement || !document.activeElement.matches('textarea, input, select')) document.body.classList.remove('teclado'); }, 50); });
  document.addEventListener('click', function(){ var pf = $('#popFiltro'); if (pf && !pf.hidden){ pf.hidden = true; $('#btnFiltro').setAttribute('aria-expanded', 'false'); } });
  function recarrega(){ try { var n = JSON.parse(localStorage.getItem(CHAVE)); if (n && n.contatos){ S = Core.garante(n); if (!S.ia) S.ia = semente().ia; desenha(); } } catch (e) {} }
  window.addEventListener('storage', function(e){ if (e.key === CHAVE) recarrega(); });
  window.addEventListener('pageshow', function(e){ if (e.persisted) recarrega(); });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) recarrega(); });
  var mq = window.matchMedia('(max-width:760px)');
  (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(function(){ if (atual === 'dashboard') vDash(); });

  desenha();
  ligaVivo();
  setTimeout(chega, 6000);
})();
</script>
