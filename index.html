<html lang="pt-BR">
<head>

<style>
  :root{
    --ink:#101A2C; --navy:#1E3050; --slate:#384358;
    --ambar:#FFB020; --ceu:#2F6FED; --pessego:#FFA586;
    --papel:#F6F7F9; --branco:#fff; --texto:#101A2C; --sec:#5B6678;
    --muted:#8A93A6; --linha:#E2E6ED; --linha2:#D5DAE3;
    --verde:#1F9D55; --vermelho:#D64545;
    --wa:#1FAF5A; --ig:#C13584; --fb:#1877F2; --em:#5B6678;
    --display:"Archivo",system-ui,sans-serif;
    --corpo:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --raio:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--corpo);color:var(--texto);background:var(--papel);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  :focus-visible{outline:3px solid var(--ambar);outline-offset:2px;border-radius:6px}
  .app{display:grid;grid-template-columns:72px 1fr;grid-template-rows:minmax(0,1fr);height:100dvh;overflow:hidden}

  /* trilho lateral */
  .trilho{background:linear-gradient(180deg,var(--navy),var(--ink));display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
  .trilho .marca{width:42px;height:42px;margin-bottom:14px}
  .trilho .marca-ia{width:46px;height:46px;padding:2px;border-radius:14px;margin-bottom:12px;position:relative}
  .trilho .marca-ia svg{width:42px;height:42px;display:block;transition:transform .15s}
  .trilho .marca-ia:hover{background:rgba(255,176,32,.14)}.trilho .marca-ia:hover svg{transform:scale(1.04)}
  .trilho .marca-ia[aria-pressed="true"]{background:rgba(255,176,32,.22);box-shadow:inset 0 0 0 2px #FFB020}
  .trilho .marca-ia .brilho{position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:50%;background:#FFB020;box-shadow:0 0 0 2px var(--navy)}
  .trilho .marca-ia .brilho::before{content:"";position:absolute;inset:3px;background:#1E3050;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
  .trilho .marca-ia .bolha{top:-4px;right:-4px;background:#D92D20;color:#fff}
  .trilho .marca-ia.desligado .brilho{display:none}
  .trilho .marca-ia .bolha[hidden]{display:none}
  .corpo{flex:1;display:flex;min-height:0}
  .cfg-menu{width:248px;flex:none;border-right:1px solid var(--linha);background:var(--branco);overflow:auto;padding:18px 12px 24px}
  .cfg-menu[hidden]{display:none}
  .cfg-menu-t{font-weight:800;font-size:15px;padding:0 10px 10px;color:var(--ink)}
  .cfg-grupo{margin-top:12px}
  .cfg-cat{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--muted);padding:0 10px 6px}
  .cfg-op{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;text-align:left}
  .cfg-op svg{width:18px;height:18px;color:var(--sec);flex:none}
  .cfg-op:hover{background:var(--papel)}
  .cfg-op[aria-current="page"]{background:#EEF3FF;color:var(--ceu)}.cfg-op[aria-current="page"] svg{color:var(--ceu)}
  .cfg-op .ext{margin-left:auto;color:var(--muted);font-size:13px}
  .cfg-lista .cfg-cat{padding:10px 4px 0}
  .ia-btn{display:none!important}
  .marca-ia-topo{display:none;position:relative;padding:0;border-radius:11px;line-height:0}
  .marca-ia-topo .brilho{position:absolute;right:-4px;bottom:-4px;width:15px;height:15px;border-radius:50%;background:#FFB020;box-shadow:0 0 0 2px var(--branco)}
  .marca-ia-topo .brilho::before{content:"";position:absolute;inset:3px;background:#1E3050;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
  .marca-ia-topo .bolha{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#D92D20;color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center}
  .marca-ia-topo .bolha[hidden],.marca-ia-topo.desligado .brilho{display:none}
  .marca-ia-topo[aria-pressed="true"] svg{box-shadow:0 0 0 2px #FFB020}
  html[data-tema="escuro"] .marca-ia-topo .brilho{box-shadow:0 0 0 2px #161E2B}
  .td-del{width:40px;text-align:right}
  .div-lista{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:7px 16px;font-size:11.5px;font-weight:800;letter-spacing:.03em;color:var(--sec);background:var(--papel);border-bottom:1px solid var(--linha)}
  .div-lista span{background:var(--branco);border-radius:999px;padding:1px 8px;font-size:11px}
  .div-lista.esp{color:#7A5A12;background:#FFF7E6}
  .grupo-esp .item{background:#FFFCF5}
  .grupo-esp .item .ult{color:var(--muted)}
  .vazio.peq{padding:14px 16px;font-size:13px}
  .abas .aba-ic{flex:0 0 auto;padding:6px 10px;display:grid;place-items:center}.abas .aba-ic svg{width:17px;height:17px}
  .abas small.cinza{background:var(--linha);color:var(--sec)}
  html[data-tema="escuro"] .div-lista{background:#121A27}
  html[data-tema="escuro"] .div-lista.esp{background:#2A2312;color:#FFCF6B}
  html[data-tema="escuro"] .grupo-esp .item{background:#17140C}
  .ag-link{display:flex;align-items:center;border:1px solid var(--linha);border-radius:10px;overflow:hidden;background:var(--branco)}
  .ag-link span{padding:0 0 0 10px;color:var(--sec);font-size:13px;white-space:nowrap}
  .ag-link input{border:0!important;flex:1;min-width:60px;padding:9px 10px 9px 2px;background:transparent;font-weight:700}
  .bts-l{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .ag-dias{display:grid;gap:8px}
  .ag-dia{display:grid;grid-template-columns:130px 1fr auto 1fr;gap:8px;align-items:center;font-size:14px}
  .ag-dia label{display:flex;gap:8px;align-items:center;font-weight:600}
  .ag-dia input[type=time]{padding:7px 8px;border:1px solid var(--linha);border-radius:9px;background:var(--branco);color:var(--ink)}
  .ag-dia input:disabled{opacity:.45}
  .ag-chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 8px}
  .ag-chip input{position:absolute;opacity:0}
  .ag-chip span{display:inline-block;padding:7px 12px;border:1px solid var(--linha);border-radius:999px;font-size:13px;cursor:pointer}
  .ag-chip input:checked+span{background:var(--ceu);border-color:var(--ceu);color:#fff;font-weight:600}
  .ag-chip input:focus-visible+span{outline:3px solid var(--ambar)}
  .ag-servs{display:grid;gap:6px}.ag-serv{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;padding:6px 0;border-bottom:1px solid var(--linha)}
  .ag-serv label{display:flex;gap:8px;align-items:center}.ag-serv select{padding:5px 8px;border-radius:8px;border:1px solid var(--linha);background:var(--branco);color:var(--ink)}
  @media (max-width:760px){ .ag-dia{grid-template-columns:1fr auto 1fr;font-size:13px} .ag-dia label{grid-column:1/-1} .ag-link span{display:none} }
  .btn-del{width:32px;height:32px;border-radius:9px;display:inline-grid;place-items:center;color:var(--muted)}
  .btn-del svg{width:16px;height:16px}.btn-del:hover{background:#FDECEC;color:#D92D20}
  .btn.perigo{color:#D92D20;border-color:#F3C4C0}.btn.perigo svg{width:16px;height:16px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (max-width:760px){ .marca-ia-topo{display:block} .tb-prod tr{position:relative} .td-del{position:absolute;top:8px;right:8px;width:auto} }
  @media (min-width:761px){ .na-sub .voltar-cfg{display:none!important} .em-cfg .vista .ajustes,.em-cfg .vista .canais{max-width:820px} }
  .trilho button{position:relative;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#AEB6C6;transition:background .15s,color .15s}
  .trilho button:hover{background:rgba(255,255,255,.08);color:#fff}
  .trilho button[aria-current="page"]{background:var(--ceu);color:#fff}
  .trilho svg{width:22px;height:22px}
  .trilho .bolha{position:absolute;top:5px;right:5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ambar);color:var(--ink);font-size:10.5px;font-weight:800;display:grid;place-items:center}
  .trilho .fim{margin-top:auto}
  .dica{position:absolute;left:58px;white-space:nowrap;background:var(--ink);color:#fff;font-size:13px;padding:5px 10px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:50}
  .trilho button:hover .dica,.trilho button:focus-visible .dica{opacity:1}

  .principal{display:flex;flex-direction:column;min-width:0;min-height:0}
  .topo{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--linha);background:var(--branco)}
  .marca-topo{display:flex;align-items:center;gap:9px;flex:none}
  .marca-topo svg{width:34px;height:34px;display:none}
  .nome-sis{font-family:var(--display);font-weight:800;font-stretch:85%;font-size:1.2rem;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
  .nome-sis b{color:var(--ceu);font-weight:800}
  .sep{width:1px;height:32px;background:var(--linha2);flex:none}
  .trilho .rot{display:none}
  .voltar-cfg,.cfg-btn{display:none}
  .ia-btn{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:#B7791F;background:#FFF6E0;border:1px solid #F3D99A;cursor:pointer}
  .ia-btn[hidden]{display:none}
  .ia-btn svg{width:20px;height:20px}
  .ia-btn[aria-pressed="true"]{background:#FFE7A8}
  .ia-btn .bolha{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#D92D20;color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center}
  .ia-btn .bolha[hidden]{display:none}
  html[data-tema="escuro"] .ia-btn{background:#2A2312;border-color:#5A4A1E;color:#FFCF6B}
  .na-sub .voltar-cfg{display:grid;place-items:center;width:36px;height:36px;margin-left:-6px;border-radius:10px;color:var(--ink);background:none;border:0;cursor:pointer}
  .na-sub .voltar-cfg svg{width:22px;height:22px}
  .cfg-lista{max-width:760px}
  .cfg-lista{padding:14px;display:flex;flex-direction:column;gap:10px}
  .cfg-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--branco);border:1px solid var(--linha);border-radius:var(--raio);padding:14px 16px}
  .cfg-item .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#EEF3FF;color:var(--ceu);flex:none}
  .cfg-item .ic svg{width:22px;height:22px}
  .cfg-item .t{font-weight:700;font-size:15.5px}
  .cfg-item .d{font-size:13px;color:var(--sec)}
  .cfg-item .seta{margin-left:auto;color:var(--muted);font-size:22px;line-height:1}
  .topo h1{font-family:var(--display);font-weight:800;font-stretch:80%;font-size:1.45rem;letter-spacing:-.01em}
  .topo .sub{color:var(--sec);font-size:13.5px}
  .topo .dir{margin-left:auto;display:flex;align-items:center;gap:10px}
  .aovivo{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--sec);padding:6px 11px;border-radius:999px;border:1px solid var(--linha2);background:var(--branco)}
  .aovivo i{width:8px;height:8px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 0 rgba(31,157,85,.5);animation:pulso 2s infinite}
  .aovivo[aria-pressed="false"] i{background:var(--muted);animation:none}
  @keyframes pulso{70%{box-shadow:0 0 0 7px rgba(31,157,85,0)}100%{box-shadow:0 0 0 0 rgba(31,157,85,0)}}
  .demo{font-size:11px;font-weight:700;letter-spacing:.02em;color:#8A5A00;background:#FFF4DA;border:1px solid #F5D98F;padding:2px 7px;border-radius:999px;white-space:nowrap}
  .aovivo[hidden]{display:none!important}
  .vista{flex:1;min-height:0;overflow:auto}

  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;font-weight:600;font-size:14px;background:var(--branco);border:1px solid var(--linha2);transition:background .15s}
  .btn:hover{background:#EEF1F6}
  .btn.pri{background:var(--ceu);border-color:var(--ceu);color:#fff}
  .btn.pri:hover{background:#245CD0}
  .btn.ia{background:#FFF4DA;border-color:#F5D98F;color:var(--ink)}
  .btn.ia:hover{background:#FFEAB8}
  .btn svg{width:17px;height:17px}
  .btn.peq{padding:6px 11px;font-size:13px}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
  .chip.lead{background:#E6EEFF;color:#1D4FC4}
  .chip.cliente{background:#E2F5EA;color:#167443}
  .chip.etapa{background:#EEF1F6;color:var(--slate)}
  .chip.atraso{background:#FCE6E6;color:#A82F2F}
  .chip.hoje{background:#FFF4DA;color:#8A5B00}
  .canal{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--sec)}
  .canal b{width:9px;height:9px;border-radius:50%}

  .av{position:relative;flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff}
  .av .sel{position:absolute;right:-3px;bottom:-3px;width:19px;height:19px;border-radius:50%;border:2px solid var(--branco);display:grid;place-items:center;font-size:9px;font-weight:800;color:#fff}

  /* ===== Mensagens ===== */
  .inbox{display:grid;grid-template-columns:360px 1fr 300px;grid-template-rows:minmax(0,1fr);height:100%}
  .lista{min-width:0;border-right:1px solid var(--linha);background:var(--branco);display:flex;flex-direction:column;min-height:0}
  .lista .busca{display:flex;align-items:center;gap:8px;margin:14px 14px 8px;padding:9px 12px;border-radius:10px;background:var(--papel);border:1px solid var(--linha)}
  .lista .busca svg{width:17px;height:17px;color:var(--muted)}
  .lista .busca input{border:0;background:none;outline:0;width:100%}
  .abas-linha{position:relative;display:flex;gap:8px;margin:0 14px;padding-bottom:12px;border-bottom:1px solid var(--linha)}
  .abas{flex:1;display:flex;background:var(--papel);border-radius:10px;padding:4px;gap:2px;min-width:0}
  .btn-filtro{position:relative;flex:none;width:44px;border-radius:10px;border:1px solid var(--linha2);background:var(--branco);display:grid;place-items:center;color:var(--slate)}
  .btn-filtro svg{width:19px;height:19px}
  .btn-filtro[aria-expanded="true"],.btn-filtro.ativo{border-color:var(--ceu);color:var(--ceu);background:#EEF3FF}
  .btn-filtro .n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--ceu);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
  .pop-filtro{position:absolute;right:0;top:calc(100% - 4px);z-index:30;width:230px;background:var(--branco);border:1px solid var(--linha2);border-radius:14px;box-shadow:0 12px 32px rgba(16,26,44,.18);padding:8px}
  .pop-filtro .tt{font-size:12px;font-weight:700;color:var(--sec);padding:6px 10px 4px}
  .pop-filtro label{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-weight:600;font-size:14.5px;cursor:pointer}
  .pop-filtro label:hover{background:var(--papel)}
  .pop-filtro input{width:18px;height:18px;accent-color:var(--ceu)}
  .pop-filtro .canal{font-size:14.5px;color:var(--ink)}
  .pop-filtro .canal b{width:10px;height:10px}
  .abas button{flex:1 0 auto;padding:7px 6px;border-radius:7px;font-size:13px;white-space:nowrap;letter-spacing:-.005em;font-weight:600;color:var(--sec)}
  .abas button[aria-selected="true"]{background:var(--branco);color:var(--ink);box-shadow:0 1px 2px rgba(16,26,44,.12)}
  .abas small{font-size:11px;background:var(--ceu);color:#fff;border-radius:8px;padding:1px 6px;margin-left:4px}
  .itens{overflow:auto;flex:1}
  .carrossel{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;min-height:0}
  .carrossel::-webkit-scrollbar{display:none}
  .carrossel .pane{flex:0 0 100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;min-height:0;overscroll-behavior-y:contain}
  .ajustes{display:grid;gap:18px;padding:18px 22px;max-width:680px}
  .chip.pri-lead{background:#FFF1D6;color:#8A5B00;font-weight:800}.chip.pri-lead.pb{background:#E8EEF9;color:#2F4A7A}.chip.pri-lead.pc{background:#EEE;color:#666}
  .imp-drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--linha,#d6dbe4);border-radius:14px;padding:18px;text-align:center;cursor:pointer;color:var(--sec)}
  .imp-drop svg{width:26px;height:26px}
  .abas{overflow-x:auto;scrollbar-width:none}.abas::-webkit-scrollbar{display:none}
  .imp-drop:hover,.imp-drop.sobre{border-color:var(--azul,#2F6FED);color:var(--ink)}
  .imp-res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.imp-res div{background:var(--papel);border-radius:10px;padding:10px;text-align:center}.imp-res b{display:block;font-size:22px}
  .imp-lista{max-height:240px;overflow:auto;border:1px solid var(--linha,#e3e6ec);border-radius:10px;font-size:13px}.imp-lista div{padding:7px 10px;border-bottom:1px solid var(--linha,#eef0f4);display:flex;gap:8px;justify-content:space-between}.imp-lista div:last-child{border:0}.imp-lista em{color:var(--sec);font-style:normal;white-space:nowrap}
  .lead-bloco .dado a{color:var(--azul,#2F6FED)}
  .seg-tema button{flex:1;padding:9px 10px;font-weight:600}
  .pt-st{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#9aa6b6}.pt-st.ok{background:#1f9d55}.pt-st.sincronizando{background:#FFB020}.pt-st.erro{background:#d64545}
  .item{display:flex;gap:12px;width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid var(--linha);border-left:3px solid transparent}
  .item:hover{background:#F8F9FB}
  .item[aria-current="true"]{background:#EEF3FF;border-left-color:var(--ceu)}
  .item .mid{flex:1;min-width:0}
  .item .l1{display:flex;justify-content:space-between;gap:8px}

  /* ========== TEMA ESCURO ========== */
  html[data-tema="escuro"]{
    color-scheme:dark;
    --papel:#0D131D; --branco:#161E2B; --texto:#E7EBF2; --sec:#A2ACBE; --muted:#7F8AA0;
    --linha:#243044; --linha2:#2F3B52; --slate:#B9C2D3; --navy:#C9D6F5;
    --sup2:#1C2636; --sup3:#223047;
  }

  html[data-tema="escuro"] .nome-sis b,html[data-tema="escuro"] .nome-sis span{color:inherit}

  html[data-tema="escuro"] .demo,html[data-tema="escuro"] .aviso-dup,html[data-tema="escuro"] .btn.ia,html[data-tema="escuro"] .alerta-ia{background:#2E2410;border-color:#5A4614;color:#F5D98F}

  function chaveCol(t){ return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
  function lerCSV(txt){
    txt = txt.replace(/^﻿/, '');
    var prim = txt.split(/\r?\n/)[0] || '', sep = (prim.split(';').length > prim.split(',').length) ? ';' : ',';
    var linhas = [], lin = [], cel = '', aspas = false;
    for (var i = 0; i < txt.length; i++){
      var ch = txt[i];
      if (aspas){ if (ch === '"'){ if (txt[i + 1] === '"'){ cel += '"'; i++; } else aspas = false; } else cel += ch; continue; }
      if (ch === '"') aspas = true;
      else if (ch === sep){ lin.push(cel); cel = ''; }
      else if (ch === '\n'){ lin.push(cel.replace(/\r$/, '')); linhas.push(lin); lin = []; cel = ''; }
      else cel += ch;
    }
    if (cel || lin.length){ lin.push(cel); linhas.push(lin); }
    return linhas.filter(function(l){ return l.some(function(x){ return String(x).trim(); }); });

  function carregaXLSX(){

      s.onload = function(){ ok(window.XLSX); }; s.onerror = function(){ falha(new Error('Não deu para abrir arquivos do Excel agora. Salve como CSV e tente de novo.')); };

  function lerPlanilha(arq){

      var wb = r[0].read(r[1], {type:'array'});
      var aba = wb.SheetNames.filter(function(n){ return chaveCol(n) === 'leads'; })[0] || wb.SheetNames[0];
      return r[0].utils.sheet_to_json(wb.Sheets[aba], {header:1, raw:false, defval:''});

    }).then(function(reg){
      return Nuvem.api('GET', '/api/abertocore/push/chave').then(function(j){
        return reg.pushManager.getSubscription().then(function(s){ return s || reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u8(j.publicKey)}); });
      }).then(function(s){
        var o = s.toJSON();
        localStorage.setItem('abertocore-push-prefs', JSON.stringify(prefs));

  function fimConversa(fio){

    fio.querySelectorAll('img,video,audio').forEach(function(m){ m.addEventListener('load', vai, {once:true}); m.addEventListener('loadedmetadata', vai, {once:true}); });

      var oculta = app.classList.contains(classe);

  function grafLeads(serie){

        '<div class="linha-ch"><div><div class="t">Chatbot ligado</div><div class="d">Manda o menu na primeira mensagem do cliente</div></div><button class="chave" role="switch" id="botOn" aria-checked="' + !!B.ativo + '" aria-label="Chatbot ligado"></button></div>' +
        '<div class="campo"><label for="botS">Mensagem de boas-vindas</label><textarea id="botS" rows="3" maxlength="600">' + esc(B.saudacao) + '</textarea><div class="dica">{empresa} vira o nome da empresa.</div></div>' +
        '<div class="campo"><span class="rot">Como o menu aparece no WhatsApp</span><div class="seg seg-bot" id="botEst">' +
          '<button type="button" data-e="botoes" aria-pressed="' + (B.estilo !== 'texto') + '">Botões para tocar</button>' +
          '<button type="button" data-e="texto" aria-pressed="' + (B.estilo === 'texto') + '">Texto numerado</button></div>' +
          '<div class="dica" id="botEstDica"></div></div>' +
        '<div class="campo"><span class="rot">Opções do menu</span><div id="botOps">' + linhasOpcoes() + '</div>' +
        '<button class="btn peq" type="button" id="botAdd">' + ic('mais') + 'Adicionar opção</button></div>' +
        '<div class="duas"><div class="campo"><label for="botR">Rodapé do menu</label><input id="botR" value="' + esc(B.rodape) + '" maxlength="120"></div>' +
        '<div class="campo"><label for="botP">Robô fica quieto depois que a equipe assume</label><select id="botP">' + [2,6,12,24,48].map(function(h){ return '<option value="' + h + '"' + (h === +B.pausaHoras ? ' selected' : '') + '>' + h + ' horas</option>'; }).join('') + '</select></div></div>' +
        '<button class="btn pri" id="botSalva">Salvar chatbot</button>' +

        '<div class="compor"><form class="linha" id="bF"><textarea id="bT" rows="1" placeholder="Escreva como cliente, ex.: oi ou 1" aria-label="Mensagem de teste"></textarea><button class="envia" aria-label="Enviar">' + ic('enviar') + '</button></form></div></section></div>';
    function coleta(){
      B.saudacao = $('#botS').value; B.rodape = $('#botR').value; B.pausaHoras = +$('#botP').value;

    function redesenhaOps(){ $('#botOps').innerHTML = linhasOpcoes(); $('#botAdd').disabled = B.opcoes.length >= 9; dicaEst(); }

    $('#botEst').onclick = function(e){ var b = e.target.closest('[data-e]'); if (!b) return; B.estilo = b.getAttribute('data-e'); [].forEach.call(this.querySelectorAll('[data-e]'), function(x){ x.setAttribute('aria-pressed', x === b); }); dicaEst(); };

      if (B.estilo === 'texto'){ bolha('bot', (prefixo ? prefixo + ' ' : '') + menuTexto(C)); return; }
      var nomeEmp = (window.Nuvem && Nuvem.logado()) ? 'abertodigital' : CONFIG.empresa;
      var corpo = (prefixo ? prefixo + ' ' : '') + String(C.saudacao || '').replace(/\{empresa\}/g, nomeEmp);

    });

    $('#bF').addEventListener('submit', function(e){

      var C = {saudacao:B.saudacao, rodape:B.rodape, opcoes:B.opcoes.filter(function(o){ return o.titulo.trim(); })};
      bolha('cli', escolhaTitulo || t); escolhaTitulo = null;
      setTimeout(function(){
        if (!C.opcoes.length){ bolha('bot', 'Adicione opções ao menu para testar.'); return; }
        if (t === '0' || /^menu$/i.test(t)){ est.humano = false; est.menu = true; menuSim(C); return; }
        if (est.humano){ $('#bFio').insertAdjacentHTML('beforeend', '<div class="nota-sis">A equipe assumiu a conversa. O robô fica quieto.</div>'); return; }
        var m = t.match(/^(\d{1,2})[\s.)-]*$/);
        if (m){ var o = C.opcoes[+m[1] - 1]; if (o){ bolha('bot', o.resposta.trim() || 'Certo!'); if (o.humano){ est.humano = true; $('#bFio').insertAdjacentHTML('beforeend', '<div class="nota-sis">Conversa passada para a equipe.</div>'); } } else menuSim(C, 'Não encontrei essa opção.'); return; }
        if (!est.menu){ est.menu = true; menuSim(C); }
        else $('#bFio').insertAdjacentHTML('beforeend', '<div class="nota-sis">Texto livre depois do menu: fica para a equipe ler.</div>');
      }, 500);
    });

  /* ========== CANAIS ========== */

  var fbSdk = null;

      window.fbAsyncInit = function(){ FB.init({appId:meta.app_id, autoLogAppEvents:false, xfbml:false, version:meta.versao || 'v25.0'}); ok(window.FB); };
      var sc = document.createElement('script'); sc.async = true; sc.defer = true; sc.crossOrigin = 'anonymous';

  }

      (!meta.config_social || !meta.config_whatsapp ? '<div class="canal-card"><div class="tt">Conexão com a Meta</div><div class="ds">A abertodigital está concluindo a configuração do app na Meta. Assim que terminar, os botões de conectar aparecem aqui.</div></div>' : '') +

      if (tipo === 'email') return conectaEmail();
      b.disabled = true;
      carregaFb(meta).then(function(FB){ return tipo === 'whatsapp' ? conectaWhatsApp(FB, meta) : conectaSocial(FB, meta); })
        .then(function(j){ if (j && j.ligados){ aviso('Conectado: <b>' + j.ligados.map(esc).join(', ') + '</b>.'); } return Nuvem.statusCanais(); })
        .then(function(){ vCanaisReal(); })
        .catch(function(err){ b.disabled = false; if (err && err.message) aviso(esc(err.message)); });
    };
  }
  function confirmaSimples(t){ return window.confirm(t); }
  function loginFb(FB, opcoes){
    return new Promise(function(ok, falha){
      FB.login(function(r){ if (r && r.authResponse && r.authResponse.code) ok(r.authResponse.code); else falha(new Error('Conexão cancelada.')); }, opcoes);
    });
  }
  function conectaSocial(FB, meta){
    return loginFb(FB, {config_id:meta.config_social, response_type:'code', override_default_response_type:true}).then(function(code){
      return Nuvem.api('POST', '/api/abertocore/canais/meta', {code:code});
    }).then(function(j){
      if (!j.escolher) return j;
      var nomes = j.escolher.map(function(p, i){ return (i + 1) + ') ' + p.nome + (p.instagram ? ' + Instagram @' + p.instagram : ''); }).join('\n');
      var n = parseInt(window.prompt('Qual Página ligar a esta empresa?\n' + nomes, '1'), 10);
      var p = j.escolher[n - 1]; if (!p) throw new Error('Nenhuma Página escolhida.');
      return Nuvem.api('POST', '/api/abertocore/canais/meta', {page_id:p.id});
    });
  }
  function conectaWhatsApp(FB, meta){
    var info = {};
    function ouve(ev){
      if (!/facebook\.com$/.test(new URL(ev.origin).hostname)) return;
      try { var d = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data; if (d && d.type === 'WA_EMBEDDED_SIGNUP' && d.data){ if (d.data.phone_number_id) info.phone_number_id = d.data.phone_number_id; if (d.data.waba_id) info.waba_id = d.data.waba_id; } } catch (e) {}
    }
    window.addEventListener('message', ouve);
    return loginFb(FB, {config_id:meta.config_whatsapp, response_type:'code', override_default_response_type:true,
      extras:{setup:{}, featureType:'whatsapp_business_app_onboarding', sessionInfoVersion:'3'}}).then(function(code){
      return new Promise(function(ok){ setTimeout(ok, 800); }).then(function(){
        window.removeEventListener('message', ouve);
        if (!info.waba_id || !info.phone_number_id) throw new Error('A Meta não devolveu o número. Conclua todas as etapas da janela e tente de novo.');
        return Nuvem.api('POST', '/api/abertocore/canais/meta', {tipo:'whatsapp', code:code, waba_id:info.waba_id, phone_number_id:info.phone_number_id});
      });
    }, function(err){ window.removeEventListener('message', ouve); throw err; });
  }
  function conectaEmail(){
    Nuvem.api('POST', '/api/abertocore/email/autorizar', {}).then(function(j){ if (j && j.url) location.href = j.url; })
      .catch(function(err){ aviso(esc(err.message)); });
  }

  function vCanais(){
    if (window.Nuvem && Nuvem.logado()) return vCanaisReal();
    var L = [
      ['W','var(--wa)','WhatsApp Business','ok','Conectado: ' + CONFIG.whatsapp,'Mensagens, áudios e fotos chegam na central. Assistente de IA ativo.'],
      ['I','var(--ig)','Instagram','ok','Conectado: Direct','Mensagens do Direct e respostas aos stories.'],
      ['F','var(--fb)','Facebook Messenger','ok','Conectado: página da empresa','Mensagens da página e de anúncios.'],
      ['@','var(--em)','E-mail','ok','Conectado: ' + CONFIG.email,'Recebe e responde e-mails, e cada um vira Lead ou Cliente no funil.'],
      ['G','#EA4335','Google Business','br','Em breve','Mensagens e avaliações do perfil no Google.'],
      ['T','#101A2C','TikTok','br','Em breve','Mensagens diretas do TikTok.'],
      ['S','#2F6FED','Chat do site','ok','Ativo: ' + (CONFIG.site || 'abertodigital.com'),'Conversas da janela do site e do formulário caem aqui. Responda pela conversa, o visitante vê na hora.']
    ];
    $('#vista').innerHTML = '<div class="canais">' + L.map(function(c){
      return '<div class="canal-card"><div class="tt"><span class="ic" style="background:' + c[1] + '">' + c[0] + '</span>' + c[2] + '</div><div class="st ' + c[3] + '">' + c[4] + '</div><div class="ds">' + c[5] + '</div>' +
        '<button class="btn peq" data-cn="' + c[3] + '" style="align-self:flex-start">' + (c[3] === 'ok' ? 'Gerenciar' : 'Conectar') + '</button></div>';
    }).join('') + '<div class="canal-card"><div class="tt">Dados da demonstração</div><div class="ds">As mudanças ficam salvas só neste navegador. Volte aos dados de exemplo quando quiser.</div><button class="btn peq" id="reset" style="align-self:flex-start">Restaurar dados de exemplo</button></div></div>';
    $('#vista').onclick = function(e){
      if (e.target.closest('[data-cn]')) aviso('Na demonstração os canais são simulados. A conexão real entra na versão com integrações.');
      if (e.target.closest('#reset')){ S = Core.garante(semente()); sel = null; salva(); aviso('Dados de exemplo restaurados.'); desenha(); }
    };
  }

  /* ---------- simulação ao vivo ---------- */
  var FILA = [
    {nome:'Rogério Lima', txt:'Consigo ver isso hoje ainda?'},
    {novo:{nome:'Patrícia Gomes', negocio:'Floricultura Jardim', canal:'Instagram', tel:'(11) 9 6xxx-3301', origem:'Instagram'}, txt:'Oi! Quanto custa pra fazer um site pra minha floricultura?'},
    {nome:'Camila Duarte', txt:'Vocês conseguem marcar uma demonstração essa semana?'},
    {novo:{nome:'Eduardo Ramos', negocio:'Ramos Materiais de Construção', canal:'WhatsApp', tel:'(11) 9 5xxx-7720', origem:'Google'}, txt:'Boa tarde, vi vocês no Google. Vocês fazem chatbot pra WhatsApp?'},
    {nome:'Juliana Rocha', txt:'Conversei com meu sócio, vamos fechar! Como faço o pagamento?'},
    {novo:{nome:'Sônia Almeida', negocio:'Lavanderia Bolha', canal:'E-mail', tel:'(11) 9 4xxx-1180', origem:'Site'}, txt:'Assunto: Aparecer no Google Maps\n\nOlá, minha lavanderia não aparece no Google Maps. Vocês ajudam?'},
    {nome:'Ana Souza', txt:'Pode mandar o contrato sim'},
    {novo:{nome:'Gustavo Nunes', negocio:'Barbearia do Gus', canal:'Facebook', tel:'(11) 9 3xxx-6650', origem:'Facebook'}, txt:'Quero um sistema de agendamento pra barbearia, vocês fazem?'}
  ];
  var iFila = 0, timer = null, vivo = !(window.Nuvem && Nuvem.logado());
  function chega(){
    var f = FILA[iFila++ % FILA.length], c;
    if (f.novo){
      c = S.contatos.filter(function(x){ return x.nome === f.novo.nome; })[0];
      if (!c){ c = {id:S.prox.c++, nome:f.novo.nome, negocio:f.novo.negocio, canal:f.novo.canal, tipo:'Lead', etapa:'Novo contato', valor:650, followup:addDias(1), status:'entrada', tel:f.novo.tel, origem:f.novo.origem, nota:'', msgs:[], naoLidas:0, criado:HOJE}; S.contatos.push(c); }
    } else c = S.contatos.filter(function(x){ return x.nome === f.nome; })[0];
    if (!c) return;
    c.msgs.push({de:'cli', txt:f.txt, ts:agoraMs()}); c.status = 'entrada'; S.msgsCanal[c.canal] = (S.msgsCanal[c.canal] || 0) + 1;
    if (c.id !== sel || atual !== 'mensagens') c.naoLidas = (c.naoLidas || 0) + 1;
    salva();
    aviso('Nova mensagem de <b>' + esc(c.nome) + '</b> no ' + c.canal + (f.novo ? ' (novo lead)' : '') + '.');
    atualizaAoVivo(c);
    if (S.ia.ativo && c.canal !== 'E-mail'){
      setTimeout(function(){
        c.msgs.push({de:'ia', txt:respostaIA(f.txt, c.nome), ts:agoraMs()}); S.msgsCanal[c.canal] = (S.msgsCanal[c.canal] || 0) + 1; salva(); atualizaAoVivo(c);
      }, 2200);
    }
  }
  function atualizaAoVivo(c){
    desenhaNav();
    if (atual === 'mensagens'){ if (c.status !== aba && c.id !== sel) {} desenhaLista(); if (c.id === sel){ var ta = $('#texto'), v = ta ? ta.value : ''; desenhaConversa(); if (v) $('#texto').value = v; } }
    else if (atual === 'dashboard'){ vDash(); $$('.kpi').forEach(function(k){ k.classList.add('flash'); }); }
    else if (atual === 'funil') vFunil();
  }
  function ligaVivo(){ clearInterval(timer); if (vivo) timer = setInterval(chega, CONFIG.intervaloAoVivo); }
  if (!vivo){ $('#aovivo').setAttribute('aria-pressed', 'false'); $('#aovivo').style.display = 'none'; var dm = document.querySelector('.demo'); if (dm) dm.style.display = 'none'; }
  $('#aovivo').onclick = function(){ vivo = !vivo; this.setAttribute('aria-pressed', vivo); aviso(vivo ? 'Simulação ao vivo <b>ligada</b>.' : 'Simulação ao vivo pausada.'); ligaVivo(); };
  window.addEventListener('hashchange', function(){ var h = location.hash.slice(1); if (h === 'chatbot'){ abaAt = 'chatbot'; h = 'assistente'; if (atual === 'assistente'){ vAtendimento(); return; } } if (h && h !== atual && VISTAS.some(function(v){ return v.id === h; })) vai(h); });

  document.addEventListener('focusin', function(e){ if (e.target.matches('textarea, input:not([type=checkbox]):not([type=date]):not([type=time]), select')) document.body.classList.add('teclado'); });
  document.addEventListener('focusout', function(){ setTimeout(function(){ if (!document.activeElement || !document.activeElement.matches('textarea, input, select')) document.body.classList.remove('teclado'); }, 50); });
  document.addEventListener('click', function(){ var pf = $('#popFiltro'); if (pf && !pf.hidden){ pf.hidden = true; $('#btnFiltro').setAttribute('aria-expanded', 'false'); } });
  function recarrega(){
    try {
      var n = JSON.parse(localStorage.getItem(CHAVE));
      if (!n || !n.contatos) return;
      var ta = $('#texto'), rasc = ta ? ta.value : '', foco = ta && document.activeElement === ta;
      var md = $('#modal'), modalAberto = md && md.open;
      S = Core.garante(n); if (!S.ia) S.ia = semente().ia;
      if (modalAberto) return; // não redesenha por baixo de um formulário aberto
      desenha();
      var t2 = $('#texto'); if (t2 && rasc){ t2.value = rasc; t2.dispatchEvent(new Event('input')); }
      if (t2 && foco) t2.focus();
    } catch (e) {}
  }
  window.addEventListener('nuvem:atualizado', function(e){
    recarrega();
    var d = e.detail || {};
    if (d.novas && d.nome) aviso('Nova mensagem de <b>' + esc(d.nome) + '</b> no WhatsApp.');
  });
  window.addEventListener('nuvem:canais', function(){ if (atual === 'canais') desenha(); });
  window.addEventListener('nuvem:pronto', function(){
    if (!iaLogado() || iaSt) return;
    Nuvem.ia('GET').then(function(j){ iaSt = j; return carregaChatIA(); }).then(function(){ desenhaNav(); if (atual === 'mensagens' || atual === 'dashboard') recarrega(); }).catch(function(){});
  });
  window.addEventListener('nuvem:iachat', function(e){
    var m = e.detail; if (!m || !iaChatAdd(m)) return;
    var aberto = sel === 'ia' && atual === 'mensagens' && !document.hidden;
    if (aberto){
      iaMarcaLido();
      if (!iaPensando){ var ta = $('#texto'), v = ta ? ta.value : ''; desenhaIA(); if (v) $('#texto').value = v; }
      desenhaLista();
    } else {
      desenhaNav(); if (atual === 'mensagens') desenhaLista();
      if (m.de === 'ia' && (m.tipo === 'aviso' || m.tipo === 'resumo')) aviso('<b>Assistente:</b> ' + esc(m.tipo === 'resumo' ? 'o resumo do dia chegou.' : m.txt.slice(0, 120)));
    }
  });
  window.addEventListener('storage', function(e){ if (e.key === CHAVE) recarrega(); });
  window.addEventListener('pageshow', function(e){ if (e.persisted) recarrega(); });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) recarrega(); });
  var mq = window.matchMedia('(max-width:760px)');
  (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(function(){ if (atual === 'dashboard') vDash(); });

  /* tema claro / escuro / igual ao sistema (escolha em Configurações → Aparência e conta) */
  function temaEscolhido(){ try { return localStorage.getItem('abertocore-tema') || 'sistema'; } catch (e){ return 'sistema'; } }
  function sistemaEscuro(){ try { return matchMedia('(prefers-color-scheme: dark)').matches; } catch (e){ return false; } }
  function aplicaTema(modo){
    if (modo){ try { if (modo === 'sistema') localStorage.removeItem('abertocore-tema'); else localStorage.setItem('abertocore-tema', modo); } catch (e){} }
    var m = temaEscolhido(), escuro = m === 'escuro' || (m === 'sistema' && sistemaEscuro());
    if (escuro) document.documentElement.setAttribute('data-tema', 'escuro'); else document.documentElement.removeAttribute('data-tema');
    var cor = document.getElementById('corTema'); if (cor) cor.setAttribute('content', escuro ? '#161E2B' : '#FFFFFF');
  }
  aplicaTema();
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ if (temaEscolhido() === 'sistema'){ aplicaTema(); if (atual === 'dashboard') vDash(); } }); } catch (e){}
  window.addEventListener('nuvem:status', function(e){ e.preventDefault(); aviso(esc(e.detail.texto)); });
  window.addEventListener('nuvem:estado', function(){ if (atual === 'ajustes') vAjustes(); });

  desenha();
  ligaVivo();
  if (CONVITE) telaConvite(CONVITE);
  if (vivo) setTimeout(chega, 6000);
})();
</script>
</body>
