# TradingJourney: ajustes sobre o docker-compose.yml oficial do Supabase self-hosted.
# Copiado para /srv/tradingjourney/supabase pelo instala.sh (COMPOSE_FILE no .env aponta para os dois).
# Nada de segredo aqui: os valores vêm do .env e do functions.env, que só existem na VPS.
services:
  # O gateway não abre porta no servidor: o Caddy da infra fala com ele pela rede "borda".
  api-gw:
    ports: !reset []
    networks: [default, borda]

  # O pooler também não fica exposto na internet (o banco só é acessado de dentro).
  supavisor:
    ports: !reset []

  auth:
    environment:
      # Os e-mails de login saem pela edge function send-auth-email (Resend), como no Supabase cloud
      GOTRUE_HOOK_SEND_EMAIL_ENABLED: "true"
      GOTRUE_HOOK_SEND_EMAIL_URI: ${SUPABASE_PUBLIC_URL}/functions/v1/send-auth-email
      GOTRUE_HOOK_SEND_EMAIL_SECRETS: ${SEND_EMAIL_HOOK_SECRET}
      GOTRUE_MAILER_OTP_LENGTH: "6"

  functions:
    env_file: [/srv/tradingjourney/functions.env]
    environment:
      VERIFY_JWT: "true"
      # Funções que se autenticam sozinhas (verify_jwt = false no supabase/config.toml do projeto)
      FUNCTIONS_NO_VERIFY_JWT: ninjatrader-sync,create-checkout-session,exchange-google-code,get-yahoo-finance,stripe-webhook,send-push,send-auth-email,push-scheduler

networks:
  borda:
    external: true
    name: infra_borda
